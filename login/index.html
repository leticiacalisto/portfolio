<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Login - Painel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ===================== VARIÁVEIS DO DESIGN SYSTEM ===================== */
  :root{
    --coral: #D4572A;
    --coral-escuro: #B8461F;
    --creme: #F5F3EF;
    --branco: #FFFFFF;
    --grafite: #1A1816;
    --texto-suave: #6B645C;
    --borda: #DDD8D0;
    --verde-sucesso: #2D7A4F;
    --vermelho-erro: #C4453C;
  }

  *,*::before,*::after{ box-sizing: border-box; }

  body{
    margin:0;
    min-height: 100vh;
    background: var(--creme);
    color: var(--grafite);
    font-family: "Outfit", sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .tela-login{ width:100%; }

  .cartao-login{
    max-width: 420px;
    margin: 0 auto;
    background: var(--branco);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(26,24,22,0.10);
    padding: 40px 36px;
  }

  .logo{
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 1.3rem;
    text-align:center;
    margin-bottom: 24px;
  }
  .logo .ponto{ color: var(--coral); }

  h1{
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.7rem;
    text-align:center;
    margin: 0 0 8px;
  }

  .subtitulo{
    text-align:center;
    color: var(--texto-suave);
    font-size: .92rem;
    margin: 0 0 28px;
  }

  label{
    display:block;
    font-weight: 500;
    font-size: .88rem;
    margin: 16px 0 6px;
  }

  input{
    width:100%;
    font-family:inherit;
    font-size: 1rem;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--borda);
    background: var(--creme);
    color: var(--grafite);
    transition: border-color .2s ease;
  }
  input:focus{
    outline:none;
    border-color: var(--coral);
  }

  .link-esqueci{
    display:block;
    background:none;
    border:none;
    color: var(--coral);
    font-family: inherit;
    font-size: .85rem;
    font-weight: 500;
    text-align: right;
    width:100%;
    margin-top: 10px;
    cursor:pointer;
    padding: 4px 0;
  }
  .link-esqueci:hover{ color: var(--coral-escuro); text-decoration: underline; }

  .btn-entrar{
    width:100%;
    margin-top: 22px;
    background: var(--coral);
    color: var(--branco);
    border:none;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 600;
    font-size: 1rem;
    padding: 15px;
    cursor:pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .btn-entrar:hover:not(:disabled){ background: var(--coral-escuro); transform: translateY(-1px); }
  .btn-entrar:disabled{ opacity:.7; cursor: default; }

  .faixa-erro, .faixa-sucesso{
    border-radius: 14px;
    padding: 12px 16px;
    font-size: .88rem;
    font-weight: 500;
    margin-bottom: 18px;
    text-align:center;
  }
  .faixa-erro{ background: rgba(196,69,60,0.10); color: var(--vermelho-erro); }
  .faixa-sucesso{ background: rgba(45,122,79,0.10); color: var(--verde-sucesso); }

  [hidden]{ display:none !important; }

  a, button{ font-family: inherit; }

  @media (max-width: 480px){
    .cartao-login{ padding: 32px 24px; border-radius: 20px; }
  }
</style>
</head>
<body>

<main class="tela-login">
  <div class="cartao-login">
    <div class="logo">meu<span class="ponto">.</span>painel</div>
    <h1>Acesso restrito</h1>
    <p class="subtitulo">Faça login para ver os números do seu portfólio.</p>

    <div class="faixa-erro" id="faixaErro" hidden></div>
    <div class="faixa-sucesso" id="faixaSucesso" hidden></div>

    <!-- Formulário de login -->
    <form id="formLogin" novalidate>
      <label for="campoEmail">E-mail</label>
      <input type="email" id="campoEmail" required autocomplete="username">

      <label for="campoSenha">Senha</label>
      <input type="password" id="campoSenha" required autocomplete="current-password">

      <button type="button" class="link-esqueci" id="btnEsqueci">Esqueci minha senha</button>
      <button type="submit" class="btn-entrar" id="btnEntrar">Entrar</button>
    </form>

    <!-- Formulário de recuperação de senha (fica escondido até clicar em "Esqueci minha senha") -->
    <form id="formRecuperar" novalidate hidden>
      <label for="campoEmailRecuperar">E-mail</label>
      <input type="email" id="campoEmailRecuperar" required autocomplete="username">

      <button type="submit" class="btn-entrar" id="btnRecuperar">Enviar link de recuperação</button>
      <button type="button" class="link-esqueci" id="btnVoltarLogin">Voltar para o login</button>
    </form>
  </div>
</main>

<!-- Caminhos relativos (../) porque este arquivo mora na pasta login/,
     assim funciona tanto abrindo direto no navegador quanto publicado -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/auth.js"></script>
<script>
(async function () {
  // Se já existe sessão ativa, pula direto para o painel
  const { data: sessaoAtual } = await Auth.sb.auth.getSession();
  if (sessaoAtual.session) {
    window.location.href = "../painel.html";
    return;
  }

  const formLogin = document.getElementById("formLogin");
  const formRecuperar = document.getElementById("formRecuperar");
  const btnEsqueci = document.getElementById("btnEsqueci");
  const btnVoltarLogin = document.getElementById("btnVoltarLogin");
  const faixaErro = document.getElementById("faixaErro");
  const faixaSucesso = document.getElementById("faixaSucesso");
  const btnEntrar = document.getElementById("btnEntrar");
  const btnRecuperar = document.getElementById("btnRecuperar");

  function mostrarErro(msg) {
    faixaSucesso.hidden = true;
    faixaErro.textContent = msg;
    faixaErro.hidden = false;
  }
  function mostrarSucesso(msg) {
    faixaErro.hidden = true;
    faixaSucesso.textContent = msg;
    faixaSucesso.hidden = false;
  }
  function limparFaixas() {
    faixaErro.hidden = true;
    faixaSucesso.hidden = true;
  }

  // Alterna entre o formulário de login e o de recuperação de senha
  btnEsqueci.addEventListener("click", () => {
    limparFaixas();
    formLogin.hidden = true;
    formRecuperar.hidden = false;
  });
  btnVoltarLogin.addEventListener("click", () => {
    limparFaixas();
    formRecuperar.hidden = true;
    formLogin.hidden = false;
  });

  formLogin.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    limparFaixas();

    const email = document.getElementById("campoEmail").value.trim();
    const senha = document.getElementById("campoSenha").value;

    btnEntrar.disabled = true;
    btnEntrar.textContent = "Entrando...";

    try {
      await Auth.login(email, senha);
      window.location.href = "../painel.html";
    } catch (erro) {
      mostrarErro(erro.message || "Não foi possível entrar. Tente novamente.");
      btnEntrar.disabled = false;
      btnEntrar.textContent = "Entrar";
    }
  });

  formRecuperar.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    limparFaixas();

    const email = document.getElementById("campoEmailRecuperar").value.trim();

    btnRecuperar.disabled = true;
    btnRecuperar.textContent = "Enviando...";

    try {
      await Auth.recuperarSenha(email);
      mostrarSucesso("Link de recuperação enviado! Confira seu e-mail.");
    } catch (erro) {
      mostrarErro("Não foi possível enviar o link. Verifique o e-mail digitado.");
    }

    btnRecuperar.disabled = false;
    btnRecuperar.textContent = "Enviar link de recuperação";
  });
})();
</script>
</body>
</html>
