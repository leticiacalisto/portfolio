<title>Roteiro para aprovação | Letícia Calisto</title>
<meta name="description" content="Roteiro UGC da Letícia Calisto para aprovação da marca.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../imagens/icone.svg" type="image/svg+xml">
<link rel="icon" href="../imagens/icone-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../imagens/icone-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   VISUAL: página branca e limpa, no estilo Apple, que veste a
   identidade de cada marca: o logo no topo, a cor da marca como
   acento e um bloco escuro para o gancho. As cores (--marca,
   --marca-escura, --marca-clara, --marca-texto) vêm do moodboard
   do roteiro (campo "tema"), calculadas no JS.
   ========================================================= */
:root{
  --fundo:#ffffff;
  --cinza:#f5f5f7;
  --tinta:#1d1d1f;
  --tinta-suave:#6e6e73;
  --linha:#e5e5ea;
  --verde:#1e7a3e;
  --marca:#991a0e;
  --marca-escura:#1d1d1f;
  --marca-clara:#f6e4e2;
  --marca-texto:#991a0e;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--marca);outline-offset:3px;border-radius:6px;}
[hidden]{display:none !important;}

.pagina{max-width:920px;margin:0 auto;padding:0 20px 88px;}

/* ---------- Topo: logo da marca + assinatura ---------- */
.topo{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid var(--linha);}
.topo .assina{font-size:.8rem;color:var(--tinta-suave);text-align:right;line-height:1.35;}
.topo .assina b{display:block;color:var(--tinta);font-weight:600;}
.marca-logo{display:inline-flex;align-items:center;height:44px;}
.marca-logo img{display:block;height:100%;width:auto;max-width:180px;object-fit:contain;}
.marca-logo.escuro{height:52px;padding:8px 14px;border-radius:12px;background:var(--marca-escura);}
.marca-nome{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;}
.topo-dir{display:flex;align-items:center;gap:14px;}
/* Chave de idioma (só aparece quando o roteiro tem tradução) */
.idioma{display:inline-flex;padding:3px;border-radius:99px;background:var(--cinza);border:1px solid var(--linha);}
.idioma button{border:0;background:none;padding:6px 12px;border-radius:99px;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--tinta-suave);cursor:pointer;}
.idioma button[aria-pressed="true"]{background:var(--tinta);color:#fff;}
@media (max-width:520px){.topo-dir{flex-direction:column-reverse;align-items:flex-end;gap:8px;}}

/* ---------- Capa ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center;padding:52px 0 44px;}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--marca-texto);}
.hero h1{font-size:clamp(2.2rem,6.4vw,3.4rem);font-weight:700;line-height:1.03;letter-spacing:-.035em;margin:12px 0 16px;}
.hero .ideia{margin:0;font-size:1.12rem;line-height:1.55;color:var(--tinta-suave);}
.ficha{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;margin:28px 0 0;padding:22px 0 0;border-top:1px solid var(--linha);}
.ficha div{min-width:0;}
.ficha dt{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:3px;}
.ficha dd{margin:0;font-size:.93rem;line-height:1.4;}
.hero-foto{border-radius:28px;overflow:hidden;background:var(--marca-clara);aspect-ratio:4/5;}
.hero-foto img{display:block;width:100%;height:100%;object-fit:cover;}
@media (max-width:720px){
  .hero{grid-template-columns:1fr;gap:28px;padding:34px 0 30px;}
  .hero-foto{aspect-ratio:1/1;}
}

/* ---------- Avisos ---------- */
.aviso{margin:0 0 8px;padding:16px 20px;border-radius:18px;background:var(--cinza);font-size:.95rem;}
.aviso b{display:block;font-size:1rem;font-weight:600;margin-bottom:2px;}
.aviso.aprovado b{color:var(--verde);}
.aviso.ajuste b{color:var(--marca-texto);}
.instrucao{margin:0 0 8px;padding:16px 20px;border-radius:18px;background:var(--cinza);color:var(--tinta-suave);font-size:.95rem;}
.instrucao b{color:var(--tinta);font-weight:600;}

/* ---------- O gancho (o bloco forte da marca) ---------- */
.bloco-gancho{margin-top:44px;padding:clamp(28px,6vw,52px);border-radius:28px;background:var(--marca-escura);color:#fff;}
.bloco-gancho .eyebrow{color:var(--marca);}
.bloco-gancho p{margin:12px 0 0;font-size:clamp(1.5rem,4.4vw,2.3rem);font-weight:600;line-height:1.18;letter-spacing:-.025em;}

/* ---------- Seções ---------- */
.secao{margin-top:72px;}
.secao > .eyebrow{display:block;margin-bottom:8px;}
h2{font-size:clamp(1.6rem,4.6vw,2.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0 0 28px;}

/* ---------- Mood board ---------- */
.mood{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;}
@media (max-width:720px){.mood{grid-template-columns:1fr;gap:28px;}}
.sub{display:block;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:10px;}
.clima{margin:0;font-size:1.05rem;line-height:1.6;}
.tags{margin:14px 0 0;font-size:.9rem;font-weight:500;color:var(--marca-texto);}
.faixa{display:flex;height:76px;border-radius:18px;overflow:hidden;border:1px solid var(--linha);}
.faixa i{flex:1;}
.nomes{display:flex;margin-top:10px;}
.nomes span{flex:1;min-width:0;padding-right:6px;font-size:.74rem;line-height:1.3;color:var(--tinta-suave);}
.nomes b{display:block;color:var(--tinta);font-weight:500;font-size:.8rem;}
.imagens{display:grid;grid-template-columns:repeat(var(--colunas,3),1fr);gap:14px;margin-top:40px;}
@media (max-width:720px){.imagens{grid-template-columns:repeat(2,1fr);}}
.imagens figure{margin:0;}
.imagens .moldura{border-radius:20px;overflow:hidden;background:var(--cinza);aspect-ratio:4/5;}
.imagens img{display:block;width:100%;height:100%;object-fit:cover;}
.imagens figure.largo .moldura{background:#fff;border:1px solid var(--linha);}
.imagens figure.largo img{object-fit:contain;}
.imagens figcaption{margin-top:8px;font-size:.8rem;color:var(--tinta-suave);}

/* ---------- Cenas ---------- */
.cenas{border-top:1px solid var(--linha);}
.cena{display:grid;grid-template-columns:150px 1fr;gap:28px;padding:30px 0;border-bottom:1px solid var(--linha);}
.cena-lado .num{display:block;font-size:2.1rem;font-weight:700;letter-spacing:-.04em;line-height:1;color:#c7c7cc;}
.cena.destaque .num{color:var(--marca);}
.cena-lado .nome{display:block;margin-top:10px;font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.cena-lado .tempo{display:block;margin-top:2px;font-size:.82rem;color:var(--tinta-suave);}
@media (max-width:620px){
  .cena{grid-template-columns:1fr;gap:12px;padding:26px 0;}
  .cena-lado{display:flex;align-items:baseline;gap:10px;}
  .cena-lado .num{font-size:1.6rem;}
  .cena-lado .nome{margin-top:0;}
  .cena-lado .tempo{margin:0 0 0 auto;}
}
.campo{margin:0 0 14px;}
.campo:last-child{margin-bottom:0;}
.campo > b{display:block;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:4px;}
.campo.visual{color:var(--tinta-suave);font-size:.95rem;}
.fala{display:block;font-size:1.22rem;font-weight:500;line-height:1.42;letter-spacing:-.012em;color:var(--tinta);}
.tela{display:inline-block;padding:5px 12px;border-radius:99px;border:1.5px solid var(--marca);color:var(--marca-texto);font-weight:600;font-size:.84rem;}

/* ---------- Comentário por cena ---------- */
.comentar{margin-top:14px;}
.btn-comentar{background:none;border:0;padding:4px 0;font-size:.88rem;font-weight:600;color:var(--marca-texto);cursor:pointer;}
.btn-comentar::before{content:"+ ";}
.caixa-comentario{width:100%;min-height:84px;margin-top:6px;padding:12px 14px;border:1px solid var(--linha);border-radius:14px;background:var(--cinza);resize:vertical;font-size:.95rem;}
.caixa-comentario:focus{outline:2px solid var(--marca);outline-offset:1px;background:#fff;}
.comentario-lido{margin-top:14px;padding:12px 14px;border-left:3px solid var(--marca);background:var(--cinza);border-radius:0 14px 14px 0;font-size:.92rem;white-space:pre-wrap;}
.comentario-lido b{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--marca-texto);}

/* ---------- Variações de gancho ---------- */
.trocado{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:0 0 14px;padding:10px 14px;border-radius:14px;background:var(--marca-clara);font-size:.86rem;}
.trocado b{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--marca-texto);}
.intro{margin:-14px 0 24px;color:var(--tinta-suave);}
.ganchos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
.gancho{display:flex;flex-direction:column;padding:24px;border-radius:22px;background:var(--cinza);border:2px solid transparent;}
.gancho.em-uso{background:#fff;border-color:var(--marca);}
.gancho .tipo{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--marca-texto);}
.gancho .fala-g{display:block;margin:10px 0 12px;font-size:1.1rem;font-weight:600;line-height:1.35;letter-spacing:-.01em;}
.gancho .extra{margin:0 0 6px;font-size:.86rem;color:var(--tinta-suave);}
.gancho .acoes{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:auto;padding-top:14px;}
.btn-trocar{border-radius:99px;padding:10px 20px;font-weight:600;font-size:.9rem;cursor:pointer;border:0;background:var(--tinta);color:#fff;}
.btn-trocar:hover{background:var(--marca-escura);}
.btn-trocar:active{transform:scale(.98);}
.selo-uso{font-size:.86rem;font-weight:600;color:var(--marca-texto);}
/* ---------- Escolhas da marca (ex.: figurino) ---------- */
.opcao-foto{margin:0 0 14px;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:4/5;}
.opcao-foto img{display:block;width:100%;height:100%;object-fit:contain;}
.gancho .desc-op{margin:0 0 6px;font-size:.9rem;color:var(--tinta-suave);}
.btn-link{background:none;border:0;padding:4px 0;font-size:.86rem;font-weight:500;color:var(--tinta-suave);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

/* ---------- Detalhes ---------- */
.colunas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;align-items:start;}
.colunas h3{margin:0 0 12px;font-size:1.05rem;font-weight:600;letter-spacing:-.01em;}
.colunas ol,.colunas ul{margin:0;padding-left:20px;}
.colunas li{margin-bottom:8px;font-size:.95rem;color:#3a3a3c;}
.colunas li:last-child{margin-bottom:0;}
.colunas li::marker{color:var(--marca);}
.colunas i{color:var(--tinta-suave);}

/* ---------- Resposta ---------- */
.resposta{margin-top:72px;padding:clamp(24px,5vw,40px);border-radius:28px;background:var(--cinza);}
.resposta h2{margin-bottom:8px;}
.resposta p{margin:0 0 14px;color:var(--tinta-suave);}
.resposta .caixa-comentario{background:#fff;}
.contador{font-size:.88rem;color:var(--tinta-suave);margin:12px 0 0;}
.botoes{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}
.btn{flex:1 1 200px;border-radius:99px;padding:15px 22px;font-weight:600;font-size:1rem;cursor:pointer;border:1px solid var(--tinta);transition:transform .15s ease, opacity .15s ease;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5;cursor:default;}
.btn-ajuste{background:#fff;color:var(--tinta);border-color:var(--linha);}
.btn-aprovar{background:var(--tinta);color:#fff;}
.confirmar{margin-top:16px;padding:16px 18px;border-radius:18px;background:#fff;font-size:.95rem;}
.confirmar .botoes{margin-top:12px;}
.erro{color:var(--marca-texto);font-weight:600;margin-top:12px;}

.rodape{margin-top:72px;padding-top:20px;border-top:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.8rem;color:var(--tinta-suave);}
.rodape b{color:var(--tinta);font-weight:600;}
.carregando{padding:80px 0;text-align:center;color:var(--tinta-suave);}
</style>
</head>

      blocoGanchos = '<section class="secao"><span class="eyebrow">' + t("testarEy") + "</span><h2>" + t("testarH") + "</h2>" +
        (emAprovacao ? '<p class="intro">' + t("testarIntro") + "</p>" : "") +
        '<div class="ganchos" id="listaGanchos">' + htmlListaGanchos(emAprovacao) + "</div></section>";
    }

    var listas = (r.secoes || []).map(function (s) {
      var tag = s.numerada ? "ol" : "ul";
      return "<div><h3>" + esc(s.titulo) + "</h3><" + tag + ">" + (s.itens || []).map(function (x) { return "<li>" + rico(x) + "</li>"; }).join("") + "</" + tag + "></div>";
    }).join("");
    var secoes = listas ? '<section class="secao"><span class="eyebrow">' + t("detalhesEy") + "</span><h2>" + t("detalhesH") + '</h2><div class="colunas">' + listas + "</div></section>" : "";

    var geralLido = dados.comentarios && dados.comentarios.geral;
    var resposta = "";
    if (emAprovacao) {
      resposta = '<section class="resposta" id="resposta">' +
        "<h2>" + t("suaResposta") + "</h2>" +
        "<p>" + t("geralP") + "</p>" +
        '<textarea class="caixa-comentario" id="comentarioGeral" placeholder="' + esc(t("geralPh")) + '"></textarea>' +
        '<p class="contador" id="contador"></p>' +
        '<div class="botoes" id="botoes">' +
        '<button type="button" class="btn btn-ajuste" id="btnAjuste">' + t("solicitarAjuste") + "</button>" +
        '<button type="button" class="btn btn-aprovar" id="btnAprovar">' + t("aprovarRoteiro") + "</button>" +
        "</div>" +
        '<div class="confirmar" id="confirmar" hidden></div>' +
        '<p class="erro" id="erro" hidden></p>' +
        "</section>";
    } else if (geralLido) {
      resposta = '<section class="secao"><span class="eyebrow">' + t("suaResposta") + "</span><h2>" + t("comentarioGeral") + '</h2><div class="comentario-lido"><b>' + t("seuComentario") + "</b>" + esc(geralLido) + "</div></section>";
    }

    areaRoteiro.innerHTML =
      hero + aviso + blocoGancho + mood + htmlEscolhas(emAprovacao) +
      '<section class="secao"><span class="eyebrow">' + t("roteiroEy") + "</span><h2>" + t("roteiroH") + '</h2><div class="cenas">' + cenas + "</div></section>" +
      blocoGanchos + secoes + resposta +
      '<footer class="rodape"><span>' + t("tituloPagina") + " " + esc(r.marca) + " " + esc(r.numero) + " · " + esc(r.titulo) + "</span><b>Letícia Calisto</b></footer>";

    carregando.hidden = true;
    areaRoteiro.hidden = false;
    if (emAprovacao) ligarResposta();
  }

  function coletarComentarios() {
    var cenas = {};
    Array.prototype.forEach.call(areaRoteiro.querySelectorAll("textarea[data-cena]"), function (t) {
      var v = t.value.trim();
      if (v) cenas[t.getAttribute("data-cena")] = v;
    });
    var geral = document.getElementById("comentarioGeral");
    var saida = { cenas: cenas, geral: geral ? geral.value.trim() : "" };
    // A troca de gancho vai junto, com a variação completa (o painel mostra qual foi)
    // (sempre no texto original, em português, que é o que eu gravo, mesmo se a marca leu em inglês)
    var originais = (((dados && dados.conteudo) || {}).ganchos || []).filter(function (x) { return x && x.fala; });
    var g = escolhaGancho == null ? null : originais[escolhaGancho];
    if (g) saida.gancho = { indice: escolhaGancho, tipo: g.tipo || "", fala: g.fala, visual: g.visual || "", tela: g.tela || "" };
    // As escolhas da marca (ex.: figurino) vão com o nome da opção (o painel mostra qual foi)
    var escolhas = [];
    var escolhasOriginais = (((dados && dados.conteudo) || {}).escolhas || []).filter(function (x) { return x && (x.opcoes || []).some(function (o) { return o && o.nome; }); });
    escolhasOriginais.forEach(function (e, ie) {
      var io = escolhasFeitas[ie];
      var o = io == null ? null : opcoesDe(e)[io];
      if (o) escolhas.push({ escolha: ie, titulo: e.titulo || e.pergunta || "", indice: io, nome: o.nome });
    });
    if (escolhas.length) saida.escolhas = escolhas;
    return saida;
  }
  function totalComentarios(c) {
    return Object.keys(c.cenas).length + (c.geral ? 1 : 0) + (c.gancho ? 1 : 0);
  }
  function atualizarContador() {
    var c = coletarComentarios();
    var n = Object.keys(c.cenas).length;
    var partes = [];
    if (n) partes.push(n + (n === 1 ? t("cenaComentada") : t("cenasComentadas")));
    if (c.gancho) partes.push(t("ganchoTrocadoMin"));
    (c.escolhas || []).forEach(function (s) { partes.push((s.titulo || t("opcaoMin")) + ": " + s.nome); });
    document.getElementById("contador").textContent = partes.length ? partes.join(" · ") + "." : "";
  }

  function ligarResposta() {
    if (!ouvintesLigados) { ouvintesLigados = true; ligarOuvintes(); }
    restaurarERespostas();
  }
  // Os ouvintes da área do roteiro ficam ligados uma vez só (a área é redesenhada ao trocar de idioma)
  function ligarOuvintes() {
    // Abre a caixa de comentário da cena
    areaRoteiro.addEventListener("click", function (e) {
      if (dados.status !== "aprovacao") return;
      // Trocar o gancho (ou voltar ao original)
      var escolha = e.target.closest("[data-escolher]");
      var desfazer = e.target.closest("[data-desfazer]");
      if (escolha || desfazer) {
        if (escolha) {
          var partes = escolha.getAttribute("data-escolher").split(":");
          escolher(Number(partes[0]), Number(partes[1]));
        } else {
          escolher(Number(desfazer.getAttribute("data-desfazer")), null);
        }
        document.getElementById("erro").hidden = true;
        salvarRascunho();
        atualizarContador();
        return;
      }
      var trocar = e.target.closest("[data-trocar]");
      var original = e.target.closest("[data-original]");
      if (trocar || original) {
        trocarGancho(trocar ? Number(trocar.getAttribute("data-trocar")) : null);
        salvarRascunho();
        atualizarContador();
        if (trocar) {
          var cena = document.getElementById("camposGancho");
          if (cena) cena.closest(".cena").scrollIntoView({ behavior: "smooth", block: "center" });
        }
        return;
      }
      var botao = e.target.closest("[data-abrir]");
      if (!botao) return;
      var caixa = areaRoteiro.querySelector('textarea[data-cena="' + botao.getAttribute("data-abrir") + '"]');
      caixa.hidden = false;
      botao.hidden = true;
      caixa.focus();
    });
    areaRoteiro.addEventListener("input", function (e) {
      if (e.target.tagName !== "TEXTAREA") return;
      salvarRascunho();
      atualizarContador();
    });
  }

  function restaurarERespostas() {
    // Rascunho salvo neste aparelho volta pro lugar
    var rascunho = lerRascunho();
    if (rascunho) {
      Object.keys(rascunho.cenas || {}).forEach(function (i) {
        var caixa = areaRoteiro.querySelector('textarea[data-cena="' + i + '"]');
        if (!caixa) return;
        caixa.value = rascunho.cenas[i];
        caixa.hidden = false;
        areaRoteiro.querySelector('[data-abrir="' + i + '"]').hidden = true;
      });
      if (rascunho.geral) document.getElementById("comentarioGeral").value = rascunho.geral;
      if (rascunho.gancho && typeof rascunho.gancho.indice === "number" && listaGanchos()[rascunho.gancho.indice]) {
        trocarGancho(rascunho.gancho.indice);
      }
      (rascunho.escolhas || []).forEach(function (s) {
        var e = listaEscolhas()[s.escolha];
        if (e && opcoesDe(e)[s.indice]) escolher(s.escolha, s.indice);
      });
      atualizarContador();
    }

    var confirmar = document.getElementById("confirmar");
    var erro = document.getElementById("erro");

    function perguntar(html, rotuloSim, acao) {
      erro.hidden = true;
      confirmar.innerHTML = html + '<div class="botoes"><button type="button" class="btn btn-ajuste" id="btnNao">' + t("voltar") + '</button><button type="button" class="btn btn-aprovar" id="btnSim">' + rotuloSim + "</button></div>";
      confirmar.hidden = false;
      document.getElementById("botoes").hidden = true;
      document.getElementById("btnNao").onclick = function () {
        confirmar.hidden = true;
        document.getElementById("botoes").hidden = false;
      };
      document.getElementById("btnSim").onclick = function () { enviar(acao, this); };
    }

    document.getElementById("btnAprovar").addEventListener("click", function () {
      var faltando = escolhasFaltando();
      if (faltando.length) {
        erro.textContent = t("antesEscolha") + faltando.map(function (e) { return (e.titulo || t("umaOpcao")).toLowerCase(); }).join(t("e")) + ".";
        erro.hidden = false;
        var alvo = document.getElementById("escolha" + listaEscolhas().indexOf(faltando[0]));
        if (alvo) alvo.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      var c = coletarComentarios();
      var aviso = (c.gancho ? t("aprovarGancho") : "") +
        (c.escolhas || []).map(function (s) { return " " + (s.titulo || t("escolha")) + ": " + esc(s.nome) + "."; }).join("") +
        (Object.keys(c.cenas).length || c.geral ? t("aprovarComent") : "");
      perguntar(t("aprovarP") + aviso, t("simAprovar"), "aprovar");
    });
    document.getElementById("btnAjuste").addEventListener("click", function () {
      var c = coletarComentarios();
      if (!totalComentarios(c)) {
        erro.textContent = t("semComentario");
        erro.hidden = false;
        return;
      }
      var n = Object.keys(c.cenas).length;
      var resumo = [];
      if (n) resumo.push(n + (n === 1 ? t("cenaComentada") : t("cenasComentadas")));
      if (c.gancho) resumo.push(t("ganchoTrocadoMin"));
      if (c.geral) resumo.push(t("comentarioGeralMin"));
      perguntar(t("ajusteP") + esc(resumo.join(", ").replace(/^./, function (l) { return l.toUpperCase(); })) + t("ajusteP2"), t("enviarAjustes"), "ajuste");
    });
  }

  function enviar(acao, botao) {
    var erro = document.getElementById("erro");
    botao.disabled = true;
    botao.textContent = t("enviando");
    var comentarios = coletarComentarios();
    rpc("roteiro_responder", { p_token: token, p_acao: acao, p_comentarios: comentarios })
      .then(function (ok) {
        if (!ok) throw new Error("nao gravou");
        apagarRascunho();
        dados.status = acao === "aprovar" ? "aprovado" : "ajuste";
        dados.comentarios = comentarios;
        dados.respondido_em = new Date().toISOString();
        desenhar();
        window.scrollTo({ top: 0, behavior: "smooth" });
      })
      .catch(function () {
        botao.disabled = false;
        botao.textContent = acao === "aprovar" ? t("simAprovar") : t("enviarAjustes");
        erro.textContent = t("erroEnvio");
        erro.hidden = false;
      });
  }

  // Chave PT/EN no topo
  document.getElementById("topo").addEventListener("click", function (e) {
    var b = e.target.closest("[data-idioma]");
    if (b && dados) trocarIdioma(b.getAttribute("data-idioma"));
  });

  if (!token) {
    mostrarErro(t("linkIncompleto"));
    return;
  }
  chaveRascunho = "roteiro_rascunho_" + token.slice(0, 12);
  rpc("roteiro_abrir", { p_token: token })
    .then(function (resposta) {
      if (!resposta || !resposta.conteudo) throw new Error("sem roteiro");
      dados = resposta;
      idioma = idiomaInicial();
      desenhar();
    })
    .catch(function () {
      mostrarErro(t("naoEncontrei"));
    });
})();
</script>
</body>
</html>
