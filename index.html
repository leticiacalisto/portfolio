<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letícia Calisto | Criadora de conteúdo UGC</title>
<meta name="description" content="Letícia Calisto, criadora de conteúdo UGC. Vídeos e fotos autênticas que geram desejo, confiança e vendas para marcas.">
<meta name="theme-color" content="#f3eee9">

<!-- O ícone da aba do navegador. O SVG é o principal (fica nítido em qualquer
     tamanho); o PNG atende os navegadores que não aceitam SVG e também é o
     ícone de quando alguém salva o site na tela inicial do celular. -->
<link rel="icon" href="imagens/icone.svg" type="image/svg+xml">
<link rel="icon" href="imagens/icone-180.png" sizes="180x180">
<link rel="apple-touch-icon" href="imagens/icone-180.png">

<!-- Fontes do Google Fonts. O título da capa mistura League Spartan em caixa
     alta com Allura, cursiva. Fraunces segue nos títulos das demais seções.
     Nos textos gerais a primeira opção é a Avenir Next Arabic, que só aparece
     em quem tiver a fonte instalada, porque é paga e não pode ser incorporada
     aqui; a Mulish, gratuita e bem parecida, atende todo o resto -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=League+Spartan:wght@400;500;600;700;800&family=Mulish:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* =========================================================
   PALETA E VARIÁVEIS
   Quer mudar as cores do site? Troque os valores aqui.
   ========================================================= */
:root{
  --creme:#f3eee9;
  --creme-escuro:#e8e0d7;
  --tinta:#14110d;
  --tinta-suave:#4a443c;
  /* Estes dois guardaram o nome da cor que tinham no começo: o "azul" hoje é
     um cinza e o "laranja", o vermelho-tijolo de destaque do site. */
  --azul:#545454;
  --laranja:#991a0e;
  --branco:#fffdfb;

  --borda:rgba(20,17,13,.12);
  --sombra:0 1px 2px rgba(20,17,13,.04), 0 12px 32px rgba(20,17,13,.07);
  --sombra-forte:0 2px 6px rgba(20,17,13,.06), 0 24px 60px rgba(20,17,13,.12);

  --raio:14px;
  --raio-g:24px;

  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  /* Fonte de todos os textos gerais do site. A Avenir Next Arabic vem primeiro
     e é usada por quem tem a fonte instalada no aparelho. Como ela é paga e não
     pode ser embutida no site, a Mulish entra logo atrás para todo mundo mais. */
  --sans:"Avenir Next Arabic", "Avenir Next", "Avenir", "Mulish", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  /* Fontes do título da capa: a de impacto e a cursiva */
  --titulo-impacto:"League Spartan", system-ui, "Segoe UI", Arial, sans-serif;
  --titulo-cursiva:"Allura", "Segoe Script", cursive;
  /* A manuscrita do título do Sobre: a mesma Allura da capa */
  --titulo-manuscrita:"Allura", "Segoe Script", cursive;

  --altura-barra:40px;
  --altura-nav:70px;
  --altura-topo:calc(var(--altura-barra) + var(--altura-nav));
  /* Largura máxima do conteúdo. Foi ampliada junto com o respiro lateral, para
     dar mais margem nas beiradas sem encolher nada do que está dentro. */
  --largura:1440px;
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  margin:0;
  /* Listrado vertical no fundo, de propósito quase imperceptível. Para deixar
     mais visível, aumente o .016; para sumir de vez, troque por 0. A largura de
     cada faixa é o 26px. */
  background-color:var(--creme);
  background-image:repeating-linear-gradient(90deg,
    rgba(20,17,13,.016) 0 26px, rgba(20,17,13,0) 26px 52px);
  color:var(--tinta);
  font-family:var(--sans);
  font-size:clamp(16px,1.05vw,17px);
  line-height:1.65;
  /* "clip" e não "hidden": corta o excesso na horizontal do mesmo jeito, mas
     sem o efeito colateral de virar também uma área de rolagem por dentro —
     o que quebraria qualquer position:sticky que a página venha a ter. */
  overflow-x:clip;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;height:auto;}
a{color:inherit;}
button{font:inherit;color:inherit;}

h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.08;letter-spacing:-.02em;margin:0;}
h1{font-size:clamp(2.5rem,7.2vw,5rem);}
h2{font-size:clamp(1.95rem,4.6vw,3.3rem);}
h3{font-size:clamp(1.22rem,2vw,1.48rem);letter-spacing:-.01em;}
p{margin:0;}
em,.italico{font-style:italic;font-weight:400;}

/* Acessibilidade: foco sempre visível e link para pular o conteúdo */
:focus-visible{outline:3px solid var(--azul);outline-offset:3px;border-radius:4px;}
.pular{
  position:absolute;left:16px;top:-100px;z-index:999;
  background:var(--azul);color:#fff;padding:12px 20px;border-radius:var(--raio);
  text-decoration:none;font-weight:600;transition:top .2s ease;
}
.pular:focus{top:14px;}
/* Texto que fica só para os leitores de tela, invisível na tela */
.oculto-visual{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* =========================================================
   ESTRUTURA GERAL
   ========================================================= */
/* O respiro lateral do site. Aumente o 76px para afastar mais o conteúdo das
   beiradas; o 22px é o mínimo, usado no celular. */
.container{width:100%;max-width:var(--largura);margin:0 auto;padding-inline:clamp(22px,5vw,76px);}
section{padding-block:clamp(64px,9vw,120px);scroll-margin-top:calc(var(--altura-topo) + 12px);}

.rotulo{
  display:inline-flex;align-items:center;gap:10px;
  font-size:.74rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--azul);margin-bottom:18px;
}
.rotulo::before{content:"";width:26px;height:1px;background:var(--laranja);display:block;}
/* A barrinha e o pin de localização da etiqueta da capa. O pin usa a mesma cor
   do texto, então ele acompanha qualquer troca de cor. */
.rotulo__barra{opacity:.45;font-weight:400;}
.rotulo__local{display:inline-flex;align-items:center;gap:5px;}
.rotulo__pin{width:1.15em;height:1.15em;flex:none;fill:currentColor;}
.subtitulo{color:var(--tinta-suave);max-width:56ch;margin-top:18px;font-size:1.02rem;}
.cabecalho-secao{max-width:720px;margin-bottom:clamp(38px,5vw,58px);}

/* Botões */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  /* Botões retangulares, com os cantos levemente arredondados */
  padding:15px 30px;border-radius:12px;border:1.5px solid transparent;
  font-weight:600;font-size:.96rem;text-decoration:none;cursor:pointer;
  transition:transform .25s ease, background-color .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn--principal{background:var(--azul);color:#fff;box-shadow:0 10px 26px rgba(84,84,84,.24);}
.btn--principal:hover{background:#3d3d3d;}
.btn--vazado{background:transparent;color:var(--tinta);border-color:rgba(20,17,13,.28);}
.btn--vazado:hover{border-color:var(--tinta);background:rgba(20,17,13,.04);}

/* =========================================================
   1. TOPO E MENU
   ========================================================= */
.topo{
  position:fixed;inset:0 0 auto 0;z-index:100;
  border-bottom:1px solid transparent;
  transition:border-color .3s ease, box-shadow .3s ease;
}
.topo.rolou{border-bottom-color:var(--borda);box-shadow:0 6px 24px rgba(20,17,13,.05);}
/* SÃ³ a faixa do menu Ã© translÃºcida; a tarja verde de cima continua sÃ³lida */
.topo__menu{
  background:rgba(243,238,233,.5);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
}
.topo__interno{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:var(--altura-nav);}
/* A tarja de cima (Black Friday) e o menu ficam juntos, fixos no topo */
.topo__barra{
  background:#a8c7a1;color:var(--tinta);
  display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.6vw,22px);
  min-height:var(--altura-barra);padding:6px 20px;font-size:.86rem;white-space:nowrap;overflow:hidden;
}
.topo__barra[hidden]{display:none;}
/* No computador o trilho não interfere; no celular ele rola (ver RESPONSIVO) */
.barra__trilho{display:contents;}
.so-cel{display:none;}
.nichos-lista,.nichos__mais,.nicho--todos,.dica-deslize{display:none;}
ul.canais--cel{display:none;}
@keyframes caseProx{from{opacity:0;transform:translateX(70px);}to{opacity:1;transform:none;}}
@keyframes caseAnt{from{opacity:0;transform:translateX(-70px);}to{opacity:1;transform:none;}}
.barra__tag{
  background:var(--tinta);color:#a8c7a1;border-radius:100px;padding:4px 12px;
  font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
}
.barra__conta{font-weight:700;font-size:.92rem;}
.barra__conta b{font-variant-numeric:tabular-nums;font-weight:800;}
.barra__texto{opacity:.85;}
.barra__texto::before{content:"·";margin-right:clamp(10px,1.6vw,22px);opacity:.6;}
.barra__link{font-weight:700;font-size:.8rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.barra__link:hover{text-decoration:underline;}
.topo__acoes{display:flex;align-items:center;gap:14px;}
.idioma{display:inline-flex;border:1px solid var(--borda);border-radius:100px;padding:3px;background:rgba(255,255,255,.55);}
.idioma button{
  border:0;background:transparent;cursor:pointer;border-radius:100px;padding:5px 12px;
  font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--tinta-suave);
}
.idioma button[aria-pressed="true"]{background:var(--tinta);color:#fff;}
.topo .btn--topo{padding:11px 22px;font-size:.88rem;background:var(--tinta);color:#fff;box-shadow:none;border-radius:10px;}
.topo .btn--topo:hover{background:#3d3d3d;}
.logo{
  font-family:var(--serif);font-size:1.28rem;font-weight:600;letter-spacing:-.02em;
  text-decoration:none;display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap;
}
.logo i{font-style:italic;color:var(--azul);}
.logo b{width:6px;height:6px;border-radius:50%;background:var(--laranja);display:inline-block;}

.menu{display:flex;align-items:center;gap:clamp(16px,2.3vw,32px);list-style:none;margin:0;padding:0;}
.menu a{
  text-decoration:none;font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);
  position:relative;padding:6px 0;transition:color .2s ease;
}
.menu a::after{
  content:"";position:absolute;left:0;bottom:0;height:1.5px;width:0;background:var(--azul);
  transition:width .3s cubic-bezier(.22,.61,.36,1);
}
.menu a:hover,.menu a.ativo{color:var(--tinta);}
.menu a:hover::after,.menu a.ativo::after{width:100%;}
.menu .btn{padding:11px 22px;font-size:.9rem;color:#fff;}
.menu .btn::after{display:none;}

.hamburguer{
  display:none;width:46px;height:46px;border:1px solid var(--borda);border-radius:12px;
  background:transparent;cursor:pointer;position:relative;
}
.hamburguer span{
  position:absolute;left:13px;width:20px;height:1.8px;background:var(--tinta);border-radius:2px;
  transition:transform .3s ease, opacity .2s ease, top .3s ease;
}
.hamburguer span:nth-child(1){top:16px;}
.hamburguer span:nth-child(2){top:22px;}
.hamburguer span:nth-child(3){top:28px;}
.hamburguer[aria-expanded="true"] span:nth-child(1){top:22px;transform:rotate(45deg);}
.hamburguer[aria-expanded="true"] span:nth-child(2){opacity:0;}
.hamburguer[aria-expanded="true"] span:nth-child(3){top:22px;transform:rotate(-45deg);}

/* =========================================================
   2. HERO
   ========================================================= */
/* A capa é baixa de propósito: quem manda na altura é a altura da foto,
   definida em .hero__foto logo abaixo. */
/* O padding de cima soma a altura do menu fixo (que flutua sobre a página) com
   um respiro. Diminuir o respiro sobe o conteúdo inteiro sem mexer em tamanho
   nenhum; ele não pode chegar a zero, senão a etiqueta entra embaixo do menu. */
.hero{--capa-base:clamp(30px,3.6vw,56px);padding-top:calc(var(--altura-topo) + clamp(6px,.9vw,12px));padding-bottom:var(--capa-base);}
/* A coluna do texto reserva o necessário para o título de 80px caber em duas
   linhas, e todo o resto da largura vai para a foto */
.hero__grade{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(16px,2.2vw,30px);align-items:center;}
/* Título da capa: duas letras conversando. A parte de impacto é grande e
   ocupa a largura da coluna; a cursiva fecha a frase, menor, subindo um pouco
   por cima da linha anterior. As quebras de linha vêm dos <br> do campo
   titulo.impacto, no CONFIG. */
.hero h1{margin-bottom:20px;letter-spacing:normal;}
.titulo__impacto{
  display:block;font-family:var(--titulo-impacto);font-weight:700;
  text-transform:uppercase;letter-spacing:-.02em;line-height:.96;
  /* Chega a 80px nas telas grandes e encolhe sozinho nas menores */
  font-size:clamp(2rem,5.7vw,5rem);
  color:#cfc8c3;
}
.titulo__cursiva{
  display:block;font-family:var(--titulo-cursiva);font-weight:400;
  /* A Allura desenha as letras bem menores do que o tamanho declarado, por ser
     manuscrita e de corpo baixo. Por isso o número aqui parece alto: na tela
     ela aparece bem menor que a League Spartan. */
  font-size:clamp(2.6rem,5.8vw,4.6rem);line-height:.9;color:var(--azul);
  /* A margem negativa encaixa a cursiva na linha de cima; o padding embaixo
     dá espaço para o rabinho das letras não ser cortado */
  margin-top:-.06em;margin-left:.04em;padding-bottom:.12em;
}
.hero h1 em,.hero h1 .italico{color:var(--azul);}
/* Texto de apoio da capa: mesma fonte dos textos gerais do site */
.hero__texto{max-width:44ch;color:var(--tinta-suave);font-size:clamp(.88rem,.95vw,.97rem);line-height:1.6;}
/* Linha dos números, com a barrinha separando */
.hero__meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 13px;margin-top:24px;font-size:clamp(.92rem,1vw,1rem);font-weight:700;color:var(--tinta);}
.hero__meta .separador{color:var(--laranja);font-weight:400;}
.hero__acoes{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px;}

/* Foto da capa: sem moldura, puxada para a direita e descendo até encostar na
   faixa branca de marcas, por causa da margem negativa embaixo.
   O enquadramento (da cabeça até a cintura) vem da proporção 3/4 em aspect-ratio:
   como ela é fixa, o corte fica igual no computador e no celular. Foto mais
   estreita mostra mais corpo; foto mais larga aproxima mais o rosto. */
.hero__visual{
  position:relative;align-self:end;
  /* Afasta a foto da borda direita. Aumentar este valor traz a foto mais para a
     esquerda e abre espaço para o balão do lado direito. A coluna da foto
     cresceu junto, para ela andar sem encolher. */
  margin-right:clamp(10px,6.6vw,95px);
  margin-bottom:calc(-1 * var(--capa-base));
}
.hero__foto{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;}

/* Flutuação lenta: sobe e desce 6px. Cada balão usa um tempo diferente, para
   um não acompanhar o outro. */
@keyframes flutuar{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

/* Balões de feedback que flutuam sobre a foto: um embaixo à esquerda e outro
   em cima à direita. Os valores de left, right, top e bottom são o que move
   cada um; os negativos fazem o balão passar da borda da foto. */
.balao{
  position:absolute;z-index:3;margin:0;opacity:.9;
  display:flex;align-items:center;gap:10px;
  width:clamp(180px,18vw,232px);
  background:var(--branco);border:1px solid var(--borda);border-radius:14px;
  padding:10px 13px;
  box-shadow:0 2px 5px rgba(20,17,13,.05), 0 14px 30px rgba(20,17,13,.12);
  animation:flutuar 7.4s ease-in-out infinite;
}
.balao--1{left:-38%;bottom:11%;}
.balao--2{right:-26%;top:12%;animation-duration:8.8s;animation-delay:-2.6s;}
/* Mesmo right do balão de cima, para os dois ficarem alinhados pela direita */
.balao--3{right:-26%;top:29%;animation-duration:8s;animation-delay:-5.1s;}
/* A bolinha com a logo da marca */
.balao__logo{
  flex:none;width:34px;height:34px;border-radius:50%;
  background:#fff;border:1px solid var(--borda);
  display:grid;place-items:center;overflow:hidden;
}
.balao__logo img{width:74%;height:74%;object-fit:contain;}
.balao__texto{margin:0;font-size:.74rem;line-height:1.4;color:var(--tinta);font-weight:500;}

/* Blocos em gradiente que simulam as fotos e os vídeos */
.visual{
  position:relative;width:100%;border-radius:var(--raio-g);overflow:hidden;
  box-shadow:var(--sombra);background:var(--creme-escuro);
}
.visual::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 20% 10%, rgba(255,255,255,.24), transparent 60%);
}
.visual img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;}
/* Quando o bloco tem foto, o brilho de cima sai para não lavar a imagem */
.visual--foto::after{display:none;}
.visual--retrato{aspect-ratio:4/5;}
.visual--quadrado{aspect-ratio:1/1;}
.visual--vertical{aspect-ratio:9/13;}

/* =========================================================
   3. FAIXA DE MARCAS
   ========================================================= */
/* Tarja fina e escura que desliza para a esquerda sem parar. O cinza dela é de
   propósito mais fechado que o --azul do resto do site, para a tarja pesar
   como uma linha de separação entre a capa e o conteúdo. */
.faixa{background:#414141;padding-block:13px;overflow:hidden;}
/* Estilo do título, caso você queira voltar a mostrá-lo acima da tarja */
.faixa__titulo{
  text-align:center;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;font-weight:700;margin:0 0 10px;padding-inline:20px;
}
.marquise{
  position:relative;display:flex;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
}
.marquise__trilho{display:flex;width:max-content;animation:correr 38s linear infinite;}
.marquise:hover .marquise__trilho,.marquise:focus-within .marquise__trilho{animation-play-state:paused;}
/* O padding-left:0 é essencial: o navegador dá 40px de recuo a qualquer <ul>,
   e esse recuo não aparece no começo da tarja mas reaparece na emenda entre
   a última cópia e a primeira, abrindo um vão maior que o dos outros itens. */
.marquise__grupo{
  display:flex;align-items:center;list-style:none;margin:0;
  gap:clamp(20px,2.4vw,32px);
  padding-left:0;padding-right:clamp(20px,2.4vw,32px);
}
.marquise__grupo li{
  display:flex;align-items:center;gap:clamp(20px,2.4vw,32px);
  font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  white-space:nowrap;color:#fff;
}
/* O losango que separa um serviço do outro */
.marquise__grupo li::after{content:"◆";font-size:.6rem;color:var(--laranja);letter-spacing:0;}
@keyframes correr{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* =========================================================
   4. SOBRE
   ========================================================= */
/* Esta seção é a única sem o listrado do fundo: a cor cheia dá um respiro no
   meio da página. Para trazer o listrado de volta, apague a linha do background. */
#sobre{background-color:#fffcf5;padding-block:clamp(56px,7vw,92px);}
/* As margens laterais desta seção são mais largas que as do resto do site, de
   propósito: o conteúdo fica mais baixo e mais horizontal. Diminua o 1060px
   para apertar ainda mais, aumente para ocupar a largura toda. */
.sobre__grade{
  display:grid;grid-template-columns:.9fr 1.2fr;gap:clamp(34px,5vw,72px);
  align-items:center;max-width:1320px;
  /* A margem da esquerda é larga e a da direita é estreita, de propósito: é o
     que faz o texto avançar para a direita e quebrar em menos linhas. */
  padding-left:clamp(22px,14vw,200px);
  padding-right:clamp(22px,4vw,56px);
}
/* O título sai todo na Allura, numa linha só, com o nome em negrito. O último
   número do clamp é o tamanho nas telas grandes. */
.titulo__manuscrita{
  display:block;font-family:var(--titulo-manuscrita);font-weight:400;
  /* A Allura desenha as letras bem menores que o tamanho declarado, por ser
     manuscrita e de corpo baixo: por isso o número aqui parece alto. */
  /* Este tamanho é o da frase pequena; o nome vem logo abaixo, bem maior */
  font-size:clamp(1.6rem,3.1vw,2.8rem);line-height:1.1;letter-spacing:.02em;
  color:var(--azul);margin-left:.06em;
  /* O padding embaixo dá espaço para o rabinho das letras não ser cortado */
  padding-bottom:.1em;
}
/* O nome sai duas vezes maior que a frase e é ele que manda no tamanho do
   título. Para mudar só o nome, mexa no 2.05em; para mudar só a frase, no
   clamp de cima. */
.titulo__manuscrita b{font-weight:700;color:var(--tinta);font-size:1.5em;}
/* Uma sombra um pouco mais presente que a do resto do site, só na foto daqui:
   como o fundo desta seção é liso, ela é o que dá volume ao retângulo. */
.sobre__visual .visual{box-shadow:0 4px 12px rgba(20,17,13,.08), 0 34px 70px rgba(20,17,13,.22);}
/* O texto desta seção é um ponto menor que o do resto do site, e os trechos em
   negrito saem na cor cheia para funcionarem como destaque de leitura */
.sobre__corpo{margin-top:20px;}
.sobre__corpo p{font-size:.94rem;}
.sobre__corpo p + p{margin-top:16px;color:var(--tinta-suave);}
.sobre__corpo b{font-weight:700;color:var(--tinta);}
/* Os selos em formato de pílula, embaixo do texto. O primeiro sai preenchido e
   os outros ficam só com o contorno. */
.sobre__selos{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:12px;}
.sobre__selos li{
  border:1px solid var(--borda);border-radius:999px;background:var(--branco);
  padding:11px 22px;font-size:.9rem;color:var(--tinta-suave);
}
.sobre__selos li.destaque{background:var(--creme-escuro);border-color:transparent;color:var(--tinta);font-weight:600;}

/* =========================================================
   5. MARCAS PARCEIRAS
   ========================================================= */
/* Mesmo fundo da seção Sobre, com um fio separando as duas */
#marcas{
  background-color:#fffcf5;border-top:1px solid var(--borda);
  border-bottom:1px solid var(--borda);
  padding-block:clamp(22px,2.6vw,34px);
}
/* A etiqueta centralizada, com o risquinho dos dois lados */
.rotulo--centro{display:flex;justify-content:center;margin:0 auto clamp(12px,1.4vw,18px);color:var(--tinta-suave);}
.rotulo--centro::after{content:"";width:26px;height:1px;background:var(--laranja);display:block;}
/* A tarja das logos corre mais devagar que a dos serviços, porque o trilho é
   muito mais comprido. Aumente os 140s para deixar mais lenta, diminua para
   deixar mais rápida. */
.marquise--logos .marquise__trilho{animation-duration:140s;}
/* Uma folga em cima e embaixo (anulada pela margem negativa, para a tarja
   continuar com a mesma altura de antes) para a bolinha destacada não ser
   cortada pela borda da tarja */
.marquise--logos{padding-block:9px;margin-block:-9px;}
.marquise--logos .marquise__grupo{gap:clamp(14px,1.6vw,24px);padding-right:clamp(14px,1.6vw,24px);}
/* Aqui não entra o losango que separa os itens da tarja de serviços */
.marquise--logos .marquise__grupo li::after{content:none;}
.marca{
  flex:none;width:clamp(62px,6.6vw,88px);aspect-ratio:1/1;border-radius:50%;
  background:#fff;border:1px solid rgba(20,17,13,.05);
  box-shadow:0 2px 10px rgba(20,17,13,.05);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
/* Logo solta: fica inteira dentro da bolinha, com uma folga em volta */
.marca img{width:72%;height:72%;object-fit:contain;}
/* Logo comprida (tipo uma palavra deitada): pode usar mais largura, senão
   encolheria demais para caber na mesma caixa das logos quadradas. O site
   detecta isso sozinho ao carregar a imagem. */
.marca--larga img{width:84%;height:auto;max-height:52%;}
/* Logo com fundo próprio: abre até preencher a bolinha toda */
.marca--preenchida img{width:100%;height:100%;object-fit:cover;}
/* Logo branca ou bege, que sumiria no fundo branco: sai toda em preto.
   O brightness(0) escurece sem trocar a cor das outras, ao contrário do
   invert, que virava o branco em preto mas também mudava os coloridos. */
.marca--preta img{filter:brightness(0);}
/* A tarja das logos não para mais quando o mouse passa por cima: ela segue
   correndo e quem ganha destaque é só a bolinha que está embaixo do mouse.
   Para voltar a travar no hover, apague as duas linhas abaixo. */
.marquise--logos:hover .marquise__trilho,
.marquise--logos:focus-within .marquise__trilho{animation-play-state:running;}
/* O destaque da bolinha: sobe um tiquinho, cresce de leve e ganha sombra.
   Mexa no 1.07 para crescer mais ou menos. */
.marca{transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;}
.marca:hover{
  transform:translateY(-3px) scale(1.07);
  box-shadow:0 8px 20px rgba(20,17,13,.16);
  border-color:rgba(20,17,13,.12);
}

/* =========================================================
   6. CASE EM DESTAQUE
   ========================================================= */
/* Fecha o bloco claro que começa no Sobre: Sobre, marcas e case dividem o
   mesmo fundo, e o listrado só volta no portfólio. */
#case{background-color:#fffcf5;padding-block:clamp(36px,4.4vw,58px);}
/* Aqui a etiqueta é o título da seção, então pede mais respiro embaixo que a
   das marcas */
#case .rotulo--centro{margin-bottom:clamp(18px,2.2vw,28px);}
.case__grade{display:grid;grid-template-columns:1fr 1.18fr;gap:clamp(26px,4vw,60px);align-items:center;}
/* A pilha de vídeos: um card na frente e os outros cases espiando por trás,
   como no empilhamento de depoimentos. As setas ficam em cima, à direita. */
.case__fones{display:flex;flex-direction:column;align-items:center;gap:12px;}
.pilha__topo{
  width:var(--pilha-largura);display:flex;align-items:center;justify-content:space-between;
  font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-suave);font-weight:600;
}
.pilha__setas{display:flex;gap:6px;}
.pilha__seta{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--borda);background:var(--branco);
  color:var(--tinta);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  transition:background .2s ease, border-color .2s ease, transform .2s ease;
}
.pilha__seta:hover{background:var(--creme);border-color:rgba(20,17,13,.3);transform:translateY(-1px);}
.pilha__seta svg{width:13px;height:13px;fill:currentColor;}
.pilha{
  --pilha-largura:clamp(200px,20vw,280px);
  position:relative;width:var(--pilha-largura);aspect-ratio:9/16;margin-block:8px 14px;
}
.case__fones{--pilha-largura:clamp(200px,20vw,280px);}
.pilha__card{
  position:absolute;inset:0;border-radius:var(--raio-g);overflow:hidden;background:var(--creme-escuro);
  box-shadow:var(--sombra);transform-origin:50% 100%;
  transition:transform .55s cubic-bezier(.22,.61,.36,1), opacity .45s ease, box-shadow .45s ease;
}
.pilha__card[data-pos="0"]{z-index:3;box-shadow:var(--sombra-forte);}
.pilha__card[data-pos="1"]{z-index:2;transform:translate(13%,-2%) rotate(7deg) scale(.95);opacity:.5;}
.pilha__card[data-pos="2"]{z-index:1;transform:translate(-12%,0) rotate(-7deg) scale(.93);opacity:.5;}
.pilha__card[data-pos="1"] .pilha__conteudo,.pilha__card[data-pos="2"] .pilha__conteudo{filter:saturate(.35) brightness(1.12) contrast(.85);}
.pilha__conteudo,.pilha__capa,.pilha__frame{position:absolute;inset:0;width:100%;height:100%;border:0;}
.pilha__capa{object-fit:cover;}
.pilha__iniciar{
  position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer;z-index:2;
}
.pilha__card:not([data-pos="0"]) .pilha__iniciar{pointer-events:none;}
.pilha__iniciar .video__play{transition:transform .3s ease;}
.pilha__iniciar:hover .video__play{transform:translate(-50%,-50%) scale(1.08);}
.pilha__ver{
  font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--tinta-suave);
  text-decoration:none;border-bottom:1px solid rgba(20,17,13,.25);padding-bottom:2px;
  display:inline-flex;align-items:center;gap:7px;transition:color .2s ease,border-color .2s ease;
}
.pilha__ver:hover{color:var(--tinta);border-color:var(--tinta);}
.pilha__ver svg{width:12px;height:12px;fill:currentColor;}
.pilha__ver[hidden]{display:none;}
/* Os textos dos cases: só o do card da frente aparece */
.case__texto{display:grid;}
/* Todos os textos ocupam o mesmo lugar: a altura é a do maior, então a página não mexe ao trocar de case */
.case__item{grid-area:1/1;visibility:hidden;opacity:0;align-self:center;}
.case__item.ativo{visibility:visible;opacity:1;animation:caseEntrada .5s ease both;}
@keyframes caseEntrada{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.case__resultado b small{font-size:inherit;}
/* Citações dos clientes, reescritas a partir dos prints */
.case__citacoes{list-style:none;margin:clamp(8px,1vw,12px) 0 0;padding:0;display:grid;gap:5px;}
.case__citacoes li{
  background:#fff;border:1px solid var(--borda);border-radius:11px;
  padding:9px 14px;font-size:.92rem;line-height:1.45;color:var(--tinta);
}
.case__citacoes cite{display:block;margin-top:4px;font-size:.62rem;font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);}
.case__citacoes li.com-logo{display:flex;align-items:center;gap:10px;}
.citacao__logo{width:30px;height:30px;flex:none;border-radius:50%;object-fit:contain;padding:3px;background:#fff;border:1px solid var(--borda);}
/* Os destaques do case de ADS: uma marca por bloco */
.case__destaques{display:grid;gap:clamp(8px,1vw,12px);margin-top:clamp(8px,1vw,12px);}
.caso-marca{padding-top:clamp(8px,1vw,12px);border-top:1px solid var(--borda);}
.caso-marca:first-child{border-top:0;padding-top:0;}
/* Cada marca: a descrição em cima e, embaixo, um cartão de avaliação */
.destaque__texto{font-size:.95rem;line-height:1.5;color:var(--tinta-suave);margin:0 0 8px;}
.destaque__texto b{color:var(--tinta);font-weight:700;}
.avaliacao{
  background:#fff;border:1px solid var(--borda);border-radius:14px;
  padding:8px 13px 6px;box-shadow:0 1px 2px rgba(20,17,13,.03);
}
.avaliacao__topo{display:flex;align-items:center;gap:9px;margin-bottom:2px;}
.avaliacao__topo img{width:28px;height:28px;padding:4px;flex:none;border-radius:50%;object-fit:contain;background:#eaf3fb;}
.avaliacao__topo h3{margin:0;flex:1;font-size:.82rem;font-weight:700;color:var(--tinta);}
.avaliacao__estrelas{display:flex;gap:2px;color:#f5b301;font-size:.78rem;letter-spacing:1px;}
.avaliacao__corpo p{margin:0;padding:3px 0;font-size:.72rem;line-height:1.4;color:#8a8a94;}
.avaliacao__corpo p + p{border-top:1px solid var(--borda);}
/* O título do case sai na manuscrita da identidade, como o do Sobre */
.case__titulo{
  font-family:var(--titulo-cursiva);font-weight:400;letter-spacing:.01em;
  font-size:clamp(1.7rem,3.2vw,2.7rem);line-height:1.05;color:var(--azul);
  margin:0 0 clamp(8px,1.1vw,14px);padding-bottom:.08em;
}
.case__chamada{font-size:1.02rem;color:var(--tinta-suave);margin-bottom:8px;}
.case__chamada b{color:var(--tinta);font-weight:700;}
/* Os números grandes, na League Spartan da capa. As estrelinhas ficam atrás
   deles, do lado direito. */
.case__numeros{position:relative;list-style:none;margin:0;padding:0;}
.case__numeros li{
  font-family:var(--titulo-impacto);font-weight:700;text-transform:uppercase;
  font-size:clamp(1.05rem,1.85vw,1.55rem);line-height:1.18;letter-spacing:-.01em;
  color:var(--tinta);
}
.case__brilhos{position:absolute;right:-2%;top:-12%;width:clamp(70px,9vw,120px);opacity:.85;pointer-events:none;}
/* O painel de métricas do vídeo */
.case__painel{
  display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;
  margin:clamp(12px,1.6vw,18px) 0 clamp(12px,1.6vw,18px);
}
.case__metricas{
  list-style:none;margin:0;padding:6px 0;display:flex;flex:0 1 auto;
  background:#fff;border:1px solid var(--borda);border-radius:10px;
}
.case__metricas li{flex:none;text-align:center;padding:0 9px;min-width:48px;}
.case__metricas svg{width:12px;height:12px;fill:var(--tinta-suave);display:block;margin:0 auto 4px;}
.case__metricas span{font-size:.68rem;font-weight:600;color:var(--tinta);}
.case__resultado{
  background:#fff;border:1px solid var(--borda);border-radius:10px;
  padding:5px 10px;display:flex;flex-direction:column;justify-content:center;
}
.case__resultado small{font-size:.58rem;color:var(--tinta-suave);display:block;margin-bottom:2px;}
.case__resultado b{font-size:.86rem;font-weight:700;color:var(--tinta);}
/* A lista numerada da estratégia */
.case__subtitulo{font-size:1.02rem;color:var(--tinta-suave);margin-bottom:9px;}
.case__estrategia{margin:0;padding-left:1.15em;display:grid;gap:8px;}
.case__estrategia li{font-size:.95rem;color:var(--tinta-suave);padding-left:4px;}
.case__estrategia li::marker{color:var(--tinta);font-weight:700;}
.case__estrategia b{color:var(--tinta);font-weight:700;}

/* =========================================================
   7. PORTFÓLIO
   ========================================================= */
/* O título gigante da seção: mesma manuscrita e mesma cor do título do case,
   no dobro do tamanho. */
/* Esta seção continua o fundo liso das anteriores, sem o listrado, e começa
   mais perto do topo para o título grande subir na página. */
#portfolio{
  background-color:#fffcf5;border-top:1px solid var(--borda);
  padding-top:clamp(34px,4.2vw,58px);
}
/* Aqui o cabeçalho é centralizado e usa a largura toda: senão o título
   quebraria em duas linhas por causa do limite de 720px dos outros blocos. */
#portfolio .cabecalho-secao{max-width:none;text-align:center;margin-bottom:0;}
/* O respiro entre o "navegue por nichos" e o título grande */
#portfolio .rotulo--centro{margin-bottom:clamp(20px,2.4vw,34px);}
.conteudo__titulo{
  font-family:var(--titulo-cursiva);font-weight:400;letter-spacing:.01em;
  font-size:clamp(2.1rem,4.2vw,3.4rem);line-height:1;color:var(--azul);
  /* Embaixo a margem é negativa porque a Allura deixa um vão grande abaixo das
     letras, por causa dos rabinhos: sem isso os balões de nicho ficariam
     longe demais. Em cima o espaço para a etiqueta é o da regra logo abaixo. */
  margin:0;padding-bottom:.06em;
}
/* Os nichos em balões. Eles quebram sozinhos em duas linhas quando não cabem
   numa só. Passando o mouse aparece só o contorno; o nicho aberto fica cheio. */
.nichos{
  display:flex;flex-wrap:wrap;justify-content:center;gap:7px;
  margin:clamp(24px,3vw,36px) auto clamp(28px,3.4vw,44px);
}
.nicho{
  border:1px solid rgba(20,17,13,.09);border-radius:100px;background:#f3f1ec;
  padding:6px 14px;cursor:pointer;font:inherit;font-size:.8rem;font-weight:500;
  color:var(--tinta);box-shadow:0 1px 2px rgba(20,17,13,.04);
  transition:background-color .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;
}
.nicho:hover{border-color:rgba(20,17,13,.35);background:#fff;}
.nicho[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--creme);}
/* Black Friday: o verde da tarja do topo, sÃ³ que mais clarinho */
.nicho--verde{background:#dfece0;border-color:#c3d9c0;}
.nicho--verde:hover{background:#eaf3e8;border-color:#a8c7a1;}
.nicho--verde[aria-pressed="true"]{background:#a8c7a1;border-color:#a8c7a1;color:var(--tinta);}
/* O nome do nicho, a contagem de vídeos e as setas */
.conteudo__topo{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  margin-bottom:clamp(20px,2.4vw,30px);
}
.conteudo__nome{display:flex;align-items:baseline;gap:12px;}
/* O nome do nicho sai na League Spartan em caixa alta, no cinza escuro */
.conteudo__nome .titulo__impacto{font-size:clamp(1.55rem,3.1vw,2.5rem);color:var(--azul);}
.conteudo__contagem{font-size:.85rem;font-weight:600;color:var(--tinta-suave);opacity:.65;}
.conteudo__descricao{font-family:var(--serif);font-style:italic;font-size:1.02rem;color:var(--tinta-suave);margin-top:10px;}
.setas{display:flex;gap:10px;flex:none;}
.seta{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--borda);
  background:transparent;cursor:pointer;color:var(--tinta-suave);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s ease, color .2s ease, opacity .2s ease;
}
.seta:hover:not(:disabled){border-color:var(--tinta);color:var(--tinta);}
.seta:disabled{opacity:.3;cursor:default;}
.seta svg{width:15px;height:15px;fill:currentColor;}
/* O carrossel. O porVista é quantos vídeos aparecem de uma vez: mude os
   números nas telas menores, mais abaixo, no bloco RESPONSIVO. */
.carrossel{
  --porVista:5;--porVistaH:2.5;--vao:clamp(12px,1.5vw,18px);
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  scroll-behavior:smooth;
}
.carrossel::-webkit-scrollbar{display:none;}
.carrossel__trilho{
  display:grid;grid-auto-flow:column;gap:var(--vao);
  grid-auto-columns:calc((100% - (var(--porVista) - 1) * var(--vao)) / var(--porVista));
}
/* Só o nicho em destaque usa duas fileiras */
.carrossel--duplo .carrossel__trilho{grid-template-rows:repeat(2,1fr);}
/* Nicho com vÃ­deo deitado (16:9): o card Ã© largo, com o dobro da largura de um vertical */
.carrossel--horizontal .carrossel__trilho{
  grid-auto-columns:calc((100% - (var(--porVistaH) - 1) * var(--vao)) / var(--porVistaH));align-items:start;
}
.carrossel .video--horizontal{aspect-ratio:16/9;}
.carrossel .video--horizontal .video__previa{left:0;width:100%;transform:none;}
.video{
  position:relative;display:block;overflow:hidden;border-radius:var(--raio-g);
  aspect-ratio:9/16;background:var(--creme-escuro);box-shadow:var(--sombra);
  scroll-snap-align:start;color:inherit;text-decoration:none;
  transition:transform .4s cubic-bezier(.22,.61,.36,1), box-shadow .4s ease;
}
/* Os vídeos do YouTube viram <button> (para abrir a janela em vez de navegar),
   por isso o card também zera o visual padrão de botão do navegador */
button.video{width:100%;border:0;margin:0;padding:0;background:none;font:inherit;cursor:pointer;}
a.video:hover,button.video:hover{transform:translateY(-6px);box-shadow:var(--sombra-forte);}
.video img,.video__fundo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.video__previa{
  position:absolute;top:0;left:50%;height:100%;width:316%;transform:translateX(-50%);
  border:0;pointer-events:none;opacity:0;transition:opacity .12s ease;z-index:1;
}
.video__previa.visivel{opacity:1;}
/* Durante a prévia o botão de play sai da frente */
.video.com-previa .video__play{opacity:0;transition:opacity .2s ease;}
.video__marca{
  position:absolute;top:12px;left:12px;z-index:2;
  background:rgba(255,253,251,.94);color:var(--tinta);
  max-width:calc(100% - 24px);text-align:left;line-height:1.3;
  padding:5px 12px;border-radius:14px;font-size:.66rem;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;
}
.video__play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:clamp(38px,3.8vw,54px);aspect-ratio:1;border-radius:50%;
  background:var(--azul);box-shadow:0 6px 18px rgba(20,17,13,.28);
  display:flex;align-items:center;justify-content:center;
}
.video__play svg{width:34%;fill:#fff;margin-left:9%;}
.video__base{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 14px 14px;
  background:linear-gradient(transparent, rgba(20,17,13,.78));
}
/* O balão que substitui o cursor quando o mouse chega perto das pontas do
   carrossel: clicar ali avança ou volta um bloco de vídeos. */
.cursor-seta{
  position:fixed;left:0;top:0;z-index:60;width:62px;height:62px;border-radius:50%;
  background:rgba(20,17,13,.82);color:#fff;backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  opacity:0;transform:translate(-50%,-50%) scale(.55);
  transition:opacity .18s ease, transform .18s cubic-bezier(.22,.61,.36,1);
}
.cursor-seta.visivel{opacity:1;transform:translate(-50%,-50%) scale(1);}
.cursor-seta svg{width:19px;height:19px;fill:currentColor;}
.cursor-play{width:56px;height:56px;background:rgba(20,17,13,.86);}
.cursor-play svg{margin-left:3px;}
/* Com mouse, a setinha comum some de cima dos vídeos: quem aparece é o play */
@media (hover:hover) and (pointer:fine){ .video{cursor:none;} }
/* Enquanto o balão aparece, a setinha comum do mouse some */
.carrossel.sem-cursor{cursor:none;}
/* A legenda leve embaixo do card: só o conteúdo do vídeo (ex.: "Tratamento"),
   sem repetir a marca (já está no balão de cima) nem o nicho. */
.video__base span{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.88);}

/* =========================================================
   8. FOTOS UGC
   ========================================================= */
/* Duas tarjas de fotos correndo em sentidos opostos. Reaproveitam a mesma
   mecânica da tarja de logos (.marquise), só que sem o esmaecimento das
   pontas: aqui as fotos são cortadas secas na borda, como no print. */
.fotos-ugc{
  position:relative;overflow:hidden;
  background-color:#fffcf5;
  /* Sem margem embaixo: a tarja de fotos encosta direto na seção seguinte */
  padding-top:clamp(30px,4vw,54px);
  padding-bottom:0;
}
.marquise--fotos{-webkit-mask-image:none;mask-image:none;}
.marquise--fotos + .marquise--fotos{margin-top:clamp(8px,1vw,14px);}
/* A duração destas duas não vem daqui: o script calcula, a partir da largura
   do trilho, quanto tempo leva para correr numa velocidade fixa em pixels
   por segundo — senão a tarja com menos fotos andaria mais devagar que a
   outra, e ambas mudariam de ritmo a cada foto acrescentada. */
.marquise--reversa .marquise__trilho{animation-direction:reverse;}
/* Ao contrário das outras tarjas, esta não para com o mouse em cima: são
   muitas fotos e a parada atrapalharia mais do que ajudaria */
.marquise--fotos:hover .marquise__trilho,
.marquise--fotos:focus-within .marquise__trilho{animation-play-state:running;}
/* Sem vão nenhum entre os quadros: quem separa uma foto da outra é a própria
   moldura escura de cada uma, e é isso que faz a tarja inteira virar um rolo
   de filme só, contínuo. O contador começa em 24 para o primeiro quadro sair
   como "25", do jeito que os números aparecem no meio de um rolo. */
.marquise--fotos .marquise__grupo{gap:0;padding-right:0;counter-reset:quadro 24;}
/* A moldura é o padding escuro de cada quadro: em cima e embaixo ela forma
   as duas tarjas do filme, e nas laterais, encostando no quadro vizinho,
   forma a divisória entre uma foto e outra. O tamanho vem da foto (que
   segue nos 4/5), não do quadro. */
/* A largura fica aqui, no quadro, e não na imagem: sem uma largura própria
   o quadro não sustenta o trilho, que acaba encolhido pelo flex e some com
   metade das fotos. */
.foto-ugc{
  position:relative;flex:none;counter-increment:quadro;
  width:clamp(148px,15vw,214px);
  padding:24px 7px;background:#17140f;
}
.foto-ugc img{
  width:100%;aspect-ratio:4/5;
  object-fit:cover;object-position:center;display:block;
}
/* Os dizeres miúdos das tarjas, como num rolo de filme de verdade. O
   seletor precisa da classe da tarja junto para ganhar do ::after que põe
   o losango nos itens da tarja de serviços. */
.marquise--fotos .foto-ugc::before,
.marquise--fotos .foto-ugc::after{
  position:absolute;z-index:1;
  font-family:var(--titulo-impacto);font-weight:700;
  font-size:6px;letter-spacing:.14em;line-height:1;
  color:rgba(239,231,220,.72);white-space:nowrap;
}
/* A marca do filme sai um ponto maior que a numeração, como no print */
.marquise--fotos .foto-ugc::before{content:"FOTOS UGC";top:6px;left:8px;font-size:9px;}
.marquise--fotos .foto-ugc::after{content:"▸ " counter(quadro);bottom:8px;right:8px;}

/* =========================================================
   9. SERVIÇOS
   ========================================================= */
/* As margens de cima e de baixo aqui acompanham a ALTURA da tela (e não a
   largura, como nas outras seções): é o que garante que a foto e os cinco
   cartões apareçam juntos, de uma vez, mesmo num notebook de tela baixa. */
.servicos{
  /* Precisa ser igual ao padding-inline do .container: é o que o bloco da
     foto desconta para escapar da margem lateral da página */
  --margem-container:clamp(22px,5vw,76px);
  /* A foto e a palavra do fundo dividem esta mesma largura, para as duas
     terminarem no mesmo ponto */
  --largura-foto:660px;
  position:relative;
  /* O mesmo off-white das outras seções claras do site (#sobre, #case,
     #portfolio), para não destoar de quem vem antes e depois */
  background-color:#fffcf5;
  /* Os textos sobem um pouco (menos margem em cima, mais embaixo) sem a
     seção mudar de altura. O que passar da base — o pé da foto — é cortado
     pelo overflow. */
  padding-top:clamp(36px,5.5vh,76px);
  padding-bottom:clamp(40px,5vh,64px);
  overflow:hidden;
}
.servicos__cena{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(20px,4vw,64px);}

/* Lado esquerdo: a foto com o rótulo da seção repetido ao fundo, do jeito do
   print de referência das "FEEDBACKS". Este bloco sai da grade e se prende
   direto na seção: encosta em cima, embaixo e a 16px da borda esquerda da
   tela — inclusive nos monitores largos, onde o resto do site fica
   centralizado numa faixa de 1440px. A largura acompanha a metade da tela,
   com folga suficiente para não alcançar os cartões. */
.servicos__retratos{
  position:absolute;left:16px;top:0;bottom:0;z-index:0;
  width:calc(50% - 40px);
}
.servicos__fundo-titulo{
  position:absolute;top:0;bottom:0;left:0;width:var(--largura-foto);
  margin:0;overflow:hidden;z-index:0;
  display:flex;flex-direction:column;justify-content:center;gap:.06em;
  /* A League Spartan da capa, grande o bastante para a segunda repetição
     entrar cortada na borda */
  font-family:var(--titulo-impacto);font-weight:700;text-transform:uppercase;
  font-size:92px;line-height:1;letter-spacing:-.01em;
  color:var(--creme-escuro);opacity:.5;user-select:none;
  /* Dissolve nas duas beiradas, num trecho curto, para o texto não bater de
     frente nem na borda da tela nem nos cartões */
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 13%,#000 87%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 13%,#000 87%,transparent 100%);
}
.servicos__fundo-titulo span{display:block;white-space:nowrap;}
/* A foto é um recorte (PNG com fundo transparente): sem moldura e sem
   sombra, só a silhueta sobre a palavra do fundo. Ela ocupa a largura
   inteira do bloco e se apoia na base; o topo do PNG é vazio, então o que
   sobra para cima não aparece. */
/* Largura fixa (e não uma porcentagem da coluna ou da altura da seção):
   assim a foto é a mesma em qualquer monitor e não cresce junto quando a
   seção fica mais alta. A altura vem sozinha, pela proporção do PNG. */
.retrato-recortado{
  position:absolute;left:0;bottom:-34px;width:var(--largura-foto);z-index:1;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%);
}
.retrato-recortado img{width:100%;height:auto;}
/* Sem foto ainda: aí sim vira um cartão no degradê do site, com cantos
   arredondados e sombra, para não ficar um retângulo cru na tela */
.retrato-recortado__vazio{width:100%;aspect-ratio:15/16;border-radius:26px;box-shadow:0 24px 60px rgba(20,17,13,.22);}

/* Lado direito: os cartões de serviço no estilo "papel espetado" do print de
   referência — papel branco, miolo em creme, percevejo no topo e um traço
   pontilhado costurando um cartão no outro, em ziguezague.
   São miúdos de propósito: os cinco precisam caber na tela de uma vez, ao
   lado das fotos, sem ninguém precisar rolar a página para ver o último. */
.servicos__lado{grid-column:2;}
.servicos__cabecalho{
  max-width:none;margin-bottom:clamp(22px,3vw,34px);
  text-align:right;
}
/* O rótulo é um flex (tem a barrinha laranja antes), então alinhar o texto
   não basta: é o justify que o empurra para a direita */
.servicos__cabecalho .rotulo{justify-content:flex-end;}
/* A cursiva da identidade, igual ao título do case ("Planner Casei Assim").
   O padding embaixo é para as caudas das letras não serem cortadas, e o
   nowrap segura tudo numa linha só. */
.servicos__cabecalho h2{
  font-family:var(--titulo-cursiva);font-weight:400;letter-spacing:.01em;
  font-size:clamp(2.1rem,4vw,3.5rem);line-height:1.12;padding-bottom:.08em;
  color:var(--azul);white-space:nowrap;
}
/* O mesmo par do título do Sobre: o trecho em negrito vem na cor cheia, que
   é o que faz o peso aparecer numa cursiva de um só peso */
.servicos__cabecalho h2 b{font-weight:700;color:var(--tinta);}
.servicos__cabecalho .subtitulo{margin-left:auto;}

.servicos__cartoes{
  --vao-cartao:clamp(12px,1.8vh,18px);
  display:flex;flex-direction:column;align-items:flex-end;gap:var(--vao-cartao);
}
/* Vidro fosco, no espírito das notificações do iPhone: uma cor só, bem
   transparente, com o fundo borrado por trás e uma borda clara de leve */
.servico-cartao{
  position:relative;width:88%;
  background:rgba(255,253,251,.55);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.75);border-radius:16px;
  padding:13px 18px 14px;
  box-shadow:0 6px 18px rgba(20,17,13,.07);
  transition:transform .3s ease, box-shadow .3s ease;
}
.servico-cartao:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,17,13,.13);}
/* Número e título na League Spartan, a fonte de impacto da identidade (a
   mesma dos "2 MILHÕES DE VIEWS" do case) */
.servico-cartao__numero{font-family:var(--titulo-impacto);font-weight:700;color:var(--laranja);margin-right:11px;}
.servico-cartao h3{
  font-family:var(--titulo-impacto);font-weight:700;letter-spacing:0;
  font-size:.95rem;line-height:1.25;margin-bottom:4px;
}
.servico-cartao p{font-size:.8rem;line-height:1.45;color:var(--tinta-suave);margin:0;}

/* O percevejo: a cabeça redonda com o brilho de cima e a pontinha entrando
   no papel */
.servico-cartao__pino{
  position:absolute;top:-6px;left:20px;width:13px;height:13px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 34% 28%, #d4553f, var(--laranja) 58%, #4a0d06);
  box-shadow:0 2px 5px rgba(20,17,13,.26);
}
.servico-cartao__pino::after{
  content:"";position:absolute;left:50%;top:9px;width:5px;height:6px;margin-left:-2.5px;
  background:linear-gradient(#9c958c,#6b655d);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
}

/* A costura pontilhada que desce de um percevejo ao próximo */
.servico-cartao::after{
  content:"";position:absolute;top:100%;left:26px;height:var(--vao-cartao);
  border-left:1.5px dashed rgba(20,17,13,.22);pointer-events:none;
}
.servico-cartao:last-child::after{content:none;}

/* =========================================================
   10. DEPOIMENTOS
   ========================================================= */
/* O título da seção usa as letras da capa: League Spartan em caixa alta, só que
   bem menor, e a cursiva embaixo */
#depoimentos{padding-block:clamp(26px,3.2vw,42px);}
#depoimentos .cabecalho-secao{margin-bottom:clamp(14px,1.8vw,22px);max-width:none;}
#depoimentos .rotulo{margin-bottom:8px;}
.dep__titulo{margin:0;font-weight:400;letter-spacing:normal;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:.35em;}
.dep__impacto{
  display:inline-block;font-family:var(--titulo-impacto);font-weight:700;text-transform:uppercase;
  font-size:clamp(1.5rem,2.6vw,2.3rem);line-height:.96;letter-spacing:-.02em;color:#cfc8c3;
}
.dep__cursiva{
  display:inline-block;font-family:var(--titulo-cursiva);font-weight:400;
  font-size:clamp(2.2rem,3.8vw,3.2rem);line-height:.9;color:var(--azul);
  padding-bottom:.12em;
}
/* Quatro colunas, uma por categoria, com os cards empilhados */
.depoimentos__grade{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(18px,2.4vw,32px);align-items:stretch;}
.dep__coluna{display:flex;flex-direction:column;min-width:0;}
.dep__topo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
.dep__cat{
  margin:0;font-family:var(--titulo-impacto);font-size:.86rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--azul);
}
.dep__setas{display:flex;gap:6px;}
.dep__seta{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--borda);background:#fff;padding:0;
  display:grid;place-items:center;cursor:pointer;color:var(--tinta);
  transition:background .2s ease, border-color .2s ease;
}
.dep__seta:hover{background:var(--creme);border-color:rgba(20,17,13,.3);}
.dep__seta svg{width:12px;height:12px;fill:currentColor;}
/* Todos os cards ocupam o mesmo lugar (a altura é a do maior); só a posição
   muda: o da frente aparece inteiro e os de trás ficam apagados. */
.dep__pilha{flex:1;display:grid;grid-template-rows:1fr;padding:12px 12px 6px;}
.dep__card{
  grid-area:1/1;margin:0;display:flex;flex-direction:column;
  background:#fff;border:1px solid var(--borda);border-radius:16px;padding:15px 18px 11px;
  box-shadow:0 1px 2px rgba(20,17,13,.04), 0 12px 28px rgba(20,17,13,.07);
  transition:opacity .8s ease, transform .8s cubic-bezier(.22,.61,.36,1), visibility 0s linear .8s;
  transform-origin:50% 100%;
}
.dep__card[data-pos="0"]{z-index:3;opacity:1;transform:none;visibility:visible;transition-delay:0s;}
.dep__card[data-pos="1"]{z-index:2;opacity:.42;transform:translate(11px,-9px) rotate(2.4deg) scale(.97);visibility:visible;transition-delay:0s;}
.dep__card[data-pos="2"]{z-index:1;opacity:.22;transform:translate(-11px,-15px) rotate(-2.8deg) scale(.94);visibility:visible;transition-delay:0s;}
.dep__card[data-pos="3"]{z-index:0;opacity:0;transform:translate(0,-15px) scale(.92);visibility:hidden;pointer-events:none;}
.dep__card blockquote{margin:0;flex:1;font-size:.88rem;line-height:1.45;color:var(--tinta);}
.dep__card blockquote.medio{font-size:.8rem;line-height:1.42;}
.dep__card blockquote.longo{font-size:.74rem;line-height:1.4;}
.dep__card figcaption{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--borda);
  display:flex;align-items:center;gap:10px;
}
.dep__logo{width:32px;height:32px;flex:none;border-radius:50%;object-fit:contain;padding:4px;background:#fff;border:1px solid var(--borda);}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem;}
.avatar.dep__logo{width:32px;height:32px;}
.dep__iniciais{padding:0;font-size:.72rem;border:0;}
.dep__marca{font-weight:600;font-size:.86rem;line-height:1.3;}

/* =========================================================
   11. CONTATO
   ========================================================= */
/* O formulário fica à esquerda e, à direita, o texto com a foto recortada
   atrás dele. O overflow corta o pé da foto na borda da seção. */
.contato{position:relative;overflow:hidden;background:var(--branco);border-top:1px solid var(--borda);}
.contato__grade{display:grid;grid-template-columns:1fr 1.12fr;gap:clamp(30px,4vw,64px);align-items:stretch;}
.contato__lado{position:relative;display:flex;align-items:center;}
.contato__texto{position:relative;z-index:1;max-width:30ch;}
/* Numa linha só, como no print — por isso ele ignora a largura do parágrafo */
.contato__titulo{
  font-family:var(--titulo-cursiva);font-weight:400;letter-spacing:.01em;
  font-size:clamp(2rem,3.8vw,3.3rem);line-height:1.1;padding-bottom:.08em;
  margin:0 0 clamp(14px,1.8vw,22px);white-space:nowrap;
}
.contato__lado .subtitulo{margin-top:0;font-size:.97rem;}
/* Os canais viram só o símbolo, num círculo vazado, empilhados */
.canais{list-style:none;padding:0;margin:clamp(16px,2vw,24px) 0 0;display:flex;flex-direction:column;gap:10px;}
/* Cada canal: o símbolo e, ao lado, o contato escrito, tudo clicável */
.canais a{
  display:inline-flex;align-items:center;gap:12px;color:var(--tinta);text-decoration:none;
  font-size:.95rem;font-weight:500;transition:color .2s ease, transform .25s ease;
}
.canais a:hover{color:var(--laranja);transform:translateX(3px);}
.canais svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
/* A foto encosta na base da seção e é cortada por ela */
.contato__foto{position:absolute;right:0;bottom:calc(clamp(64px,9vw,120px) * -1 + 30px);width:clamp(230px,26vw,380px);z-index:0;}
.contato__foto img{width:100%;height:auto;display:block;}
.contato__foto--vazia{width:100%;aspect-ratio:3/4;border-radius:26px 26px 0 0;}

#contato-formulario{display:flex;margin:-58px 0 -64px;}
.formulario{
  flex:1;
  background:var(--creme);border:1px solid var(--borda);border-radius:var(--raio-g);padding:clamp(18px,2vw,24px);
  height:100%;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:auto auto auto minmax(64px,1fr) auto;gap:12px 14px;
}
.formulario .campo{grid-column:span 5;}
.formulario .campo--inteiro{grid-column:1/-1;}
.formulario .campo--largo,.formulario .btn,.formulario .aviso-form{grid-column:1/-1;}
/* Precisa do .campo junto: o .campo{display:block} vem depois e ganharia,
   e aÃ­ a caixa de texto nÃ£o crescia para ocupar o espaÃ§o atÃ© o botÃ£o */
.campo.campo--largo{display:flex;flex-direction:column;}
.campo--largo textarea{flex:1;min-height:64px;}
.campo{display:block;margin:0;}
.campo span{display:block;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.campo input,.campo textarea{
  width:100%;padding:11px 16px;border-radius:14px;
  border:1.5px solid var(--borda);background:var(--branco);color:var(--tinta);
  font-family:inherit;font-size:.88rem;transition:border-color .2s ease, box-shadow .2s ease;
}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(84,84,84,.16);}
.campo textarea{resize:none;min-height:64px;}
.formulario .btn{width:100%;padding:11px 24px;font-size:.9rem;}
.aviso-form{
  margin:0;padding:10px 14px;border-radius:10px;
  background:rgba(84,84,84,.09);border:1px solid rgba(84,84,84,.24);
  color:#3d3d3d;font-size:.8rem;font-weight:500;
}
.aviso-form[hidden]{display:none;}
.erro-campo{color:#9c1f0c;font-size:.83rem;font-weight:600;margin-top:7px;display:block;}

/* =========================================================
   12. RODAPÉ
   ========================================================= */
.rodape{background:var(--tinta);color:rgba(243,238,233,.72);padding-block:clamp(14px,1.5vw,20px);}
/* As dúvidas frequentes, em três colunas, acima da linha dos créditos */
.rodape__faq{padding-bottom:12px;border-bottom:1px solid rgba(243,238,233,.18);}
.rodape__faq-titulo{
  text-align:center;font-family:var(--sans);font-weight:400;
  font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--creme);margin:0 0 8px;
}
.rodape__faq-lista{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(14px,2.4vw,36px);list-style:none;margin:0;padding:0;
}
.rodape__faq-lista li{font-size:.83rem;line-height:1.45;}
.rodape__faq-lista b{color:var(--branco);font-weight:700;}
.rodape__base{display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:space-between;padding-top:10px;font-size:.7rem;}
.rodape__base a{text-decoration:none;}
.rodape__base a:hover{color:var(--branco);}

/* =========================================================
   13. LIGHTBOX DE VÍDEO
   ========================================================= */
/* A janela escura que cobre a tela quando um vídeo é aberto. Clicar fora da
   caixa do vídeo (aqui mesmo, no fundo) também fecha. */
.lightbox{
  position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;
  padding:34px;background:rgba(14,12,10,.92);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .25s ease;
}
.lightbox[hidden]{display:flex;visibility:hidden;pointer-events:none;}
.lightbox.aberto{opacity:1;visibility:visible;pointer-events:auto;}
/* A caixa mantém sempre a proporção vertical dos vídeos (9:16), no maior
   tamanho que cabe na tela sem sobrar nem faltar dos dois lados — por isso
   não aparece nenhuma borda preta ao redor do vídeo. */
.lightbox__caixa{
  position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:var(--raio-g);
  background:#000;box-shadow:0 30px 90px rgba(0,0,0,.55);
  width:min(92vw,calc(90vh * 9 / 16));height:min(90vh,calc(92vw * 16 / 9));
  transform:scale(.96);transition:transform .25s ease;
}
.lightbox.aberto .lightbox__caixa{transform:scale(1);}
/* VÃ­deo deitado (16:9): a caixa muda de proporÃ§Ã£o */
.lightbox__caixa--horizontal{
  aspect-ratio:16/9;
  width:min(92vw,calc(90vh * 16 / 9));height:min(90vh,calc(92vw * 9 / 16));
}
.lightbox__caixa iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.lightbox__fechar{
  position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);background:rgba(14,12,10,.55);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background-color .2s ease, border-color .2s ease;
}
.lightbox__fechar:hover{background:rgba(14,12,10,.85);border-color:#fff;}
.lightbox__fechar svg{width:16px;height:16px;fill:currentColor;}

/* =========================================================
   ANIMAÇÃO DE ENTRADA NO SCROLL
   ========================================================= */
.revelar{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.22,.61,.36,1),transform .8s cubic-bezier(.22,.61,.36,1);}
.revelar.visivel{opacity:1;transform:none;}
/* =========================================================
   RESPONSIVO
   Quantos vídeos aparecem de uma vez no carrossel dos nichos:
   5 no computador e 3 nas telas menores (--porVistaH é o mesmo
   para os vídeos deitados).
   ========================================================= */
@keyframes barraRola{
  from{transform:translateX(100vw);}
  to{transform:translateX(-100%);}
}
@media (max-width:1180px){
  .carrossel{--porVista:4;--porVistaH:2;}
}
@media (max-width:980px){
  .contato__grade,.case__grade{grid-template-columns:1fr;}
  /* Os dois celulares não passam de 400px juntos para não virarem um paredão */
  .case__fones{max-width:400px;margin-inline:auto;}
  /* Capa e Sobre continuam em duas colunas (texto e foto lado a lado) */
  .hero__grade{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;}
  .hero__visual{margin-right:0;}
  .hero h1{margin-bottom:12px;}
  .hero__texto{font-size:.85rem;}
  .hero__meta{margin-top:14px;font-size:.82rem;gap:4px 8px;}
  .hero__acoes{margin-top:16px;}
  /* Os balões se recolhem para dentro da foto para não saírem da tela */
  .balao{width:min(215px,80%);}
  .balao--1{left:-7%;bottom:5%;}
  .balao--2{right:-4%;top:2%;}
  .balao--3{right:-4%;top:23%;}
  .sobre__grade{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;padding-inline:clamp(16px,4vw,40px);}
  .sobre__corpo{margin-top:12px;}
  .sobre__corpo p{font-size:.82rem;line-height:1.5;}
  .sobre__corpo p + p{margin-top:10px;}
  .sobre__selos{margin-top:18px;gap:8px;}
  .sobre__selos li{padding:7px 14px;font-size:.78rem;}
  .servicos__grade,.numeros,.depoimentos__grade{grid-template-columns:repeat(2,1fr);}
  .carrossel{--porVista:3;--porVistaH:1.5;}
}
@media (max-width:860px){
  .hamburguer{display:block;}
  .menu{
    position:fixed;top:var(--altura-topo);left:0;right:0;
    flex-direction:column;align-items:stretch;gap:0;
    background:var(--creme);border-bottom:1px solid var(--borda);
    padding:10px clamp(20px,5vw,44px) 28px;
    box-shadow:0 20px 40px rgba(20,17,13,.1);
    transform:translateY(-14px);opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .28s ease, transform .28s ease, visibility .28s;
    max-height:calc(100vh - var(--altura-topo));overflow-y:auto;
  }
  .menu.aberto{transform:none;opacity:1;visibility:visible;pointer-events:auto;}
  .menu li{border-bottom:1px solid var(--borda);}
  .menu li:last-child{border-bottom:none;padding-top:18px;}
  .menu a{display:block;padding:16px 0;font-size:1.05rem;color:var(--tinta);}
  .menu a::after{display:none;}
  .menu .btn{width:100%;padding:15px 24px;}
}
@media (max-width:620px){
  .depoimentos__grade,.servicos__grade{grid-template-columns:1fr;}
  .carrossel{--porVista:3;--porVistaH:1;}
  .numeros{grid-template-columns:repeat(2,1fr);gap:24px 18px;}
  /* Capa compacta: tudo continua lado a lado, só que menor e ainda legível */
  .topo .btn--topo{display:none;}
  .topo__interno{gap:10px;}
  /* A tarja verde do topo: uma faixa só, com o texto rolando da esquerda para
     a direita para dar tempo de ler tudo. Para inverter o sentido, troque o
     from e o to da animação. */
  .topo__barra{justify-content:flex-start;padding:6px 0;}
  .barra__trilho{display:flex;align-items:center;gap:16px;width:max-content;animation:barraRola 20s linear infinite;}
  .barra__texto::before{margin-right:16px;}
  /* Capa compacta: tudo continua lado a lado, só que menor e ainda legível.
     A foto ganha mais largura que o texto. */
  .hero__grade{grid-template-columns:minmax(0,.78fr) minmax(0,1.85fr);gap:0;}
  .hero__visual{margin-right:-15vw;}
  .hero .rotulo{font-size:.58rem;letter-spacing:.08em;flex-wrap:wrap;gap:3px 6px;margin-bottom:8px;}
  .hero .rotulo::before{width:12px;}
  .hero .titulo__impacto{font-size:clamp(.9rem,4.2vw,1.4rem);}
  .hero .titulo__cursiva{font-size:clamp(1.4rem,6.6vw,2.4rem);}
  .hero__texto{font-size:.7rem;line-height:1.45;}
  .hero__meta{font-size:.64rem;margin-top:10px;}
  .hero__acoes{margin-top:12px;}
  .hero__acoes .btn{width:100%;padding:8px 10px;font-size:.68rem;border-radius:9px;}
  .balao{display:none;}
  .hero .so-pc{display:none;}
  .hero .so-cel{display:inline;}
  /* Sobre mim: igual ao computador (foto à esquerda, texto à direita), só que
     sem as margens laterais */
  #sobre .rotulo{font-size:.6rem;margin-bottom:8px;}
  .titulo__manuscrita{font-size:clamp(1.2rem,5.5vw,1.8rem);}
  .sobre__grade{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding-inline:18px;align-items:stretch;}
  /* A foto acompanha a altura do texto e corta as laterais para preencher */
  #sobre .sobre__visual,#sobre .sobre__visual .visual{height:100%;}
  #sobre .sobre__visual .visual{aspect-ratio:auto;}
  #sobre .sobre__selos li:not(.destaque){display:none;}
  .faixa{padding-block:5px;}
  .marquise__grupo li{font-size:.66rem;}
  /* Todos os títulos com risquinho dos dois lados, no mesmo tamanho */
  .rotulo--centro{font-size:.6rem;letter-spacing:.07em;gap:6px;white-space:nowrap;}
  .rotulo--centro::before,.rotulo--centro::after{width:12px;}
  #sobre .sobre__corpo p{font-size:.62rem;line-height:1.45;}
  #sobre .sobre__corpo p + p{margin-top:8px;}

  #sobre .sobre__selos{margin-top:12px;gap:6px;}
  #sobre .sobre__selos li{padding:5px 10px;font-size:.6rem;}
  #sobre .sobre__visual .visual{border-radius:20px;}
  #sobre .titulo__manuscrita{font-size:clamp(1.2rem,4.6vw,2rem);}
  .rodape__base{flex-direction:column;}

  /* Resultados: o vídeo primeiro; o 01/03 e as setas ficam embaixo. A seção
     inteira desliza para o lado quando troca de case (ver também o arrastar). */
  .case__fones .pilha{order:1;}
  .case__fones .pilha__topo{order:2;}
  .case__fones .pilha__ver{order:3;}
  .case__grade.case--prox{animation:caseProx .45s ease both;}
  .case__grade.case--ant{animation:caseAnt .45s ease both;}
  /* Nichos: balões lado a lado, deslizando com o dedo; embaixo, cada nicho com
     seu carrossel de 3 vídeos (a lista é montada pelo JS). */
  .nichos{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  .nichos::-webkit-scrollbar{display:none;}
  .nicho{flex:none;white-space:nowrap;}
  .nicho--todos{display:inline-block;}
  #conteudo-topo,#carrossel{display:none;}

  .nl--oculto{display:none;}
  .nl__topo{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
  .nl__topo .titulo__impacto{font-size:1.25rem;color:var(--azul);}
  .nichos__mais{display:block;margin:0 auto 26px;border:1px solid var(--borda);border-radius:100px;background:var(--branco);padding:9px 26px;font:inherit;font-size:.82rem;font-weight:600;color:var(--tinta);cursor:pointer;}
  .nichos__mais[hidden]{display:none;}
  /* Sem rolamento horizontal: o que passa da tela (a foto da capa) é cortado */
  html,body{max-width:100%;overflow-x:clip;}
  .hero{overflow-x:clip;}
  /* O título do contato ganha o mesmo risquinho vinho dos outros */
  .contato__titulo{display:flex;align-items:center;gap:10px;}
  .contato__titulo::before{content:"";width:26px;height:1px;background:var(--laranja);flex:none;}
  /* Serviços: sem a palavra repetida ao fundo, foto mais apagada e os cartões
     entrando devagar, um por vez */
  .servicos__fundo-titulo{display:none;}
  /* Cartões centralizados, com respiro nas laterais e texto à direita */
  .servicos__cartoes{align-items:center;}
  .servico-cartao{width:100%;max-width:none;text-align:right;}
  .servicos__cena{grid-template-columns:minmax(0,1fr);padding-inline:26px;}
  .servicos__lado{grid-column:1;}
  .retrato-recortado{opacity:.45;}
  /* Os cartões aparecem com fade na mesma velocidade em que a página desce:
     o JS (ver "Fade dos cartões") preenche o --fade de 0 a 1 conforme a rolagem */
  .servico-cartao.revelar{opacity:var(--fade,0) !important;transform:translateY(calc((1 - var(--fade,0)) * 24px)) !important;transition:none !important;}
  .dica-deslize{display:block;text-align:center;font-size:.78rem;color:var(--tinta-suave);margin:-6px 0 14px;}
  /* Contato: primeiro o texto, depois o formulário, sem foto; os ícones ficam
     lado a lado embaixo do formulário */
  .contato__grade{gap:22px;}
  .contato__lado{order:1;}
  #contato-formulario{order:2;}
  .contato__foto{display:none;}
  .contato__texto{max-width:none;}
  .contato__texto .canais{display:none;}
  #contato-formulario{margin:0;flex-direction:column;gap:18px;}
  ul.canais--cel{display:flex;flex-direction:row;justify-content:center;gap:28px;margin:0;}
  .canais--cel a{gap:0;}
  .canais--cel span{display:none;}
  .canais--cel svg{width:30px;height:30px;}
  /* FAQ: uma pergunta por vez, passando de lado */
  .rodape__faq-lista{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0;}
  .rodape__faq-lista::-webkit-scrollbar{display:none;}
  .rodape__faq-lista li{flex:0 0 100%;scroll-snap-align:start;padding-inline:6px;}
}


/* =========================================================
   POPUP "IDEIA GRÁTIS" E BALÃO
   ========================================================= */
.ideia{position:fixed;inset:0;z-index:150;pointer-events:none;}
.ideia__fundo{
  position:absolute;inset:0;background:rgba(20,17,13,.42);opacity:0;pointer-events:none;
  transition:opacity .35s ease;
}
.ideia__caixa{
  position:absolute;left:50%;top:50%;width:min(420px,calc(100vw - 32px));
  background:#fff;border-radius:22px;padding:30px 30px 26px;
  box-shadow:0 30px 80px rgba(20,17,13,.28);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translate(-50%,-46%) scale(.94);
  transition:opacity .35s ease, transform .5s cubic-bezier(.22,.61,.36,1), visibility 0s linear .5s;
}
.ideia[data-estado="aberto"] .ideia__fundo{opacity:1;pointer-events:auto;}
.ideia[data-estado="aberto"] .ideia__caixa{
  opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1);
  transition:opacity .35s ease, transform .5s cubic-bezier(.22,.61,.36,1), visibility 0s;
}
/* Ao fechar, a caixa encolhe em direção ao balão do canto */
.ideia[data-estado="balao"] .ideia__caixa,.ideia[data-estado="fechado"] .ideia__caixa{
  transform:translate(calc(-50% + 42vw),calc(-50% + 40vh)) scale(.1);
}
.ideia__x{
  position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;
  border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--tinta-suave);
}
.ideia__x:hover{background:var(--creme);color:var(--tinta);}
.ideia__x svg{width:18px;height:18px;fill:currentColor;}
.ideia__titulo{font-size:1.5rem;line-height:1.15;margin:0 34px 8px 0;}
.ideia__sub{margin:0 0 18px;font-size:.92rem;color:var(--tinta-suave);}
.ideia__campo{display:block;margin-bottom:12px;}
.ideia__campo span{display:block;font-size:.78rem;font-weight:600;margin-bottom:5px;}
.ideia__campo input{
  width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--borda);
  background:var(--branco);color:var(--tinta);font-family:inherit;font-size:.95rem;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.ideia__campo input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(84,84,84,.16);}
.ideia__enviar{width:100%;margin-top:6px;padding:13px 24px;}
.ideia__enviar:disabled{opacity:.6;cursor:default;transform:none;}
.ideia__aviso{
  margin:14px 0 0;padding:12px 14px;border-radius:12px;background:rgba(84,84,84,.09);
  border:1px solid rgba(84,84,84,.24);color:#3d3d3d;font-size:.88rem;font-weight:500;
}
.ideia__aviso[hidden]{display:none;}
.ideia__balao{
  position:absolute;right:22px;bottom:22px;display:inline-flex;align-items:center;gap:9px;
  padding:12px 20px 12px 16px;border:0;border-radius:100px;cursor:pointer;
  background:var(--tinta);color:#fff;font-weight:600;font-size:.88rem;
  box-shadow:0 12px 32px rgba(20,17,13,.3);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(16px) scale(.9);
  transition:opacity .35s ease .15s, transform .45s cubic-bezier(.22,.61,.36,1) .15s, visibility 0s linear .5s;
}
.ideia__balao svg{width:18px;height:18px;fill:#a8c7a1;}
.ideia__balao:hover{background:#3d3d3d;}
.ideia[data-estado="balao"] .ideia__balao{
  opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .35s ease .15s, transform .45s cubic-bezier(.22,.61,.36,1) .15s, visibility 0s;
}
/* Respeita quem prefere menos movimento na tela */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  .revelar{opacity:1;transform:none;}
}

<script>
/* =============================================================================
   CONTEÚDO DO SITE
   Tudo o que aparece na tela está aqui embaixo, dentro do objeto CONFIG.
   Para atualizar o site, basta trocar os textos entre aspas. Não mexa nos nomes
   que ficam antes dos dois pontos (por exemplo nome:, titulo:, texto:).
   ============================================================================= */

/* EDITE AQUI: os gradientes que substituem as fotos.
   Cada bloco colorido do site usa um destes gradientes.
   PARA COLOCAR UMA FOTO REAL: em qualquer item mais abaixo existe o campo
   imagem: "". Basta escrever o caminho ou o link da foto, por exemplo
   imagem: "fotos/meu-video.jpg", e o bloco de gradiente vira a sua foto
   automaticamente (lembre de preencher também o campo alt). */
const GRADIENTES = {

  try{

    if(pedido === "en" || pedido === "pt"){ localStorage.setItem("idioma", pedido); return pedido; }

  }catch(e){ return "pt"; }
})();

/* Mistura o inglês por cima do CONFIG. Listas casam pela posição; um texto
   que não existir em inglês fica como está. */
const misturar = function(base, extra){
  Object.keys(extra).forEach(function(k){
    const v = extra[k];
    if(v && typeof v === "object" && base[k] && typeof base[k] === "object"){
      misturar(base[k], v);
    } else {
      base[k] = v;
    }
  });
};
const traduzirTermos = function(no){
  Object.keys(no).forEach(function(k){
    const v = no[k];
    if(typeof v === "string"){ if(TERMOS[v]) no[k] = TERMOS[v]; }
    else if(v && typeof v === "object"){ traduzirTermos(v); }
  });
};
if(IDIOMA === "en"){
  misturar(CONFIG, CONFIG_EN);
  traduzirTermos(CONFIG);
}

    });

     youtu.be) e devolve só o código do vídeo; nos outros links (Instagram,
     TikTok...) devolve null, e o card se comporta como um link comum. */
  const idDoYoutube = function(link){
    if(!link) return null;
    const m = String(link).match(/(?:youtube(?:-nocookie)?\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  };

  const capaYoutube = function(id){
    return "https://i.ytimg.com/vi/" + id + "/maxresdefault.jpg";

  const blocoVisual = function(item, formato, extra){

      const enquadramento = item.posicaoFoto

      return '<div class="' + classe + ' visual--foto"' + fundo + '>' + conteudoExtra +

  const cardsPilha = Array.prototype.slice.call(casesPilha.querySelectorAll(".pilha__card"));

  const pararPlayers = function(){

  const mostrarCase = function(indice){

      grade.classList.add(((casesAtivo - antes + total) % total) === 1 ? "case--prox" : "case--ant");

  $("pilha-anterior").addEventListener("click", function(){ mostrarCase(casesAtivo - 1); });

  /* Arrastar para o lado troca de case (celular) */
  (function(){

  const atualizarSetas = function(){

  /* Prévia ao passar o mouse. Para começar no mesmo instante, os players dos

  let observarCards = function(){};
  if(window.matchMedia("(hover: hover) and (pointer: fine)").matches && location.protocol !== "file:"){
    const aquecidos = new Map();
    let cardPrevia = null;

    const comando = function(frame, func, args){

      frame.tabIndex = -1;

      frame.setAttribute("scrolling", "no");

      frame.referrerPolicy = "strict-origin-when-cross-origin";

      const info = { card: card, frame: frame, pronto: false, quer: false };
      /* O player só responde a comandos depois do "aperto de mão"; aproveita

      aquecidos.clear();

    };

  const rolar = function(sentido){
    carrossel.scrollBy({ left: sentido * carrossel.clientWidth, behavior: "smooth" });
  };

  /* O balão-seta que aparece no lugar do cursor perto das pontas do carrossel.
     Só faz sentido com mouse, então quem está no celular nem vê. */
  if(window.matchMedia("(hover: hover) and (pointer: fine)").matches){
    /* A zona sensível entra 110px para dentro do carrossel e segue valendo por
       toda a margem da página para fora, para o balão não sumir quando o mouse
       encosta na beirada. */
    const ZONA_DENTRO = 110;
    const secao = $("portfolio");
    const balao = document.createElement("div");
    balao.className = "cursor-seta";
    document.body.appendChild(balao);
    let sentidoAtual = 0;

    /* Descobre se o ponteiro está numa das pontas e se ainda há vídeos para
       aquele lado. Devolve -1 para a esquerda, 1 para a direita, 0 para nada. */
    const sentidoDoPonteiro = function(evento){
      /* Em cima do botão de play o balão sai da frente: ali o clique é para
         abrir o vídeo, não para avançar o carrossel. */
      if(evento.target.closest && evento.target.closest(".video__play")) return 0;
      const area = carrossel.getBoundingClientRect();
      /* Só vale na altura da fileira de vídeos */
      if(evento.clientY < area.top || evento.clientY > area.bottom) return 0;
      const fim = carrossel.scrollWidth - carrossel.clientWidth - 2;
      if(evento.clientX <= area.left + ZONA_DENTRO && carrossel.scrollLeft > 2) return -1;
      if(evento.clientX >= area.right - ZONA_DENTRO && carrossel.scrollLeft < fim) return 1;

    secao.addEventListener("mousemove", function(evento){

      if(sentido === 0){ esconderBalao(); return; }
      if(sentido !== sentidoAtual){

        balao.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' +
