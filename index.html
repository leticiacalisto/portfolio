    const balaoPlay = document.createElement("div");
    balaoPlay.className = "cursor-seta cursor-play";
    balaoPlay.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + SETAS.play + '"/></svg>';
    document.body.appendChild(balaoPlay);
    const esconderPlay = function(){ balaoPlay.classList.remove("visivel"); };
    secao.addEventListener("mousemove", function(evento){
      const card = evento.target.closest ? evento.target.closest(".video") : null;
      if(!card || sentidoAtual !== 0){ esconderPlay(); return; }
      balaoPlay.style.left = evento.clientX + "px";
      balaoPlay.style.top = evento.clientY + "px";
      balaoPlay.classList.add("visivel");
    });
    secao.addEventListener("mouseleave", esconderPlay);
    carrossel.addEventListener("scroll", esconderPlay, { passive: true });
    carrossel.addEventListener("scroll", esconderBalao, { passive: true });

    /* Na fase de captura para o clique valer como "avançar" mesmo quando cai
       em cima de um card que é link. */
    secao.addEventListener("click", function(evento){
      if(sentidoAtual === 0) return;
      evento.preventDefault();
      evento.stopPropagation();
      rolar(sentidoAtual);
      esconderBalao();
    }, true);
  }

  /* O HTML dos cards de um nicho, usado tanto pelo carrossel do computador
     quanto pela lista de nichos do celular */
  const htmlVideos = function(nicho){
    return     nicho.videos.map(function(v){
          const idYoutube = idDoYoutube(v.link);
          const capa = v.capa || (idYoutube ? capaYoutube(idYoutube) : "");
          const fundo = capa
            ? '<img src="' + escapar(capa) + '" alt=""' +
              (idYoutube ? ' data-capa-alternativa="' + escapar(capaAlternativa(idYoutube)) + '"' : "") +
              ' loading="lazy">'
            : '<span class="video__fundo" style="background:' + gradiente(v.gradiente) + '"></span>';
          const miolo =
            fundo +
            (v.marca ? '<span class="video__marca">' + escapar(v.marca) + '</span>' : "") +
            '<span class="video__play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + SETAS.play + '"/></svg></span>' +
            /* Só a linha leve com o conteúdo (ex.: "Tratamento"); sem nicho e sem
               repetir a marca, que já está no balão de cima. Vídeo sem essa
               descrição no doc de origem não ganha nenhuma legenda embaixo. */
            (v.conteudo ? '<span class="video__base"><span>' + escapar(v.conteudo) + '</span></span>' : "");
          /* Vídeo do YouTube: o card vira um botão que abre a janela por cima da
             página. Outro link (Instagram, TikTok...): abre numa aba nova, como
             antes. Sem link: o card é só figura. */
          if(idYoutube){
            const tituloVideo = v.marca ? (v.marca + (v.conteudo ? " — " + v.conteudo : "")) : "";
            return '<button type="button" class="video' + (nicho.horizontal ? ' video--horizontal' : '') + '" data-youtube="' + escapar(idYoutube) + '"' +
              (tituloVideo ? ' data-titulo="' + escapar(tituloVideo) + '"' : "") +
              (String(v.link).indexOf("/shorts/") > -1 ? ' data-vertical="1"' : "") +
              ' aria-haspopup="dialog">' + miolo + '</button>';
          }
          return v.link
            ? '<a class="video" href="' + escapar(v.link) + '" target="_blank" rel="noopener">' + miolo + '</a>'
            : '<div class="video">' + miolo + '</div>';
        }).join("");
  };

  /* Desenha os vídeos do nicho escolhido. A página não se mexe: só o título,
     a contagem e os cards mudam de conteúdo. */
  const mostrarNicho = function(indice){
    const nicho = CONFIG.conteudo.nichos[indice];

    $("conteudo-topo").innerHTML =
      '<div>' +
        '<div class="conteudo__nome">' +
          '<h3 class="titulo__impacto">' + escapar(nicho.nome) + '</h3>' +
          '<span class="conteudo__contagem">' + (nicho.videos.length < 10 ? "0" : "") + nicho.videos.length + '</span>' +
        '</div>' +
        (nicho.descricao ? '<p class="conteudo__descricao">' + escapar(nicho.descricao) + '</p>' : "") +
      '</div>' +
      '<div class="setas">' +
        '<button type="button" class="seta" id="seta-anterior" aria-label="Ver os vídeos anteriores">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + SETAS.anterior + '"/></svg></button>' +
        '<button type="button" class="seta" id="seta-proxima" aria-label="Ver os próximos vídeos">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + SETAS.proximo + '"/></svg></button>' +
      '</div>';

    carrossel.classList.toggle("carrossel--duplo", !!nicho.duasLinhas);
    carrossel.classList.toggle("carrossel--horizontal", !!nicho.horizontal);
    trilho.innerHTML = htmlVideos(nicho);

    carrossel.scrollLeft = 0;
    observarCards();
    botoesNicho.forEach(function(b){
      b.setAttribute("aria-pressed", String(Number(b.dataset.indice) === indice));
    });
    avisoNicho.textContent = T.videosEm(nicho.videos.length, nicho.nome);

    $("seta-anterior").addEventListener("click", function(){ rolar(-1); });
    $("seta-proxima").addEventListener("click", function(){ rolar(1); });
    /* Espera o navegador medir os cards antes de decidir o estado das setas */
    requestAnimationFrame(atualizarSetas);
  };

  /* No celular os vídeos do nicho viram uma grade de 3 colunas, de 5 em 5, com
     "Ver mais" embaixo. Clicar num nicho mostra só ele e leva a tela até os vídeos. */
  const celularNichos = window.matchMedia("(max-width: 620px)");
  botoesNicho.forEach(function(botao){
    botao.addEventListener("click", function(){
      mostrarNicho(Number(botao.dataset.indice));
      if(celularNichos.matches) $("conteudo-topo").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
  mostrarNicho(0);

  /* ----- Celular: os nichos um embaixo do outro, cada um com seu carrossel de
     3 vídeos (arrastando para o lado). Aparecem 5 nichos e "Mostrar mais"
     abre mais 5. Clicar num balão mostra só aquele nicho; "Todos" volta. ----- */
  $("nichos").insertAdjacentHTML("beforebegin", '<p class="dica-deslize">' + (IDIOMA === "en" ? "Swipe sideways to see more" : "Deslize para o lado para ver mais") + '</p>');
  const listaNichos = document.createElement("div");
  listaNichos.className = "nichos-lista";
  listaNichos.innerHTML = CONFIG.conteudo.nichos.map(function(n, i){
    return '<section class="nl" data-indice="' + i + '">' +
      '<div class="nl__topo"><h3 class="titulo__impacto">' + escapar(n.nome) + '</h3>' +
      '<span class="conteudo__contagem">' + (n.videos.length < 10 ? "0" : "") + n.videos.length + '</span></div>' +
      '<div class="carrossel' + (n.horizontal ? ' carrossel--horizontal' : '') + '"><div class="carrossel__trilho">' + htmlVideos(n) + '</div></div>' +
    '</section>';
  }).join("");
  const botaoMaisNichos = document.createElement("button");
  botaoMaisNichos.type = "button";
  botaoMaisNichos.className = "nichos__mais";
  botaoMaisNichos.textContent = IDIOMA === "en" ? "Show more" : "Mostrar mais";
  carrossel.parentNode.insertBefore(listaNichos, carrossel);
  carrossel.parentNode.insertBefore(botaoMaisNichos, carrossel);
  const botaoTodos = document.createElement("button");
  botaoTodos.type = "button";
  botaoTodos.className = "nicho nicho--todos";
  botaoTodos.textContent = IDIOMA === "en" ? "All" : "Todos";
  $("nichos").insertBefore(botaoTodos, $("nichos").firstChild);
  let nichoUnico = -1, nichosVisiveis = 5;
  const aplicarLista = function(){
    const secoes = listaNichos.children;
    for(let i = 0; i < secoes.length; i++){
      secoes[i].classList.toggle("nl--oculto", nichoUnico >= 0 ? i !== nichoUnico : i >= nichosVisiveis);
    }
    botaoMaisNichos.hidden = nichoUnico >= 0 || nichosVisiveis >= secoes.length;
    botaoTodos.setAttribute("aria-pressed", String(nichoUnico < 0));
    botoesNicho.forEach(function(b){ b.setAttribute("aria-pressed", String(Number(b.dataset.indice) === nichoUnico)); });
  };
  botaoMaisNichos.addEventListener("click", function(){ nichosVisiveis += 5; aplicarLista(); });
  botaoTodos.addEventListener("click", function(){ nichoUnico = -1; aplicarLista(); });
  botoesNicho.forEach(function(b){
    b.addEventListener("click", function(){
      nichoUnico = Number(b.dataset.indice);
      aplicarLista();
      if(celularNichos.matches) listaNichos.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
  aplicarLista();

  /* Se a capa em qualidade máxima não existir para aquele vídeo específico
     (raro, alguns vídeos mais antigos não têm), troca sozinha pela versão que
     o YouTube sempre gera. Isso nunca dispara o evento "error" da imagem: o
     YouTube devolve, em vez de um erro de verdade, uma imagem cinza de
     120x90 (por isso o cheque é pelo tamanho, no "load"). Fica num só
     ouvinte, na fase de captura, porque nenhum dos dois eventos borbulha. */
  const CAPA_MINIMA = 400;
  const trocarPelaCapaAlternativa = function(img){
    if(img && img.matches && img.matches(".video img[data-capa-alternativa]")){
      img.src = img.dataset.capaAlternativa;
      img.removeAttribute("data-capa-alternativa");
    }
  };
  document.addEventListener("error", function(evento){
    trocarPelaCapaAlternativa(evento.target);
  }, true);
  document.addEventListener("load", function(evento){
    const img = evento.target;
    if(img && img.tagName === "IMG" && img.naturalWidth > 0 && img.naturalWidth < CAPA_MINIMA){
      trocarPelaCapaAlternativa(img);
    }
  }, true);

  /* ---------- Lightbox: toca o vídeo do card sem sair da página ----------
     Um <iframe> comum do YouTube, sem a API de JavaScript dele: a API extra
     precisa que o site esteja num endereço http(s) de verdade para validar
     a "origem" do pedido, e falha com o Erro 153 quando a página é aberta
     como arquivo local (file://) ou de um domínio que ela não reconhece.
     Um iframe simples toca o vídeo do mesmo jeito, sem essa checagem, então
     funciona tanto no seu computador quanto já publicado. */
  const lightbox = $("lightbox");
  const lightboxPlayer = $("lightbox-player");
  const lightboxFechar = $("lightbox-fechar");
  let focoAntesDoVideo = null;

  const abrirVideo = function(id, origem){
    focoAntesDoVideo = origem || document.activeElement;
    lightbox.querySelector(".lightbox__caixa").classList.toggle("lightbox__caixa--horizontal",
      !!(origem && origem.classList && origem.classList.contains("video--horizontal")));
    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
    requestAnimationFrame(function(){ lightbox.classList.add("aberto"); });
    lightboxFechar.focus();

    /* vq=hd1080 pede a qualidade mais alta ao player; sem controles extras
       (rel, branding) da tela de "vídeos relacionados" no final. cc_load_policy=0
       só evita a legenda quando quem está assistindo nunca ligou legenda em
       nenhum vídeo do YouTube nesse navegador — se já ligou, o YouTube guarda
       essa preferência e ignora o parâmetro em qualquer vídeo embutido. Por
       isso, fora do teste local (arquivo file://, onde a API de JS falha com
       Erro 153), a gente também manda o comando "desligar legenda" assim que
       o player carrega, o que funciona mesmo com a preferência ligada. */
    const foraDeArquivoLocal = location.protocol !== "file:";
    const srcVideo = "https://www.youtube.com/embed/" + encodeURIComponent(id) +
      "?autoplay=1&playsinline=1&rel=0&modestbranding=1&vq=hd1080&cc_load_policy=0&hl=pt" +
      (foraDeArquivoLocal ? "&enablejsapi=1&origin=" + encodeURIComponent(location.origin) : "");
    lightboxPlayer.innerHTML =
      '<iframe src="' + srcVideo + '"' +
        ' title="Vídeo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"' +
        ' allowfullscreen></iframe>';

    if(foraDeArquivoLocal){
      const frame = lightboxPlayer.querySelector("iframe");
      const desligarLegenda = function(){
        try{ frame.contentWindow.postMessage(JSON.stringify({ event: "command", func: "unloadModule", args: ["captions"] }), "*"); }catch(e){}
      };
      [500, 1200, 2500].forEach(function(t){ window.setTimeout(desligarLegenda, t); });
    }
  };

  const fecharVideo = function(){
    if(lightbox.hidden) return;
    lightbox.classList.remove("aberto");
    document.body.style.overflow = "";
    /* Espera a animação de saída para só então tirar o iframe (o que já para
       o vídeo) e esconder a janela, senão o corte fica seco */
    window.setTimeout(function(){
      lightbox.hidden = true;
      lightboxPlayer.innerHTML = "";
    }, 250);
    if(focoAntesDoVideo && focoAntesDoVideo.focus) focoAntesDoVideo.focus();
  };

  document.addEventListener("click", function(evento){
    const cardVideo = evento.target.closest("[data-youtube]");
    if(cardVideo){ abrirVideo(cardVideo.dataset.youtube, cardVideo); return; }
    if(evento.target.closest("#lightbox-fechar")){ fecharVideo(); return; }
    /* Clicar no fundo escuro (fora da caixa do vídeo) também fecha */
    if(evento.target === lightbox) fecharVideo();
  });

  document.addEventListener("keydown", function(evento){
    if(evento.key === "Escape" && !lightbox.hidden) fecharVideo();
  });

  /* ---------- 8. Fotos UGC ---------- */
  /* Como na tarja de logos, cada trilho leva o grupo duas vezes: a segunda
     cópia é escondida dos leitores de tela e é ela que faz o rodízio parecer
     não ter fim. */
  const grupoDeFotos = function(lista){
    return '<ul class="marquise__grupo">' +
      lista.map(function(f){
        return '<li class="foto-ugc">' +
                 '<img src="imagens/fotos-ugc/' + encodeURI(f.arquivo) + '"' +
                 ' alt="' + escapar(f.alt) + '" loading="lazy">' +
               '</li>';
      }).join("") +
    '</ul>';
  };
  /* Quanto a tarja anda por segundo. É daqui que sai a duração da animação,
     calculada pela largura do trilho: assim as duas correm no mesmo ritmo,
     mesmo tendo quantidades diferentes de fotos. */
  const VELOCIDADE_FOTOS = 9;

  const montarTarjaDeFotos = function(id, lista){
    const trilho = $(id);
    /* Um grupo só pode ficar mais estreito que a janela — e aí, no fim da
       volta, apareceria um vão em branco de um lado. Por isso mede-se um
       grupo e repete-se a lista até ele passar da largura da tela. */
    trilho.innerHTML = grupoDeFotos(lista);
    const larguraDeUmGrupo = trilho.firstElementChild.getBoundingClientRect().width;
    const vezes = Math.max(1, Math.ceil(window.innerWidth / larguraDeUmGrupo));
    let completa = [];
    for(let i = 0; i < vezes; i++) completa = completa.concat(lista);

    const grupo = grupoDeFotos(completa);
    trilho.innerHTML = grupo +
      grupo.replace('<ul class="marquise__grupo">', '<ul class="marquise__grupo" aria-hidden="true">');
    const percurso = trilho.firstElementChild.getBoundingClientRect().width;
    trilho.style.animationDuration = (percurso / VELOCIDADE_FOTOS).toFixed(1) + "s";
  };

  const metadeDasFotos = Math.ceil(CONFIG.fotos.lista.length / 2);
  montarTarjaDeFotos("fotos-trilho-a", CONFIG.fotos.lista.slice(0, metadeDasFotos));
  montarTarjaDeFotos("fotos-trilho-b", CONFIG.fotos.lista.slice(metadeDasFotos));

  /* ---------- 9. Serviços ---------- */
  /* A palavra duas vezes por linha, em linhas de sobra: o bloco corta o que
     passar de cima e de baixo, então é para encher de ponta a ponta */
  const fundoLinhasServicos = new Array(14).fill(
    '<span>' + escapar(CONFIG.servicos.rotulo) + ' ' + escapar(CONFIG.servicos.rotulo) + '</span>'
  ).join("");
  const fotoServicos = CONFIG.servicos.foto
    ? '<img src="' + escapar(CONFIG.servicos.foto) + '" alt="' + escapar(CONFIG.servicos.alt) + '" loading="lazy">'
    : '<div class="retrato-recortado__vazio" role="img" aria-label="' + escapar(CONFIG.servicos.alt) +
      '" style="background:' + gradiente(CONFIG.servicos.gradiente) + '"></div>';
  const cartoesServicos = CONFIG.servicos.lista.map(function(s, i){
    const numero = ("0" + (i + 1)).slice(-2);
    const lado = i % 2 === 0 ? "esq" : "dir";
    return '<article class="servico-cartao revelar">' +
      '<span class="servico-cartao__pino" aria-hidden="true"></span>' +
      '<h3><span class="servico-cartao__numero">' + numero + '</span>' + escapar(s.titulo) + '</h3>' +
      '<p>' + escapar(s.descricao) + '</p>' +
    '</article>';
  }).join("");

  $("servicos-corpo").innerHTML =
    '<div class="container servicos__cena">' +
      '<div class="servicos__retratos">' +
        '<p class="servicos__fundo-titulo" aria-hidden="true">' + fundoLinhasServicos + '</p>' +
        '<div class="retrato-recortado">' + fotoServicos + '</div>' +
      '</div>' +
      '<div class="servicos__lado">' +
        '<div class="cabecalho-secao servicos__cabecalho revelar">' +
          '<p class="rotulo">' + escapar(CONFIG.servicos.rotulo) + '</p>' +
          '<h2 id="titulo-servicos">' + CONFIG.servicos.titulo + '</h2>' +
          '<p class="subtitulo">' + escapar(CONFIG.servicos.subtitulo) + '</p>' +
        '</div>' +
        '<div class="servicos__cartoes">' + cartoesServicos + '</div>' +
      '</div>' +
    '</div>';

  /* ---------- 10. Depoimentos ---------- */
  const dep = CONFIG.depoimentos;
  $("depoimentos-cabecalho").innerHTML =
    '<p class="rotulo">' + escapar(dep.rotulo) + '</p>' +
    '<h2 id="titulo-depoimentos" class="dep__titulo">' +
      '<span class="dep__impacto">' + escapar(dep.titulo.impacto) + '</span>' +
      '<span class="dep__cursiva">' + escapar(dep.titulo.cursiva) + '</span>' +
    '</h2>';

  const iniciaisDe = function(nome){
    return nome.split(" ").filter(Boolean).slice(0, 2).map(function(p){
      return p.charAt(0).toUpperCase();
    }).join("");
  };
  const GRADIENTES_AVATAR = ["grafiteProfundo", "laranjaTinta", "tintaNoite", "duoQuente", "vinhoSuave"];

  $("depoimentos-grade").innerHTML = dep.colunas.map(function(coluna, ci){
    return '<div class="dep__coluna revelar" data-coluna="' + ci + '">' +
      '<div class="dep__topo">' +
        '<h3 class="dep__cat">' + escapar(coluna.rotulo) + '</h3>' +
        '<div class="dep__setas">' +
          '<button type="button" class="dep__seta" data-sentido="-1" aria-label="' + escapar(T.depAnterior) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6L14 3.2 5.2 12l8.8 8.8 1.4-1.4L8 12z"/></svg></button>' +
          '<button type="button" class="dep__seta" data-sentido="1" aria-label="' + escapar(T.depProximo) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 4.6L10 3.2 18.8 12 10 20.8l-1.4-1.4L15 12z"/></svg></button>' +
        '</div>' +
      '</div>' +
      '<div class="dep__pilha">' +
        coluna.itens.map(function(d, i){
          const marca = d.logo
            ? '<img class="dep__logo" src="' + escapar(d.logo) + '" alt="" loading="lazy">'
            : '<span class="avatar dep__logo dep__iniciais" aria-hidden="true" style="background:' +
              gradiente(GRADIENTES_AVATAR[(ci + i) % GRADIENTES_AVATAR.length]) + '">' + iniciaisDe(d.marca) + '</span>';
          return '<figure class="dep__card" data-pos="' + Math.min(i, 3) + '">' +
                   '<blockquote' + (d.texto.length > 190 ? ' class="longo"' : d.texto.length > 110 ? ' class="medio"' : '') + '>' + escapar(d.texto) + '</blockquote>' +
                   '<figcaption>' + marca + '<span class="dep__marca">' + escapar(d.marca) + '</span></figcaption>' +
                 '</figure>';
        }).join("") +
      '</div>' +
    '</div>';
  }).join("");

  /* Em cada coluna, o depoimento da frente passa sozinho a cada poucos
     segundos, com fade; parar o mouse em cima pausa, e as setas avançam e
     voltam na hora. As colunas começam com uma pequena diferença para não
     trocarem todas juntas. */
  Array.prototype.slice.call(document.querySelectorAll(".dep__coluna")).forEach(function(coluna, ci){
    const cards = Array.prototype.slice.call(coluna.querySelectorAll(".dep__card"));
    const total = cards.length;
    let atual = 0;
    let relogio = null;
    let sobre = false;

    const mostrar = function(indice){
      atual = (indice + total) % total;
      cards.forEach(function(card, k){
        card.setAttribute("data-pos", String(Math.min((k - atual + total) % total, 3)));
      });
    };
    const agendar = function(atraso){
      window.clearTimeout(relogio);
      relogio = window.setTimeout(function(){
        if(!sobre) mostrar(atual + 1);
        agendar(dep.intervalo * 1000);
      }, atraso);
    };

    coluna.addEventListener("click", function(evento){
      const seta = evento.target.closest(".dep__seta");
      if(!seta) return;
      mostrar(atual + Number(seta.getAttribute("data-sentido")));
      agendar(dep.intervalo * 1000);
    });
    coluna.addEventListener("mouseenter", function(){ sobre = true; });
    coluna.addEventListener("mouseleave", function(){ sobre = false; agendar(dep.intervalo * 1000); });
    mostrar(0);
    agendar(dep.intervalo * 1000 + ci * 700);
  });

  /* ---------- 11. Contato ---------- */
  /* O envio de e-mail: o formulário manda os dados para o FormSubmit, que
     entrega a mensagem na caixa de entrada de leticiaacalisto@gmail.com sem
     abrir o programa de e-mail de quem preencheu. Na primeira vez, o
     FormSubmit pede uma confirmação por e-mail para ativar o endereço. */
  const enviarEmail = function(assunto, campos){
    const corpo = { _subject: assunto, _template: "table", _captcha: "false" };
    Object.keys(campos).forEach(function(k){ corpo[k] = campos[k]; });
    return fetch("https://formsubmit.co/ajax/" + CONFIG.contatoDados.email, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(corpo)
    }).then(function(r){
      return r.json().catch(function(){ return {}; });
    }).then(function(j){
      if(String(j.success) !== "true") throw new Error("envio recusado");
    });
  };

  const c = CONFIG.contatoDados;

  /* Os símbolos dos canais, desenhados a traço para caberem no círculo vazado */
  const SIMBOLOS = {
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/>' +
               '<circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>',
    whatsapp:  '<path d="M21 11.6a8.5 8.5 0 0 1-12.6 7.5L3.5 20.5l1.5-4.8A8.5 8.5 0 1 1 21 11.6z"/>' +
               '<path d="M8.9 8.3c.3-.1.6 0 .8.3l.8 1.3c.2.3.1.6-.1.8l-.5.5c.5 1 1.3 1.8 2.3 2.3l.5-.5c.2-.2.5-.3.8-.1l1.3.8c.3.2.4.5.3.8-.3.8-1.1 1.3-1.9 1.2-2.7-.4-4.9-2.6-5.3-5.3-.1-.8.3-1.6 1-1.9z"/>',
    email:     '<rect x="2.6" y="5" width="18.8" height="14" rx="2.5"/><path d="M3.4 6.8 12 13l8.6-6.2"/>'
  };
  const canalContato = function(chave, href, titulo, novaAba, rastrear, legenda){
    return '<li><a href="' + href + '"' + (novaAba ? ' target="_blank" rel="noopener"' : '') +
           (rastrear ? ' data-rastrear="' + rastrear + '"' : '') +
           ' aria-label="' + escapar(titulo) + '" title="' + escapar(titulo) + '">' +
           '<svg viewBox="0 0 24 24" aria-hidden="true">' + SIMBOLOS[chave] + '</svg>' +
           '<span>' + escapar(legenda) + '</span></a></li>';
  };

  const fotoContato = CONFIG.contato.foto
    ? '<img src="' + escapar(CONFIG.contato.foto) + '" alt="' + escapar(CONFIG.contato.altFoto) + '" loading="lazy">'
    : '<div class="contato__foto--vazia" role="img" aria-label="' + escapar(CONFIG.contato.altFoto) +
      '" style="background:' + gradiente(CONFIG.contato.gradienteFoto) + '"></div>';

  $("contato-info").innerHTML =
    '<div class="contato__texto">' +
      '<h2 id="titulo-contato" class="contato__titulo">' + escapar(CONFIG.contato.titulo) + '</h2>' +
      '<p class="subtitulo">' + escapar(CONFIG.contato.subtitulo) + '</p>' +
      '<ul class="canais">' +
        canalContato("instagram", escapar(c.instagramLink), "Instagram " + c.instagramUsuario, true, "contact_instagram", c.instagramUsuario) +
        canalContato("whatsapp", linkWhats, "WhatsApp " + c.telefoneVisivel, true, "contact_whatsapp", c.telefoneVisivel) +
        canalContato("email", linkEmail, "E-mail " + c.email, false, "contact_email", c.email) +
      '</ul>' +
    '</div>' +
    '<div class="contato__foto">' + fotoContato + '</div>';

  /* O formulário é montado a partir da lista de campos do CONFIG, para
     acrescentar ou tirar um campo ser só mexer lá em cima. */
  $("contato-formulario").innerHTML =
    '<form class="formulario" id="form-contato" novalidate>' +
      CONFIG.contato.campos.map(function(campo){
        const id = "campo-" + campo.id;
        const obrigatorio = campo.obrigatorio ? " required" : "";
        const corpo = campo.tipo === "textarea"
          ? '<textarea id="' + id + '" name="' + campo.id + '"' + obrigatorio +
            (campo.exemplo ? ' placeholder="' + escapar(campo.exemplo) + '"' : "") + '></textarea>'
          : '<input id="' + id + '" name="' + campo.id + '" type="' + campo.tipo + '"' + obrigatorio +
            (campo.exemplo ? ' placeholder="' + escapar(campo.exemplo) + '"' : "") + '>';
        return '<label class="campo' + (campo.tipo === "textarea" ? " campo--largo" : "") + (campo.tamanho ? " campo--" + campo.tamanho : "") + '" for="' + id + '"><span>' + escapar(campo.rotulo) + '</span>' + corpo + '</label>';
      }).join("") +
      '<button class="btn btn--principal" type="submit">' + escapar(CONFIG.contato.botao) + '</button>' +
      '<p class="aviso-form" id="aviso-form" role="status" hidden></p>' +
    '</form>' +
    /* Só aparece no celular: os canais em ícones, embaixo do formulário */
    '<ul class="canais canais--cel">' +
      canalContato("instagram", escapar(c.instagramLink), "Instagram " + c.instagramUsuario, true, "contact_instagram", c.instagramUsuario) +
      canalContato("whatsapp", linkWhats, "WhatsApp " + c.telefoneVisivel, true, "contact_whatsapp", c.telefoneVisivel) +
      canalContato("email", linkEmail, "E-mail " + c.email, false, "contact_email", c.email) +
    '</ul>';

  const form = $("form-contato");
  const aviso = $("aviso-form");

  /* Campos de valor: vira "R$ 2.500" (ou "US$ 2,500" em inglÃªs) enquanto digita */
  CONFIG.contato.campos.forEach(function(campo){
    if(!campo.moeda) return;
    const el = $("campo-" + campo.id);
    const em = IDIOMA === "en";
    el.setAttribute("inputmode", "numeric");
    el.addEventListener("input", function(){
      const digitos = el.value.replace(/\D/g, "").replace(/^0+/, "");
      el.value = digitos
        ? (em ? "US$ " : "R$ ") + Number(digitos).toLocaleString(em ? "en-US" : "pt-BR")
        : "";
    });
  });

  const mostrarErro = function(campo, mensagem){
    limparErro(campo);
    const span = document.createElement("span");
    span.className = "erro-campo";
    span.id = campo.id + "-erro";
    span.textContent = mensagem;
    campo.setAttribute("aria-invalid", "true");
    campo.setAttribute("aria-describedby", span.id);
    campo.parentNode.appendChild(span);
  };
  const limparErro = function(campo){
    campo.removeAttribute("aria-invalid");
    campo.removeAttribute("aria-describedby");
    const antigo = campo.parentNode.querySelector(".erro-campo");
    if(antigo) antigo.remove();
  };

  form.addEventListener("submit", function(evento){
    evento.preventDefault();
    let primeiroErro = null;

    CONFIG.contato.campos.forEach(function(campo){
      const elemento = $("campo-" + campo.id);
      const valor = elemento.value.trim();
      limparErro(elemento);

      let erro = null;
      if(campo.obrigatorio && !valor){
        erro = CONFIG.contato.obrigatorio + " " + campo.rotulo.toLowerCase() + ".";
      } else if(campo.tipo === "email" && valor && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor)){
        erro = CONFIG.contato.emailInvalido;
      } else if(campo.tipo === "textarea" && campo.obrigatorio && valor.length < 10){
        erro = CONFIG.contato.projetoCurto;
      }
      if(erro){
        mostrarErro(elemento, erro);
        primeiroErro = primeiroErro || elemento;
      }
    });
    if(primeiroErro){ primeiroErro.focus(); return; }

    if(window.Rastreamento){
      window.Rastreamento.lead({
        name: $("campo-nome").value.trim(),
        email: $("campo-email").value.trim(),
        brand: $("campo-marca") ? $("campo-marca").value.trim() || null : null,
        budget: $("campo-orcamento") ? $("campo-orcamento").value.trim() || null : null,
        message: $("campo-projeto") ? $("campo-projeto").value.trim() || null : null,
        source: "contact"
      });
      window.Rastreamento.evento("button_click", "contact_form");
    }

    /* Os campos vazios ficam de fora do e-mail, para não chegar uma linha
       solta com o rótulo e nada na frente */
    const dados = {};
    CONFIG.contato.campos.forEach(function(campo){
      const valor = $("campo-" + campo.id).value.trim();
      if(valor) dados[campo.rotulo] = valor;
    });

    const botaoEnviar = form.querySelector('button[type="submit"]');
    botaoEnviar.disabled = true;
    aviso.textContent = CONFIG.contato.enviando;
    aviso.hidden = false;
    enviarEmail(CONFIG.contato.assuntoEmail, dados).then(function(){
      aviso.textContent = CONFIG.contato.confirmacao;
      form.reset();
    }).catch(function(){
      aviso.textContent = CONFIG.contato.erroEnvio;
    }).then(function(){
      botaoEnviar.disabled = false;
    });
  });

  /* ---------- Popup "ideia de conteúdo grátis" ---------- */
  /* Abre sozinho depois de alguns segundos. Ao fechar, vira um balão fixo no
     canto de baixo, à direita, que abre de novo a qualquer momento. */
  (function(){
    const cfg = CONFIG.ideia;
    const raiz = document.createElement("div");
    raiz.className = "ideia";
    raiz.id = "ideia";
    raiz.setAttribute("data-estado", "fechado");
    raiz.innerHTML =
      '<div class="ideia__fundo" data-fechar></div>' +
      '<div class="ideia__caixa" role="dialog" aria-modal="true" aria-labelledby="ideia-titulo">' +
        '<button type="button" class="ideia__x" data-fechar aria-label="' + escapar(cfg.fechar) + '">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>' +
        '</button>' +
        '<h2 class="ideia__titulo" id="ideia-titulo">' + escapar(cfg.titulo) + '</h2>' +
        '<p class="ideia__sub">' + escapar(cfg.subtitulo) + '</p>' +
        '<form class="ideia__form" id="ideia-form" novalidate>' +
          cfg.campos.map(function(campo){
            const id = "ideia-" + campo.id;
            return '<label class="ideia__campo" for="' + id + '"><span>' + escapar(campo.rotulo) + '</span>' +
                   '<input id="' + id + '" name="' + campo.id + '" type="' + campo.tipo + '"' +
                   ' autocomplete="' + campo.autocomplete + '" required></label>';
          }).join("") +
          '<button class="btn btn--principal ideia__enviar" type="submit">' + escapar(cfg.botao) + '</button>' +
          '<p class="ideia__aviso" id="ideia-aviso" role="status" hidden></p>' +
        '</form>' +
      '</div>' +
      '<button type="button" class="ideia__balao" data-abrir>' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.41 11.58l-9-9A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 7A1.5 1.5 0 1 1 5.5 4a1.5 1.5 0 0 1 0 3z"/></svg>' +
        '<span>' + escapar(cfg.balao) + '</span>' +
      '</button>';
    document.body.appendChild(raiz);

    const estado = function(novo){
      raiz.setAttribute("data-estado", novo);
      if(novo === "aberto"){
        const primeiro = $("ideia-nome");
        if(primeiro) window.setTimeout(function(){ primeiro.focus(); }, 350);
      }
    };
    const guardar = function(chave, valor){
      try{ sessionStorage.setItem(chave, valor); }catch(e){}
    };
    const ler = function(chave){
      try{ return sessionStorage.getItem(chave); }catch(e){ return null; }
    };

    raiz.addEventListener("click", function(evento){
      if(evento.target.closest("[data-fechar]")){ guardar("ideia_minimizada", "1"); estado("balao"); }
      else if(evento.target.closest("[data-abrir]")){ estado("aberto"); }
    });
    document.addEventListener("keydown", function(evento){
      if(evento.key === "Escape" && raiz.getAttribute("data-estado") === "aberto"){
        guardar("ideia_minimizada", "1");
        estado("balao");
      }
    });

    /* Depois dos segundos combinados o popup abre sempre, tenha o visitante
       clicado em outras coisas da página ou não. */
    window.setTimeout(function(){
      estado("aberto");
    }, cfg.atraso * 1000);

    const form = $("ideia-form");
    const aviso = $("ideia-aviso");
    const limpar = function(campo){
      const antigo = campo.parentNode.querySelector(".erro-campo");
      if(antigo) antigo.remove();
      campo.removeAttribute("aria-invalid");
    };
    form.addEventListener("submit", function(evento){
      evento.preventDefault();
      let primeiro = null;
      const valores = {};
      cfg.campos.forEach(function(campo){
        const el = $("ideia-" + campo.id);
        const valor = el.value.trim();
        valores[campo.id] = valor;
        limpar(el);
        let erro = null;
        if(!valor) erro = cfg.obrigatorio;
        else if(campo.tipo === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor)) erro = cfg.emailInvalido;
        else if(campo.tipo === "tel" && valor.replace(/\D/g, "").length < 8) erro = cfg.obrigatorio;
        if(erro){
          const span = document.createElement("span");
          span.className = "erro-campo";
          span.textContent = erro;
          el.setAttribute("aria-invalid", "true");
          el.parentNode.appendChild(span);
          primeiro = primeiro || el;
        }
      });
      if(primeiro){ primeiro.focus(); return; }

      if(window.Rastreamento){
        window.Rastreamento.lead({
          name: valores.nome, email: valores.email, phone: valores.whatsapp,
          brand: valores.marca, source: "popup_ideia_gratis"
        });
        window.Rastreamento.evento("button_click", "popup_ideia_gratis");
      }

      const dados = {};
      cfg.campos.forEach(function(campo){ dados[campo.rotulo] = valores[campo.id]; });
      const botao = form.querySelector('button[type="submit"]');
      botao.disabled = true;
      aviso.textContent = cfg.enviando;
      aviso.hidden = false;
      enviarEmail(cfg.assunto, dados).then(function(){
        aviso.textContent = cfg.sucesso;
        form.reset();
        guardar("ideia_minimizada", "1");
      }).catch(function(){
        aviso.textContent = cfg.erro;
      }).then(function(){
        botao.disabled = false;
      });
    });
  })();

  /* ---------- 12. Rodapé ---------- */
  $("rodape-faq").innerHTML =
    '<h2 class="oculto-visual">' + escapar(CONFIG.faq.titulo) + '</h2>' +
    '<ul class="rodape__faq-lista">' +
      CONFIG.faq.itens.map(function(f){
        return '<li><b>' + escapar(f.pergunta) + '</b> ' + escapar(f.resposta) + '</li>';
      }).join("") +
    '</ul>';

  /* No celular as dúvidas viram um carrossel: uma por vez, passando sozinhas a
     cada 3 segundos (ou arrastando com o dedo). */
  (function(){
    const lista = document.querySelector(".rodape__faq-lista");
    const celular = window.matchMedia("(max-width: 620px)");
    let pausado = false, retomar = 0;
    const pausar = function(){
      pausado = true;
      clearTimeout(retomar);
      retomar = setTimeout(function(){ pausado = false; }, 6000);
    };
    lista.addEventListener("touchstart", pausar, { passive: true });
    lista.addEventListener("pointerdown", pausar);
    setInterval(function(){
      if(!celular.matches || pausado || document.hidden) return;
      const largura = lista.clientWidth;
      const proximo = Math.round(lista.scrollLeft / largura) + 1;
      lista.scrollTo({ left: proximo * largura >= lista.scrollWidth - 2 ? 0 : proximo * largura, behavior: "smooth" });
    }, 3000);
  })();

  $("rodape-base").innerHTML =
    '<span>&copy; ' + new Date().getFullYear() + ' ' + escapar(CONFIG.marca.nomeCompleto) + '. ' +
    escapar(CONFIG.rodape.direitos) + '</span>' +
    '<span>' + escapar(CONFIG.marca.profissao) + ' &middot; ' + escapar(c.cidade) + '</span>';

  /* ---------- Menu sanduíche no celular ---------- */
  const botaoMenu = $("hamburguer");
  const menu = $("menu");

  const fecharMenu = function(){
    menu.classList.remove("aberto");
    botaoMenu.setAttribute("aria-expanded", "false");
    botaoMenu.setAttribute("aria-label", "Abrir menu de navegação");
  };
  const abrirMenu = function(){
    menu.classList.add("aberto");
    botaoMenu.setAttribute("aria-expanded", "true");
    botaoMenu.setAttribute("aria-label", "Fechar menu de navegação");
  };

  botaoMenu.addEventListener("click", function(){
    if(menu.classList.contains("aberto")) fecharMenu();
    else abrirMenu();
  });

  menu.addEventListener("click", function(evento){
    if(evento.target.closest("a")) fecharMenu();
  });

  document.addEventListener("keydown", function(evento){
    if(evento.key === "Escape" && menu.classList.contains("aberto")){
      fecharMenu();
      botaoMenu.focus();
    }
  });

  document.addEventListener("click", function(evento){
    if(!menu.classList.contains("aberto")) return;
    if(!evento.target.closest("#menu") && !evento.target.closest("#hamburguer")) fecharMenu();
  });

  window.addEventListener("resize", function(){
    if(window.innerWidth > 860) fecharMenu();
  });

  /* ---------- Sombra no topo e link ativo conforme a rolagem ---------- */
  const topo = $("topo");
  const secoes = CONFIG.navegacao.map(function(item){
    return document.querySelector(item.alvo);
  }).filter(Boolean);
  const linksMenu = Array.prototype.slice.call(menu.querySelectorAll('a:not(.btn)'));

  const aoRolar = function(){
    topo.classList.toggle("rolou", window.scrollY > 12);
    let atual = "";
    secoes.forEach(function(secao){
      if(window.scrollY >= secao.offsetTop - 140) atual = "#" + secao.id;
    });
    linksMenu.forEach(function(link){
      link.classList.toggle("ativo", link.getAttribute("href") === atual);
    });
  };
  window.addEventListener("scroll", aoRolar, { passive: true });
  aoRolar();

  /* ---------- Fade dos cartões de serviço (celular) ----------
     Cada cartão vai de invisível a visível conforme sobe na tela. */
  (function(){
    const cartoes = Array.prototype.slice.call(document.querySelectorAll(".servico-cartao"));
    const celular = window.matchMedia("(max-width: 620px)");
    let agendado = false;
    const atualizar = function(){
      agendado = false;
      if(!celular.matches) return;
      const alt = window.innerHeight;
      cartoes.forEach(function(c){
        const topo = c.getBoundingClientRect().top;
        const p = Math.min(1, Math.max(0, (alt * 0.92 - topo) / (alt * 0.28)));
        c.style.setProperty("--fade", p.toFixed(3));
      });
    };
    window.addEventListener("scroll", function(){
      if(!agendado){ agendado = true; requestAnimationFrame(atualizar); }
    }, { passive: true });
    window.addEventListener("resize", atualizar);
    atualizar();
  })();

  /* ---------- Animação suave de entrada conforme a página rola ---------- */
  const alvos = document.querySelectorAll(".revelar");
  if("IntersectionObserver" in window){
    const observador = new IntersectionObserver(function(entradas){
      entradas.forEach(function(entrada){
        if(!entrada.isIntersecting) return;
        const el = entrada.target;
        const irmaos = Array.prototype.slice.call(el.parentNode.children).filter(function(n){
          return n.classList && n.classList.contains("revelar");
        });
        const atraso = Math.min(irmaos.indexOf(el), 5) * 90;
        el.style.transitionDelay = atraso + "ms";
        el.classList.add("visivel");
        observador.unobserve(el);
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });

    alvos.forEach(function(el){ observador.observe(el); });
  } else {
    /* Navegadores muito antigos veem tudo já visível, sem animação */
    alvos.forEach(function(el){ el.classList.add("visivel"); });
  }
})();
</script>
</body>
</html>
