<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoje | Letícia Calisto</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoje">
<link rel="icon" href="../imagens/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../imagens/icone-180.png">
<style>
/* =========================================================
   MINI APP (abre ao tocar nos widgets do iPhone)
   Estilo "My Tasks": cartão branco grande, título forte, abas
   com tracinho, bolinhas grandes com brilho suave e linhas
   pontilhadas. Lê e grava com a chave do widget
   (js/widget-tarefas-setup.sql).
   ========================================================= */
:root{
  --fundo:#EEEFF3; --cartao:#FFFFFF; --texto:#1C1C1E; --suave:#9A9AA0; --linha:#E6E6EB;
  --lilas:#7C5CE0; --lilas-bg:#EFE9FF; --lilas-in:#DDD2FF;
  --verde:#4E8A3E; --verde-bg:#E7F4E1; --verde-in:#D3EBC9;
  --amarelo:#D49A00; --amarelo-bg:#FFF4D2; --amarelo-in:#FFE7A3;
  --vermelho:#D7263D; --vermelho-bg:#FFE9EA; --vermelho-in:#FFD3D6;
  --cinza-bg:#F3F3F5; --cinza-in:#E8E8EC;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --fundo:#000000; --cartao:#1C1C1E; --texto:#F5F5F7; --suave:#8E8E93; --linha:#2E2E33;
    --lilas:#B6A2FF; --lilas-bg:#2A2347; --lilas-in:#3A3063;
    --verde:#8FD47A; --verde-bg:#1D2E18; --verde-in:#2A4222;
    --amarelo:#FFD25E; --amarelo-bg:#3A3015; --amarelo-in:#4E401B;
    --vermelho:#FF6B78; --vermelho-bg:#3A1518; --vermelho-in:#521E23;
    --cinza-bg:#2C2C2E; --cinza-in:#3A3A3C;
  }
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--sans);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input{font:inherit;color:inherit;}
[hidden]{display:none !important;}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 30px);}
.cartao{background:var(--cartao);border-radius:28px;padding:26px 22px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05);min-height:calc(100vh - 40px);}
h1{margin:0;font-size:2.15rem;font-weight:600;letter-spacing:-.03em;line-height:1.05;}
.data-hoje{margin:6px 0 0;color:var(--suave);font-size:.95rem;}

/* Abas com tracinho, como no My Tasks */
.abas{display:flex;gap:26px;margin:24px 0 0;border-bottom:1.5px solid var(--linha);}
.abas button{position:relative;border:0;background:none;padding:0 0 14px;font-size:1.12rem;font-weight:500;color:var(--suave);cursor:pointer;}
.abas button.ativo{color:var(--texto);}
.abas button.ativo::after{content:"";position:absolute;left:50%;bottom:-2px;width:20px;height:4px;margin-left:-10px;border-radius:99px;background:var(--texto);}

.resumo{margin:16px 0 4px;font-size:.88rem;color:var(--suave);}
.resumo b{color:var(--texto);font-weight:600;}

/* Seções e linhas */
.secao{margin-top:22px;}
.titulo-secao{display:flex;justify-content:space-between;margin:0 0 2px;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--suave);}
.titulo-secao.atraso{color:var(--vermelho);}
.item{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1.5px dashed var(--linha);}
.secao .item:first-of-type{border-top:0;}
.corpo{flex:1;min-width:0;}
.titulo-item{font-size:1.06rem;line-height:1.3;color:var(--texto);}
.meta{margin-top:2px;font-size:.8rem;color:var(--suave);}
.meta.atraso{color:var(--vermelho);font-weight:600;}
.item.feita .titulo-item{color:var(--lilas);text-decoration:line-through;text-decoration-thickness:1.5px;}
.vazio{padding:12px 0;color:var(--suave);font-size:.92rem;}

/* Bolinhas grandes com brilho suave */
.bola{flex:none;position:relative;width:46px;height:46px;border-radius:50%;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s ease;}
.bola:active{transform:scale(.92);}
.bola::before{content:"";position:absolute;inset:8px;border-radius:50%;}
.bola svg{position:relative;width:20px;height:20px;}
.bola.pendente{background:var(--cartao);box-shadow:inset 0 0 0 1.5px #DCDCE2,0 2px 6px rgba(0,0,0,.05);}
.bola.atrasada{background:var(--vermelho-bg);box-shadow:inset 0 0 0 1.5px var(--vermelho-in),0 6px 14px rgba(215,38,61,.18);}
.bola.feita{background:var(--lilas-bg);box-shadow:inset 0 0 0 1.5px var(--lilas-in),0 6px 16px rgba(124,92,224,.32);color:var(--lilas);}
.bola.feita::before{background:var(--lilas-in);}
.bola.producao{background:var(--verde-bg);box-shadow:inset 0 0 0 1.5px var(--verde-in),0 6px 16px rgba(78,138,62,.26);color:var(--verde);}
.bola.post{background:var(--amarelo-bg);box-shadow:inset 0 0 0 1.5px var(--amarelo-in),0 6px 16px rgba(212,154,0,.28);color:var(--amarelo);}
.bola.criar{background:var(--cinza-bg);box-shadow:inset 0 0 0 1.5px var(--cinza-in),0 2px 6px rgba(0,0,0,.05);color:var(--suave);}
.bola.criar::before{background:var(--cinza-in);}

/* Criar tarefa */
.criar-texto{font-size:1.06rem;color:var(--suave);cursor:pointer;}
.form-nova{flex:1;min-width:0;}
.form-nova input[type=text]{width:100%;border:0;background:none;padding:6px 0;font-size:1.06rem;outline:none;color:var(--texto);}
.datas-nova{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.datas-nova button,.datas-nova label{border:0;border-radius:99px;padding:5px 11px;background:var(--cinza-bg);font-size:.78rem;font-weight:500;color:var(--texto);cursor:pointer;position:relative;}
.datas-nova button.ativo,.datas-nova label.ativo{background:var(--texto);color:var(--cartao);}
.datas-nova input[type=date]{position:absolute;inset:0;opacity:0;width:100%;}
.btn-adicionar{flex:none;align-self:flex-start;margin-top:4px;border:0;border-radius:99px;padding:8px 14px;background:var(--lilas);color:#fff;font-size:.86rem;font-weight:600;cursor:pointer;}

/* Status do post */
.status{flex:none;border:0;border-radius:99px;padding:5px 11px;font-size:.76rem;font-weight:600;background:var(--cinza-bg);color:var(--suave);cursor:pointer;white-space:nowrap;}
.status.postado{background:var(--lilas-bg);color:var(--lilas);}
.status.atrasado{background:var(--vermelho-bg);color:var(--vermelho);}
.chip-tipo{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:5px;font-size:.68rem;font-weight:700;}
.chip-tipo.post{background:var(--amarelo-bg);color:var(--amarelo);}
.chip-tipo.publipost{background:var(--verde-bg);color:var(--verde);}

/* Folha de baixo para escolher o status */
.fundo-folha{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
.fundo-folha.aberta{opacity:1;pointer-events:auto;}
.folha{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;transform:translate(-50%,100%);background:var(--cartao);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transition:transform .25s ease;z-index:21;}
.folha.aberta{transform:translate(-50%,0);}
.folha .alca{width:36px;height:5px;border-radius:99px;background:var(--linha);margin:0 auto 14px;}
.folha h3{margin:0 0 2px;font-size:1.05rem;font-weight:600;}
.folha p{margin:0 0 10px;font-size:.85rem;color:var(--suave);}
.folha button.opcao{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1.5px dashed var(--linha);background:none;padding:14px 2px;font-size:1rem;text-align:left;cursor:pointer;}
.folha button.opcao.atual{font-weight:600;color:var(--lilas);}

.rodape{margin-top:28px;text-align:center;font-size:.8rem;color:var(--suave);}
.rodape a,.rodape button{color:var(--lilas);text-decoration:none;font-weight:600;border:0;background:none;padding:2px;cursor:pointer;font-size:.8rem;}
.aviso-rapido{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;padding:12px 18px;border-radius:14px;background:rgba(30,30,32,.92);color:#fff;font-size:.9rem;font-weight:500;max-width:calc(100% - 40px);text-align:center;transition:all .25s ease;pointer-events:none;z-index:30;}
.aviso-rapido.visivel{opacity:1;transform:translate(-50%,0);}
.carregando,.erro{padding:50px 10px;text-align:center;color:var(--suave);}
.erro b{display:block;margin-bottom:6px;color:var(--texto);font-size:1.05rem;}
</style>
</head>
<body>
<main class="app">
  <div class="cartao">
    <h1 id="titulo">Hoje</h1>
    <p class="data-hoje" id="dataHoje"></p>
    <nav class="abas" id="abas" role="tablist">
      <button type="button" data-aba="hoje" class="ativo">Hoje</button>
      <button type="button" data-aba="posts">Posts</button>
      <button type="button" data-aba="tarefas">Tarefas</button>
    </nav>
    <div id="conteudo"><p class="carregando">Carregando…</p></div>
    <p class="rodape"><span id="atualizadoEm"></span> · <button type="button" id="btnAtualizar">Atualizar</button> · <a href="../painel.html?aba=gp-tarefas">Abrir o painel</a></p>
  </div>
</main>

<div class="fundo-folha" id="fundoFolha"></div>
<div class="folha" id="folhaStatus" role="dialog" aria-modal="true">
  <div class="alca"></div>
  <h3 id="tituloFolha">Status do post</h3>
  <p id="subFolha"></p>
  <div id="opcoesFolha"></div>
</div>
<div class="aviso-rapido" id="avisoRapido" role="status"></div>

<script>
(function () {
  var SUPABASE_URL = "https://yqshjfzcoyiqikjnukyb.supabase.co";
  var SUPABASE_ANON =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxc2hqZnpjb3lpcWlram51a3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzIzNDgsImV4cCI6MjEwNDU0ODM0OH0.QBseFaGdtG_6g2c_7EUeGnbhb9_JIa0hBsA2AzGnkp4";
  var CHAVE_LOCAL = "miniAppChave";
  var DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  var DIAS_LONGOS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  var MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  var STATUS = [["afazer", "A fazer"], ["roteiro", "Roteiro pronto"], ["gravado", "Gravado"], ["editado", "Editado"], ["postado", "Postado"]];
  var NOME_STATUS = {};
  STATUS.forEach(function (s) { NOME_STATUS[s[0]] = s[1]; });
  var ICONES = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    mais: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    etapa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1-8.5 6" stroke-dasharray="2.2 3.2"/><path d="M8 12l3 3 5-6"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1-8.5 6" stroke-dasharray="2.2 3.2"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>',
  };

  // ---------- chave: vem no link do widget (#k=...) e fica guardada neste aparelho ----------
  var params = new URLSearchParams(location.hash.slice(1));
  var chave = params.get("k") || "";
  var abaAtual = params.get("aba") || "hoje";
  var concluirAoAbrir = params.get("concluir") || "";
  try {
    if (chave) localStorage.setItem(CHAVE_LOCAL, chave);
    else chave = localStorage.getItem(CHAVE_LOCAL) || "";
  } catch (e) {}
  if (params.get("k") || concluirAoAbrir) history.replaceState(null, "", location.pathname + "#aba=" + abaAtual);

  var dados = null;
  var novaAberta = false;
  var novaData = "hoje"; // "hoje" | "amanha" | "" | AAAA-MM-DD
  var conteudo = document.getElementById("conteudo");

  // ---------- utilitários ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isoDe(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dataDe(iso) {
    var p = String(iso).slice(0, 10).split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function hojeIso() { return isoDe(new Date()); }
  function somarDias(iso, n) { var d = dataDe(iso); d.setDate(d.getDate() + n); return isoDe(d); }
  function diasEntre(a, b) { return Math.round((dataDe(b) - dataDe(a)) / 86400000); }
  function quando(iso, hoje) {
    var dif = diasEntre(hoje, iso);
    if (dif === 0) return "hoje";
    if (dif === 1) return "amanhã";
    if (dif === -1) return "ontem";
    if (dif < 0) return "há " + -dif + " dias";
    var d = dataDe(iso);
    return DIAS[d.getDay()] + ", " + String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function rpc(nome, corpo) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + nome, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON, "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  var timerAviso = null;
  function avisoRapido(texto) {
    var el = document.getElementById("avisoRapido");
    el.textContent = texto;
    el.classList.add("visivel");
    clearTimeout(timerAviso);
    timerAviso = setTimeout(function () { el.classList.remove("visivel"); }, 2600);
  }
  function falhou(erro) {
    console.error(erro);
    alert("Não consegui salvar. Confira a internet e tente de novo.");
  }

  // ---------- dados organizados ----------
  // item: { tipo: "tarefa"|"etapa", id, titulo, sub, inicio, prazo, feito, feitoEm }
  function itensDeTarefa() {
    var itens = [];
    (dados.tarefas || []).forEach(function (t) {
      if (!t) return;
      itens.push({ tipo: "tarefa", id: String(t.id), titulo: t.titulo || "(sem título)", sub: "", inicio: t.data || null, prazo: t.data || null, feito: !!t.feita, feitoEm: t.feitaEm || null });
    });
    (dados.producao || []).forEach(function (s) {
      if (!s || !s.fim) return;
      var fim = String(s.fim).slice(0, 10);
      itens.push({ tipo: "etapa", id: String(s.id || ""), titulo: s.nome || "Etapa", sub: s.video || "", inicio: String(s.inicio || s.fim).slice(0, 10), prazo: fim, feito: !!s.concluida, feitoEm: null });
    });
    return itens;
  }
  function posts() {
    return (dados.posts || []).map(function (p) { return Object.assign({}, p, { data: p.data ? String(p.data).slice(0, 10) : null }); });
  }
  function ehDeHoje(i, hoje) { return i.inicio && i.inicio <= hoje && i.prazo >= hoje; }
  // dia em que foi feita: o registrado ou, para etapa de produção (sem registro), o prazo, nunca depois de hoje
  function feitaEm(i) {
    if (i.feitoEm) return isoDe(new Date(i.feitoEm));
    var hoje = hojeIso();
    return i.prazo && i.prazo > hoje ? hoje : i.prazo;
  }

  // ---------- peças ----------
  function htmlItem(i, hoje) {
    var atrasada = !i.feito && i.prazo && i.prazo < hoje;
    var classe = i.feito ? "feita" : i.tipo === "etapa" ? "producao" : atrasada ? "atrasada" : "pendente";
    var icone = i.feito ? ICONES.check : i.tipo === "etapa" ? ICONES.etapa : "";
    var meta = [];
    if (i.tipo === "etapa") meta.push("Produção" + (i.sub ? " · " + esc(i.sub) : ""));
    if (!i.feito && i.prazo && i.prazo !== hoje && !(i.inicio <= hoje && i.prazo >= hoje)) meta.push(quando(i.inicio > hoje ? i.inicio : i.prazo, hoje));
    return '<div class="item' + (i.feito ? " feita" : "") + '">' +
      '<button type="button" class="bola ' + classe + '" data-marcar="' + i.tipo + ":" + esc(i.id) + '" aria-label="' + (i.feito ? "Reabrir" : "Concluir") + '">' + icone + "</button>" +
      '<div class="corpo"><div class="titulo-item">' + esc(i.titulo) + "</div>" +
      (meta.length ? '<div class="meta' + (atrasada ? " atraso" : "") + '">' + meta.join(" · ") + "</div>" : "") + "</div></div>";
  }
  function htmlPost(p, hoje) {
    var atrasado = p.data && p.data < hoje && p.status !== "postado";
    var meta = (p.data ? quando(p.data, hoje) : "sem data") + (p.marca ? " · " + esc(p.marca) : "");
    return '<div class="item' + (p.status === "postado" ? " feita" : "") + '">' +
      '<button type="button" class="bola ' + (p.status === "postado" ? "feita" : "post") + '" data-post="' + esc(p.id) + '" aria-label="Mudar o status">' + (p.status === "postado" ? ICONES.check : ICONES.play) + "</button>" +
      '<div class="corpo"><div class="titulo-item">' + esc(p.titulo) + "</div>" +
      '<div class="meta' + (atrasado ? " atraso" : "") + '"><span class="chip-tipo ' + (p.tipo === "publipost" ? "publipost" : "post") + '">' + (p.tipo === "publipost" ? "Publi" : "Post") + "</span>" + meta + "</div></div>" +
      '<button type="button" class="status ' + (p.status === "postado" ? "postado" : atrasado ? "atrasado" : "") + '" data-post="' + esc(p.id) + '">' + esc(NOME_STATUS[p.status] || "A fazer") + "</button></div>";
  }
  function htmlCriar() {
    if (!novaAberta) {
      return '<div class="item"><button type="button" class="bola criar" data-abrir-nova aria-label="Criar tarefa">' + ICONES.mais + '</button><span class="criar-texto" data-abrir-nova>Criar tarefa</span></div>';
    }
    var hoje = hojeIso();
    var personalizada = novaData && novaData !== "hoje" && novaData !== "amanha";
    var chip = function (valor, rotulo) {
      return '<button type="button" data-data-nova="' + valor + '" class="' + (novaData === valor ? "ativo" : "") + '">' + rotulo + "</button>";
    };
    return '<div class="item"><button type="button" class="bola criar" data-fechar-nova aria-label="Cancelar">' + ICONES.mais + "</button>" +
      '<div class="form-nova"><input type="text" id="campoNova" placeholder="Nova tarefa" autocomplete="off" enterkeyhint="done">' +
      '<div class="datas-nova">' + chip("hoje", "Hoje") + chip("amanha", "Amanhã") + chip("", "Sem data") +
      '<label class="' + (personalizada ? "ativo" : "") + '">' + (personalizada ? quando(novaData, hoje) : "Escolher dia") + '<input type="date" id="campoDataNova" value="' + (personalizada ? novaData : "") + '"></label></div></div>' +
      '<button type="button" class="btn-adicionar" id="btnAdicionarNova">Adicionar</button></div>';
  }
  function secao(titulo, html, classe) {
    if (!html) return "";
    return '<section class="secao"><div class="titulo-secao' + (classe ? " " + classe : "") + '"><span>' + titulo + "</span></div>" + html + "</section>";
  }
  function lista(itens, hoje) { return itens.map(function (i) { return htmlItem(i, hoje); }).join(""); }
  var porPrazo = function (a, b) { return String(a.prazo).localeCompare(String(b.prazo)); };

  // ---------- abas ----------
  function abaHoje(hoje) {
    var itens = itensDeTarefa();
    var pendentesHoje = itens.filter(function (i) { return !i.feito && ehDeHoje(i, hoje); }).sort(porPrazo);
    var atrasadas = itens.filter(function (i) { return !i.feito && i.prazo && i.prazo < hoje; }).sort(porPrazo);
    var feitasHoje = itens.filter(function (i) { return i.feito && (i.tipo === "tarefa" ? feitaEm(i) === hoje : ehDeHoje(i, hoje)); });
    var ps = posts().filter(function (p) { return p.data && p.data <= hoje && (p.status !== "postado" || p.data === hoje); })
      .sort(function (a, b) { return a.data.localeCompare(b.data); });
    var total = pendentesHoje.length + feitasHoje.length;
    var html = '<p class="resumo"><b>' + feitasHoje.length + " de " + total + "</b> feitas hoje" +
      (ps.length ? " · <b>" + ps.filter(function (p) { return p.status !== "postado"; }).length + "</b> pra postar" : "") + "</p>";
    html += '<section class="secao">' + htmlCriar() + "</section>";
    html += secao("Pra postar", ps.map(function (p) { return htmlPost(p, hoje); }).join(""));
    html += secao("Atrasadas", lista(atrasadas, hoje), "atraso");
    html += secao("Hoje", lista(pendentesHoje.concat(feitasHoje), hoje) || '<div class="vazio">Nada para hoje.</div>');
    return html;
  }

  function abaPosts(hoje) {
    var todos = posts();
    var mes = hoje.slice(0, 7);
    var doMes = todos.filter(function (p) { return p.data && p.data.indexOf(mes) === 0; });
    var postados = doMes.filter(function (p) { return p.status === "postado"; });
    var dias = {};
    postados.forEach(function (p) { dias[p.data] = 1; });
    var html = '<p class="resumo"><b>' + postados.length + " de " + doMes.length + "</b> postados em " + MESES[dataDe(hoje).getMonth()] +
      " · <b>" + Object.keys(dias).length + "</b> " + (Object.keys(dias).length === 1 ? "dia" : "dias") + " com post</p>";
    var atrasados = todos.filter(function (p) { return p.data && p.data < hoje && p.status !== "postado"; }).sort(function (a, b) { return a.data.localeCompare(b.data); });
    var proximos = todos.filter(function (p) { return p.data && p.data >= hoje && p.status !== "postado"; }).sort(function (a, b) { return a.data.localeCompare(b.data); });
    var semData = todos.filter(function (p) { return !p.data && p.status !== "postado"; });
    var feitos = postados.slice().sort(function (a, b) { return b.data.localeCompare(a.data); });
    var h = function (l) { return l.map(function (p) { return htmlPost(p, hoje); }).join(""); };
    html += secao("Atrasados", h(atrasados), "atraso");
    html += secao("Próximos", h(proximos) || '<div class="vazio">Nada agendado.</div>');
    html += secao("Sem data", h(semData));
    html += secao("Postados no mês", h(feitos));
    return html;
  }

  function abaTarefas(hoje) {
    var itens = itensDeTarefa();
    var semana = somarDias(hoje, -7);
    var atrasadas = itens.filter(function (i) { return !i.feito && i.prazo && i.prazo < hoje; }).sort(porPrazo);
    var deHoje = itens.filter(function (i) { return !i.feito && ehDeHoje(i, hoje); }).sort(porPrazo);
    var proximas = itens.filter(function (i) { return !i.feito && i.inicio && i.inicio > hoje; })
      .sort(function (a, b) { return a.inicio.localeCompare(b.inicio); });
    var aFazer = itens.filter(function (i) { return !i.feito && !i.prazo; });
    var concluidas = itens.filter(function (i) { return i.feito && feitaEm(i) >= semana && feitaEm(i) <= hoje; })
      .sort(function (a, b) { return String(feitaEm(b)).localeCompare(String(feitaEm(a))); });
    var html = '<section class="secao">' + htmlCriar() + "</section>";
    html += secao("Atrasadas", lista(atrasadas, hoje), "atraso");
    html += secao("Hoje", lista(deHoje, hoje) || '<div class="vazio">Nada para hoje.</div>');
    html += secao("Próximos dias", lista(proximas, hoje));
    html += secao("A fazer", lista(aFazer, hoje));
    html += secao("Concluídas", lista(concluidas, hoje));
    return html;
  }

  function desenhar() {
    var hoje = hojeIso();
    var d = new Date();
    document.getElementById("titulo").textContent = { hoje: "Hoje", posts: "Posts", tarefas: "Tarefas" }[abaAtual];
    document.getElementById("dataHoje").textContent = DIAS_LONGOS[d.getDay()] + ", " + d.getDate() + " de " + MESES[d.getMonth()];
    document.querySelectorAll("#abas button").forEach(function (b) { b.classList.toggle("ativo", b.dataset.aba === abaAtual); });
    if (!dados) return;
    var digitado = document.getElementById("campoNova") ? document.getElementById("campoNova").value : "";
    conteudo.innerHTML = abaAtual === "posts" ? abaPosts(hoje) : abaAtual === "tarefas" ? abaTarefas(hoje) : abaHoje(hoje);
    var campo = document.getElementById("campoNova");
    if (campo) {
      campo.value = digitado;
      campo.focus();
    }
  }

  function carregar() {
    if (!chave) {
      conteudo.innerHTML = '<div class="erro"><b>Abra pelo widget</b>Este app abre tocando no widget do iPhone. Ele traz a sua chave junto.</div>';
      return Promise.resolve();
    }
    return rpc("widget_tarefas", { p_token: chave })
      .then(function (r) {
        if (!r || !Array.isArray(r.tarefas)) throw new Error("chave");
        dados = r;
        var agora = new Date();
        document.getElementById("atualizadoEm").textContent = "Atualizado às " + String(agora.getHours()).padStart(2, "0") + ":" + String(agora.getMinutes()).padStart(2, "0");
        if (concluirAoAbrir) {
          var alvo = concluirAoAbrir;
          concluirAoAbrir = "";
          var t = (dados.tarefas || []).find(function (x) { return String(x.id) === String(alvo); });
          if (t && !t.feita) marcar("tarefa", t.id, true).then(function (ok) { if (ok) avisoRapido("Feito: " + t.titulo + " ✓  Pode voltar para a tela inicial."); });
          else if (t) avisoRapido("Essa tarefa já estava feita.");
        }
        desenhar();
      })
      .catch(function (erro) {
        console.error(erro);
        if (!dados) conteudo.innerHTML = '<div class="erro"><b>Não consegui carregar</b>Confira a internet. Se continuar, a chave do widget pode ter mudado.</div>';
      });
  }

  // ---------- ações ----------
  // marca na hora e grava; se o banco recusar, desfaz
  function marcar(tipo, id, feito) {
    var alvo = tipo === "tarefa"
      ? (dados.tarefas || []).find(function (t) { return String(t.id) === String(id); })
      : (dados.producao || []).find(function (s) { return String(s.id) === String(id); });
    if (!alvo) return Promise.resolve(false);
    var antes = tipo === "tarefa" ? { feita: alvo.feita, feitaEm: alvo.feitaEm } : { concluida: alvo.concluida };
    if (tipo === "tarefa") { alvo.feita = feito; alvo.feitaEm = feito ? new Date().toISOString() : null; }
    else alvo.concluida = feito;
    desenhar();
    var chamada = tipo === "tarefa"
      ? rpc("widget_marcar_tarefa", { p_token: chave, p_id: String(id), p_feita: feito })
      : rpc("widget_marcar_etapa", { p_token: chave, p_id: String(id), p_feita: feito });
    return chamada.then(function (ok) {
      if (ok !== true) throw new Error("não salvou");
      return true;
    }).catch(function (erro) {
      Object.assign(alvo, antes);
      desenhar();
      falhou(erro);
      return false;
    });
  }

  function criarTarefa() {
    var campo = document.getElementById("campoNova");
    var titulo = campo ? campo.value.trim() : "";
    if (!titulo) return;
    var hoje = hojeIso();
    var data = novaData === "hoje" ? hoje : novaData === "amanha" ? somarDias(hoje, 1) : novaData || null;
    var botao = document.getElementById("btnAdicionarNova");
    if (botao) botao.disabled = true;
    rpc("widget_nova_tarefa", { p_token: chave, p_titulo: titulo, p_data: data })
      .then(function (nova) {
        if (!nova || !nova.id) throw new Error("não criou");
        dados.tarefas = (dados.tarefas || []).concat(nova);
        campo.value = "";
        desenhar();
        avisoRapido("Tarefa criada");
      })
      .catch(function (erro) {
        if (botao) botao.disabled = false;
        falhou(erro);
      });
  }

  // folha de status do post
  var postEmEdicao = null;
  function abrirFolha(id) {
    var p = (dados.posts || []).find(function (x) { return String(x.id) === String(id); });
    if (!p) return;
    postEmEdicao = p;
    document.getElementById("tituloFolha").textContent = p.titulo;
    document.getElementById("subFolha").textContent = "Em que pé está este " + (p.tipo === "publipost" ? "publi" : "post") + "?";
    document.getElementById("opcoesFolha").innerHTML = STATUS.map(function (s) {
      return '<button type="button" class="opcao' + (p.status === s[0] ? " atual" : "") + '" data-status="' + s[0] + '"><span>' + s[1] + "</span>" + (p.status === s[0] ? "✓" : "") + "</button>";
    }).join("");
    document.getElementById("fundoFolha").classList.add("aberta");
    document.getElementById("folhaStatus").classList.add("aberta");
  }
  function fecharFolha() {
    document.getElementById("fundoFolha").classList.remove("aberta");
    document.getElementById("folhaStatus").classList.remove("aberta");
    postEmEdicao = null;
  }
  document.getElementById("fundoFolha").addEventListener("click", fecharFolha);
  document.getElementById("opcoesFolha").addEventListener("click", function (e) {
    var b = e.target.closest("[data-status]");
    if (!b || !postEmEdicao) return;
    var p = postEmEdicao;
    var anterior = p.status;
    p.status = b.dataset.status;
    fecharFolha();
    desenhar();
    rpc("widget_status_post", { p_token: chave, p_card: String(p.id), p_status: p.status })
      .then(function (ok) {
        if (ok !== true) throw new Error("não salvou");
        avisoRapido(p.status === "postado" ? "Postado! ✓" : "Status: " + NOME_STATUS[p.status]);
      })
      .catch(function (erro) {
        p.status = anterior;
        desenhar();
        falhou(erro);
      });
  });

  document.getElementById("abas").addEventListener("click", function (e) {
    var b = e.target.closest("[data-aba]");
    if (!b) return;
    abaAtual = b.dataset.aba;
    novaAberta = false;
    history.replaceState(null, "", location.pathname + "#aba=" + abaAtual);
    desenhar();
    window.scrollTo(0, 0);
  });
  conteudo.addEventListener("click", function (e) {
    if (!dados) return;
    var m = e.target.closest("[data-marcar]");
    if (m) {
      var partes = m.dataset.marcar.split(":");
      var item = itensDeTarefa().find(function (i) { return i.tipo === partes[0] && i.id === partes.slice(1).join(":"); });
      if (item) marcar(item.tipo, item.id, !item.feito);
      return;
    }
    var p = e.target.closest("[data-post]");
    if (p) return abrirFolha(p.dataset.post);
    if (e.target.closest("[data-abrir-nova]")) { novaAberta = true; novaData = abaAtual === "tarefas" ? "" : "hoje"; desenhar(); return; }
    if (e.target.closest("[data-fechar-nova]")) { novaAberta = false; desenhar(); return; }
    var d = e.target.closest("[data-data-nova]");
    if (d) { novaData = d.dataset.dataNova; desenhar(); return; }
    if (e.target.closest("#btnAdicionarNova")) criarTarefa();
  });
  conteudo.addEventListener("change", function (e) {
    if (e.target.id === "campoDataNova" && e.target.value) { novaData = e.target.value; desenhar(); }
  });
  conteudo.addEventListener("keydown", function (e) {
    if (e.target.id === "campoNova" && e.key === "Enter") { e.preventDefault(); criarTarefa(); }
    if (e.target.id === "campoNova" && e.key === "Escape") { novaAberta = false; desenhar(); }
  });
  document.getElementById("btnAtualizar").addEventListener("click", carregar);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") carregar();
  });

  // para testes locais: MiniApp.mostrar(dadosFalsos)
  window.MiniApp = { mostrar: function (x) { dados = x; desenhar(); } };

  desenhar();
  carregar();
})();
</script>
</body>
</html>
