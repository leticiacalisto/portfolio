<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoje | Letícia Calisto</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoje">
<link rel="icon" href="../imagens/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../imagens/icone-180.png">
<style>
/* =========================================================
   MINI APP (abre ao tocar nos widgets do iPhone)
   Visual de app nativo do iPhone: fundo agrupado, cartões
   brancos, fonte do sistema, a cor da marca como destaque.
   Lê com a chave do widget (js/widget-tarefas-setup.sql).
   ========================================================= */
:root{
  --fundo:#F2F2F7; --cartao:#FFFFFF; --texto:#1C1C1E; --suave:#8E8E93; --linha:rgba(60,60,67,.14);
  --destaque:#E2557F; --destaque-claro:#FFE4EC; --amarelo:#F2B21B; --amarelo-claro:#FFF3C9; --vermelho:#D70015; --vermelho-claro:#FDE7E9;
  --verde:#248A3D; --verde-claro:#E3F5E8; --lilas:#6B5BA8; --lilas-claro:#EFEBF8; --terra:#B4532A; --terra-claro:#FBEBE2;
  --cinza-claro:#E9E9EE;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --fundo:#000000; --cartao:#1C1C1E; --texto:#F5F5F7; --suave:#98989D; --linha:rgba(84,84,88,.6);
    --destaque:#FF8FB0; --destaque-claro:#3A1A26; --amarelo:#FFD25E; --amarelo-claro:#3A3015; --vermelho:#FF6961; --vermelho-claro:#3B1517;
    --verde:#30D158; --verde-claro:#12301B; --lilas:#B4A6EC; --lilas-claro:#26213A; --terra:#F0956B; --terra-claro:#3A2219;
    --cinza-claro:#2C2C2E;
  }
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--sans);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;}
[hidden]{display:none !important;}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px);}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--destaque);}
h1{margin:2px 0 4px;font-size:2.1rem;font-weight:700;letter-spacing:-.025em;line-height:1.1;}
.sub-titulo{margin:0 0 16px;color:var(--suave);font-size:.95rem;}

/* Controle segmentado, igual ao do iPhone */
.segmentado{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;margin:0 0 20px;border-radius:9px;background:var(--cinza-claro);}
.segmentado button{border:0;background:none;padding:7px 0;border-radius:7px;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--texto);}
.segmentado button.ativo{background:var(--cartao);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.08);}

/* Resumo no topo */
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.bloco-resumo{padding:12px 14px;border-radius:12px;background:var(--cartao);}
.bloco-resumo .icone{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:.85rem;font-weight:700;}
.bloco-resumo b{float:right;font-size:1.6rem;font-weight:700;line-height:1;letter-spacing:-.02em;}
.bloco-resumo span{display:block;margin-top:8px;font-size:.88rem;font-weight:600;color:var(--suave);}
.barra{height:6px;border-radius:99px;background:var(--cinza-claro);overflow:hidden;margin-top:10px;clear:both;}
.barra i{display:block;height:100%;border-radius:99px;background:var(--verde);}

/* Listas agrupadas */
.secao{margin-bottom:24px;}
.titulo-secao{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 7px;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--suave);}
.grupo{border-radius:12px;background:var(--cartao);overflow:hidden;}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;}
.item + .item::before{content:"";position:absolute;top:0;left:50px;right:0;height:1px;background:var(--linha);}
.grupo.sem-check .item + .item::before{left:14px;}
.corpo{flex:1;min-width:0;}
.titulo-item{font-size:1rem;line-height:1.3;}
.detalhe{margin-top:2px;font-size:.8rem;color:var(--suave);}
.lado{flex:none;font-size:.82rem;color:var(--suave);text-align:right;}
.lado.atraso{color:var(--vermelho);font-weight:600;}
.vazio{padding:16px 14px;color:var(--suave);font-size:.92rem;}

/* Círculo de concluir, como nos Lembretes */
.check{flex:none;width:24px;height:24px;border-radius:50%;border:1.6px solid #C7C7CC;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;}
.check.atrasada{border-color:var(--vermelho);}
.check.feita{background:var(--destaque);border-color:var(--destaque);}
.check.feita::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
.check:disabled{cursor:default;}
.item.concluida .titulo-item{color:var(--suave);text-decoration:line-through;}
.bolinha-producao{flex:none;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;}
.bolinha-producao::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--lilas);}

/* Etiquetas */
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:700;letter-spacing:.02em;}
.chip.hoje{background:var(--destaque);color:#fff;}
.chip.atraso{background:var(--vermelho-claro);color:var(--vermelho);}
.chip.post{background:var(--lilas-claro);color:var(--lilas);}
.chip.publipost{background:var(--terra-claro);color:var(--terra);}
.status{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:600;background:var(--cinza-claro);color:var(--suave);white-space:nowrap;}
.status.postado{background:var(--verde-claro);color:var(--verde);}
.status.atrasado{background:var(--vermelho-claro);color:var(--vermelho);}
.data-post{flex:none;width:44px;text-align:center;}
.data-post small{display:block;font-size:.7rem;color:var(--suave);text-transform:uppercase;}
.data-post b{display:block;font-size:1.15rem;font-weight:600;}
.data-post.hoje b{color:var(--destaque);}
.linha-chips{display:flex;align-items:center;gap:6px;margin-bottom:3px;}

.rodape{margin-top:26px;text-align:center;font-size:.82rem;color:var(--suave);}
.rodape a{color:var(--destaque);text-decoration:none;font-weight:600;}
.btn-atualizar{border:0;background:none;color:var(--destaque);font-weight:600;font-size:.82rem;cursor:pointer;padding:4px;}
.aviso-rapido{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%, 20px);opacity:0;padding:12px 18px;border-radius:14px;background:rgba(30,30,32,.92);color:#fff;font-size:.9rem;font-weight:500;max-width:calc(100% - 40px);text-align:center;transition:all .25s ease;pointer-events:none;}
.aviso-rapido.visivel{opacity:1;transform:translate(-50%, 0);}
.carregando,.erro{padding:60px 20px;text-align:center;color:var(--suave);}
.erro b{display:block;margin-bottom:6px;color:var(--texto);font-size:1.05rem;}
</style>
</head>
<body>
<main class="app">
  <div class="eyebrow" id="eyebrow">Letícia Calisto</div>
  <h1 id="titulo">Hoje</h1>
  <p class="sub-titulo" id="subtitulo"></p>

  <nav class="segmentado" id="abas" role="tablist">
    <button type="button" data-aba="hoje" class="ativo">Hoje</button>
    <button type="button" data-aba="posts">Posts</button>
    <button type="button" data-aba="tarefas">Tarefas</button>
  </nav>

  <div id="conteudo"><p class="carregando">Carregando…</p></div>
  <div class="aviso-rapido" id="avisoRapido" role="status"></div>

  <p class="rodape">
    <span id="atualizadoEm"></span> · <button type="button" class="btn-atualizar" id="btnAtualizar">Atualizar</button><br><br>
    <a href="../painel.html?aba=gp-tarefas">Abrir o painel</a>
  </p>
</main>

<script>
(function () {
  var SUPABASE_URL = "https://yqshjfzcoyiqikjnukyb.supabase.co";
  var SUPABASE_ANON =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxc2hqZnpjb3lpcWlram51a3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzIzNDgsImV4cCI6MjEwNDU0ODM0OH0.QBseFaGdtG_6g2c_7EUeGnbhb9_JIa0hBsA2AzGnkp4";
  var CHAVE_LOCAL = "miniAppChave";
  var DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  var DIAS_LONGOS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  var MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  var STATUS = { afazer: "A fazer", roteiro: "Roteiro pronto", gravado: "Gravado", editado: "Editado", postado: "Postado" };

  // ---------- chave: vem no link do widget (#k=...) e fica guardada neste aparelho ----------
  var params = new URLSearchParams(location.hash.slice(1));
  var chave = params.get("k") || "";
  var abaInicial = params.get("aba") || "hoje";
  var concluirAoAbrir = params.get("concluir") || ""; // tocou numa tarefa no widget
  try {
    if (chave) localStorage.setItem(CHAVE_LOCAL, chave);
    else chave = localStorage.getItem(CHAVE_LOCAL) || "";
  } catch (e) {}
  // tira a chave da barra de endereço (para não ir junto se você compartilhar o link)
  if (params.get("k") || concluirAoAbrir) history.replaceState(null, "", location.pathname + "#aba=" + abaInicial);

  var dados = null;
  var abaAtual = abaInicial;
  var conteudo = document.getElementById("conteudo");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isoDe(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dataDe(iso) {
    var p = String(iso).slice(0, 10).split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function diasEntre(a, b) {
    return Math.round((dataDe(b) - dataDe(a)) / 86400000);
  }
  function somarDias(iso, n) {
    var d = dataDe(iso);
    d.setDate(d.getDate() + n);
    return isoDe(d);
  }
  function quando(iso, hoje) {
    var dif = diasEntre(hoje, iso);
    if (dif === 0) return "hoje";
    if (dif === 1) return "amanhã";
    if (dif === -1) return "ontem";
    if (dif < 0) return "há " + -dif + " dias";
    if (dif < 7) return DIAS[dataDe(iso).getDay()];
    var d = dataDe(iso);
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
  }

  function rpc(nome, corpo) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + nome, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON, "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  // ---------- organizar ----------
  function tarefasOrganizadas(hoje) {
    var itens = [];
    (dados.tarefas || []).forEach(function (t) {
      if (!t || !t.data) return;
      itens.push({ id: t.id, titulo: t.titulo || "(sem título)", sub: "", inicio: t.data, prazo: t.data, feito: !!t.feita, feitoEm: t.feitaEm || null, checklist: true });
    });
    (dados.producao || []).forEach(function (s) {
      if (!s || !s.fim) return;
      itens.push({ titulo: s.nome || "Etapa", sub: s.video || "", inicio: String(s.inicio || s.fim).slice(0, 10), prazo: String(s.fim).slice(0, 10), feito: !!s.concluida, checklist: false });
    });
    return itens;
  }
  function postsOrganizados() {
    return (dados.posts || []).map(function (p) {
      return Object.assign({}, p, { data: p.data ? String(p.data).slice(0, 10) : null });
    });
  }

  // ---------- peças ----------
  function htmlTarefa(i, hoje) {
    var atrasada = !i.feito && i.prazo < hoje;
    var marcador = i.checklist
      ? '<button type="button" class="check' + (i.feito ? " feita" : "") + (atrasada ? " atrasada" : "") + '" data-check="' + esc(i.id) + '" aria-label="' + (i.feito ? "Desmarcar" : "Concluir") + '"></button>'
      : '<span class="bolinha-producao" title="Etapa de produção"></span>';
    var lado = atrasada ? '<span class="lado atraso">' + quando(i.prazo, hoje) + "</span>"
      : i.inicio > hoje ? '<span class="lado">' + quando(i.inicio, hoje) + "</span>" : "";
    var detalhe = i.checklist ? "" : "Produção" + (i.sub ? " · " + esc(i.sub) : "");
    return '<div class="item' + (i.feito ? " concluida" : "") + '">' + marcador +
      '<div class="corpo"><div class="titulo-item">' + esc(i.titulo) + "</div>" + (detalhe ? '<div class="detalhe">' + detalhe + "</div>" : "") + "</div>" + lado + "</div>";
  }
  function htmlPost(p, hoje) {
    var atrasado = p.data && p.data < hoje && p.status !== "postado";
    var d = p.data ? dataDe(p.data) : null;
    var data = d
      ? '<div class="data-post' + (p.data === hoje ? " hoje" : "") + '"><small>' + DIAS[d.getDay()] + "</small><b>" + d.getDate() + "</b></div>"
      : '<div class="data-post"><small>sem</small><b>—</b></div>';
    var chipTipo = '<span class="chip ' + (p.tipo === "publipost" ? "publipost" : "post") + '">' + (p.tipo === "publipost" ? "Publi" : "Post") + "</span>";
    var chipQuando = p.data === hoje && p.status !== "postado" ? '<span class="chip hoje">HOJE</span>' : atrasado ? '<span class="chip atraso">' + quando(p.data, hoje).toUpperCase() + "</span>" : "";
    return '<div class="item">' + data +
      '<div class="corpo"><div class="linha-chips">' + chipTipo + chipQuando + (p.marca ? '<span class="detalhe" style="margin:0">' + esc(p.marca) + "</span>" : "") + "</div>" +
      '<div class="titulo-item">' + esc(p.titulo) + "</div></div>" +
      '<span class="status ' + (p.status === "postado" ? "postado" : atrasado ? "atrasado" : "") + '">' + (p.status === "postado" ? "✓ " : "") + esc(STATUS[p.status] || "") + "</span></div>";
  }
  function secao(titulo, itensHtml, classeGrupo, direita) {
    return '<section class="secao"><div class="titulo-secao"><span>' + titulo + "</span>" + (direita ? "<span>" + direita + "</span>" : "") + "</div>" +
      '<div class="grupo ' + (classeGrupo || "") + '">' + (itensHtml || '<div class="vazio">Nada por aqui.</div>') + "</div></section>";
  }

  // ---------- abas ----------
  function desenharHoje(hoje) {
    var itens = tarefasOrganizadas(hoje);
    var deHoje = itens.filter(function (i) { return i.inicio <= hoje && i.prazo >= hoje; });
    var atrasadas = itens.filter(function (i) { return !i.feito && i.prazo < hoje; });
    var feitasHoje = itens.filter(function (i) { return i.feito && ((i.feitoEm && isoDe(new Date(i.feitoEm)) === hoje) || (!i.feitoEm && i.inicio <= hoje && i.prazo >= hoje)); });
    var feitas = feitasHoje.length;
    var total = deHoje.filter(function (i) { return !i.feito; }).length + feitas;
    var posts = postsOrganizados();
    var postsHoje = posts.filter(function (p) { return p.data && p.data <= hoje && p.status !== "postado"; })
      .sort(function (a, b) { return a.data.localeCompare(b.data); });
    var postadosHoje = posts.filter(function (p) { return p.data === hoje && p.status === "postado"; });

    var html = '<div class="resumo">' +
      '<div class="bloco-resumo"><span class="icone" style="background:var(--amarelo)">✓</span><b>' + feitas + "/" + total + "</b><span>Tarefas de hoje</span>" +
      '<div class="barra"><i style="width:' + (total ? (feitas / total) * 100 : 0) + '%"></i></div></div>' +
      '<div class="bloco-resumo"><span class="icone" style="background:var(--destaque)">▶</span><b>' + postsHoje.length + "</b><span>Pra postar</span></div>" +
      "</div>";
    html += secao("Pra postar", postsHoje.concat(postadosHoje).map(function (p) { return htmlPost(p, hoje); }).join(""), "sem-check");
    var lista = atrasadas.concat(deHoje.filter(function (i) { return i.prazo >= hoje; }))
      .sort(function (a, b) { return (a.feito - b.feito) || a.prazo.localeCompare(b.prazo); });
    html += secao("Tarefas", lista.map(function (i) { return htmlTarefa(i, hoje); }).join(""));
    return html;
  }

  function desenharPosts(hoje) {
    var posts = postsOrganizados();
    var mes = hoje.slice(0, 7);
    var doMes = posts.filter(function (p) { return p.data && p.data.indexOf(mes) === 0; });
    var postados = doMes.filter(function (p) { return p.status === "postado"; }).length;
    var nomeMes = MESES[dataDe(hoje).getMonth()];
    var html = '<div class="resumo" style="grid-template-columns:1fr">' +
      '<div class="bloco-resumo"><span class="icone" style="background:var(--verde)">✓</span><b>' + postados + " de " + doMes.length + "</b><span>Postados em " + nomeMes + "</span>" +
      '<div class="barra"><i style="width:' + (doMes.length ? (postados / doMes.length) * 100 : 0) + '%"></i></div></div></div>';

    // atrasados + deste mês em diante, agrupados por semana
    var inicioMes = mes + "-01";
    var comData = posts.filter(function (p) { return p.data && (p.data >= inicioMes || p.status !== "postado"); })
      .sort(function (a, b) { return a.data.localeCompare(b.data); });
    var semanas = [];
    comData.forEach(function (p) {
      var d = dataDe(p.data);
      var seg = somarDias(p.data, -((d.getDay() + 6) % 7));
      var ultima = semanas[semanas.length - 1];
      if (!ultima || ultima.chave !== seg) semanas.push({ chave: seg, posts: [p] });
      else ultima.posts.push(p);
    });
    if (!semanas.length) html += secao("Posts", "", "sem-check");
    semanas.forEach(function (s) {
      var d = dataDe(s.chave);
      var titulo = "Semana de seg, " + String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
      html += secao(titulo, s.posts.map(function (p) { return htmlPost(p, hoje); }).join(""), "sem-check");
    });
    var semData = posts.filter(function (p) { return !p.data && p.status !== "postado"; });
    if (semData.length) html += secao("Sem data de publicação", semData.map(function (p) { return htmlPost(p, hoje); }).join(""), "sem-check");
    return html;
  }

  function desenharTarefas(hoje) {
    var itens = tarefasOrganizadas(hoje);
    var limite = somarDias(hoje, 14);
    var atrasadas = itens.filter(function (i) { return !i.feito && i.prazo < hoje; }).sort(function (a, b) { return a.prazo.localeCompare(b.prazo); });
    var html = atrasadas.length ? secao("Atrasadas", atrasadas.map(function (i) { return htmlTarefa(i, hoje); }).join(""), "", atrasadas.length) : "";
    for (var n = 0; n <= 14; n++) {
      var dia = somarDias(hoje, n);
      var doDia = itens.filter(function (i) {
        return i.prazo >= hoje && (n === 0 ? i.inicio <= dia && i.prazo >= dia : i.inicio === dia);
      });
      if (!doDia.length) continue;
      var d = dataDe(dia);
      var titulo = n === 0 ? "Hoje" : n === 1 ? "Amanhã" : DIAS_LONGOS[d.getDay()] + ", " + d.getDate() + "/" + String(d.getMonth() + 1).padStart(2, "0");
      html += secao(titulo, doDia.sort(function (a, b) { return a.feito - b.feito; }).map(function (i) { return htmlTarefa(i, hoje); }).join(""));
    }
    if (!html) html = secao("Próximas duas semanas", "");
    return html;
  }

  function desenhar() {
    var hoje = isoDe(new Date());
    var d = new Date();
    var titulos = { hoje: "Hoje", posts: "Posts", tarefas: "Tarefas" };
    document.getElementById("titulo").textContent = titulos[abaAtual];
    document.getElementById("subtitulo").textContent = DIAS_LONGOS[d.getDay()] + ", " + d.getDate() + " de " + MESES[d.getMonth()];
    document.querySelectorAll("#abas button").forEach(function (b) { b.classList.toggle("ativo", b.dataset.aba === abaAtual); });
    if (!dados) return;
    conteudo.innerHTML = abaAtual === "posts" ? desenharPosts(hoje) : abaAtual === "tarefas" ? desenharTarefas(hoje) : desenharHoje(hoje);
  }

  function carregar() {
    if (!chave) {
      conteudo.innerHTML = '<div class="erro"><b>Abra pelo widget</b>Este app abre tocando no widget do iPhone. Ele traz a sua chave junto.</div>';
      return Promise.resolve();
    }
    return rpc("widget_tarefas", { p_token: chave })
      .then(function (r) {
        if (!r || !Array.isArray(r.tarefas)) throw new Error("chave");
        dados = r;
        if (concluirAoAbrir) {
          var alvo = concluirAoAbrir;
          concluirAoAbrir = "";
          var tarefa = (dados.tarefas || []).find(function (t) { return String(t.id) === String(alvo); });
          if (tarefa && !tarefa.feita) {
            marcarTarefa(tarefa.id, true).then(function (t) {
              if (t) avisoRapido("Feito: " + t.titulo + " ✓  Pode voltar para a tela inicial.");
            });
          } else if (tarefa) {
            avisoRapido("Essa tarefa já estava feita.");
          }
        }
        var agora = new Date();
        document.getElementById("atualizadoEm").textContent = "Atualizado às " + String(agora.getHours()).padStart(2, "0") + ":" + String(agora.getMinutes()).padStart(2, "0");
        desenhar();
      })
      .catch(function (erro) {
        console.error(erro);
        if (!dados) conteudo.innerHTML = '<div class="erro"><b>Não consegui carregar</b>Confira a internet. Se continuar, a chave do widget pode ter mudado.</div>';
      });
  }

  // ---------- ações ----------
  document.getElementById("abas").addEventListener("click", function (e) {
    var b = e.target.closest("[data-aba]");
    if (!b) return;
    abaAtual = b.dataset.aba;
    history.replaceState(null, "", location.pathname + "#aba=" + abaAtual);
    desenhar();
    window.scrollTo(0, 0);
  });
  document.getElementById("btnAtualizar").addEventListener("click", carregar);
  var timerAviso = null;
  function avisoRapido(texto) {
    var el = document.getElementById("avisoRapido");
    el.textContent = texto;
    el.classList.add("visivel");
    clearTimeout(timerAviso);
    timerAviso = setTimeout(function () { el.classList.remove("visivel"); }, 2600);
  }
  // marca (ou desmarca) na hora; se o banco recusar, desfaz
  function marcarTarefa(id, nova) {
    var tarefa = (dados.tarefas || []).find(function (t) { return String(t.id) === String(id); });
    if (!tarefa) return Promise.resolve(false);
    tarefa.feita = nova;
    tarefa.feitaEm = nova ? new Date().toISOString() : null;
    desenhar();
    return rpc("widget_marcar_tarefa", { p_token: chave, p_id: String(id), p_feita: nova })
      .then(function (ok) {
        if (ok !== true) throw new Error("não marcou");
        return tarefa;
      })
      .catch(function (erro) {
        console.error(erro);
        tarefa.feita = !nova;
        tarefa.feitaEm = null;
        desenhar();
        alert("Não consegui salvar. Confira a internet e tente de novo.");
        return false;
      });
  }
  conteudo.addEventListener("click", function (e) {
    var b = e.target.closest("[data-check]");
    if (!b || !dados) return;
    var tarefa = (dados.tarefas || []).find(function (t) { return String(t.id) === b.dataset.check; });
    if (tarefa) marcarTarefa(tarefa.id, !tarefa.feita);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") carregar();
  });

  // para testes locais: MiniApp.mostrar(dadosFalsos)
  window.MiniApp = { mostrar: function (d) { dados = d; desenhar(); }, avisoRapido: avisoRapido };

  desenhar();
  carregar();
})();
</script>
</body>
</html>
